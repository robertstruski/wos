ny Zjednoczone — system prezydencki","text":"USA to **republika federalna** złożona z 50 stanów, działająca na podstawie **konstytucji z 1787 r.** — najstarszej obowiązującej na świecie. To wzorcowy **system prezydencki**.\n\n**Prezydent** jest jednocześnie głową państwa i szefem rządu — nie ma osobnego premiera. Wybiera się go na **4 lata**, najwyżej dwukrotnie. Wybory są **pośrednie**: obywatele głosują na **elektorów**, których jest **538**, a do zwycięstwa trzeba **270 głosów**. W większości stanów zwycięzca bierze wszystkich tamtejszych elektorów, dlatego można wygrać wybory, mając w skali kraju mniej głosów od rywala.\n\n**Kongres** ma dwie izby: **Izbę Reprezentantów** (**435 członków** na 2 lata, liczba mandatów zależy od ludności stanu) i **Senat** (**100 senatorów** na 6 lat, po dwóch z każdego stanu).\n\nUstrój opiera się na **hamulcach i równowadze**. Prezydent nie może rozwiązać Kongresu, a Kongres nie może go odwołać wotum nieufności — jedyną drogą jest **impeachment**: oskarża Izba Reprezentantów, sądzi Senat większością 2/3. Prezydent może **zawetować** ustawę, ale Kongres odrzuca weto większością 2/3 w obu izbach.\n\n**Sąd Najwyższy** liczy **9 sędziów** powoływanych **dożywotnio**. Utrwalił się **system dwupartyjny**: Demokraci i Republikanie."},{"id":"wielka-brytania","title":"Wielka Brytania — monarchia parlamentarna","text":"Wielka Brytania to **monarchia parlamentarna** i państwo **unitarne**, choć ze znaczną samodzielnością Szkocji, Walii i Irlandii Północnej.\n\nNajbardziej charakterystyczny jest **brak jednego spisanego aktu konstytucyjnego**. Konstytucję tworzą ustawy o szczególnym znaczeniu, orzeczenia sądów i **konwenanse konstytucyjne** — niepisane zwyczaje przestrzegane jak prawo. Naczelną zasadą jest **suwerenność parlamentu**: może on uchwalić dowolną ustawę, a żaden sąd jej nie uchyli.\n\n**Monarcha** panuje, ale nie rządzi — jego rola jest ceremonialna.\n\n**Izba Gmin** liczy **650 posłów** wybieranych w **okręgach jednomandatowych** systemem większościowym: mandat bierze ten, kto ma najwięcej głosów, choćby nie miał połowy. Taka ordynacja premiuje dwie największe partie i dlatego utrwalił się tu **system dwupartyjny**. **Izba Lordów** nie pochodzi z wyborów — zasiadają w niej lordowie dożywotni i biskupi — i może ustawę jedynie opóźnić.\n\n**Premierem** zostaje lider partii mającej większość w Izbie Gmin; opozycja tworzy **gabinet cieni**. Odrębny Sąd Najwyższy powstał dopiero w 2009 r., a w 2020 r. kraj opuścił Unię Europejską (**brexit**)."},{"id":"francja","title":"Francja — system półprezydencki","text":"Francja to **republika** o ustroju **półprezydenckim (mieszanym)**, działająca na podstawie konstytucji **V Republiki z 1958 r.** Ustrój łączy cechy systemu prezydenckiego i parlamentarnego: obok silnego prezydenta istnieje rząd z premierem, odpowiedzialny przed parlamentem.\n\n**Prezydent** wybierany jest bezpośrednio na **5 lat** (do 2000 r. kadencja trwała 7 lat), w dwóch turach. Jego uprawnienia są szerokie: powołuje premiera, przewodniczy Radzie Ministrów, dowodzi siłami zbrojnymi, może **rozwiązać Zgromadzenie Narodowe** i zarządzić referendum.\n\n**Zgromadzenie Narodowe** liczy **577 deputowanych** wybieranych na 5 lat większościowo w dwóch turach. **Senat** — **348 senatorów** wybieranych **pośrednio**, przez samorządowców, na 6 lat.\n\nFrancuską specyfiką jest **kohabitacja**: sytuacja, w której prezydent i większość parlamentarna pochodzą z przeciwnych obozów. Prezydent musi wtedy powołać premiera z obozu przeciwnego, a jego realna władza słabnie — zachowuje wpływ głównie na politykę zagraniczną i obronną.\n\nZgodności ustaw z konstytucją pilnuje **Rada Konstytucyjna**."},{"id":"niemcy","title":"Niemcy — system kanclerski","text":"Niemcy to **republika federalna** złożona z **16 krajów związkowych**, działająca na podstawie **Ustawy Zasadniczej z 1949 r.** Ustrój nazywa się **systemem kanclerskim** — to odmiana systemu parlamentarnego z bardzo silną pozycją szefa rządu.\n\n**Kanclerz** kieruje rządem i wyznacza kierunki polityki. Jego pozycję chroni **konstruktywne wotum nieufności**: parlament może go odwołać tylko wtedy, gdy jednocześnie wybierze następcę. Rozwiązanie to, wprowadzone po doświadczeniach Republiki Weimarskiej, przejęła później polska konstytucja.\n\n**Prezydent federalny** pełni funkcje reprezentacyjne i nie pochodzi z wyborów powszechnych — wybiera go Zgromadzenie Federalne na 5 lat.\n\n**Bundestag** liczy od 2025 r. **630 posłów**. Ordynacja jest **mieszana**: wyborca oddaje dwa głosy — pierwszy na kandydata w jednym z **299 okręgów jednomandatowych**, drugi na listę partyjną, i to **drugi głos decyduje** o podziale mandatów. Próg wynosi **5%** albo trzy mandaty bezpośrednie.\n\n**Bundesrat** reprezentuje kraje związkowe, a jego członkowie nie są wybierani, lecz delegowani przez rządy krajowe. Nad konstytucyjnością prawa czuwa **Federalny Trybunał Konstytucyjny** w Karlsruhe."},{"id":"rosja","title":"Rosja — system superprezydencki","text":"Rosja jest formalnie **republiką federalną** działającą na podstawie **konstytucji z 1993 r.** Ustrój nazywa się **superprezydenckim**, bo choć na papierze przypomina francuski model półprezydencki, prezydent skupia władzę w stopniu nieporównywalnie większym.\n\n**Prezydent** wybierany jest na **6 lat**. Powołuje rząd, kieruje polityką zagraniczną i obronną, może rozwiązać Dumę i wydawać dekrety z mocą prawa. **Poprawki z 2020 r.** wyzerowały dotychczasowe kadencje urzędującego prezydenta, umożliwiając mu ponowne kandydowanie.\n\nParlament, czyli **Zgromadzenie Federalne**, tworzą **Duma Państwowa** (450 deputowanych na 5 lat) i **Rada Federacji**. W praktyce nie pełni on funkcji kontrolnej wobec władzy wykonawczej.\n\nNajważniejsze jest rozróżnienie tekstu konstytucji od rzeczywistości. Rosja jest klasyfikowana jako **państwo autorytarne**: wybory odbywają się regularnie, ale bez realnej rywalizacji, opozycja jest eliminowana, media pozostają pod kontrolą, a sądy nie są niezależne. Formalna federacja została mocno **scentralizowana**.\n\nTo dobry przykład zasady, że sam zapis w konstytucji nie przesądza o charakterze ustroju."},{"id":"szwajcaria","title":"Szwajcaria — system komitetowy","text":"Szwajcaria to **republika federalna** złożona z **26 kantonów**, o ustroju wyjątkowym w skali świata — **systemie komitetowym**, zwanym też rządami zgromadzenia.\n\nWładzę wykonawczą sprawuje **Rada Federalna** — kolegialny organ **7 członków** wybieranych przez parlament na 4 lata, podejmujący decyzje wspólnie. **Prezydent Konfederacji** wybierany jest spośród nich **na jeden rok**, rotacyjnie, i jest jedynie pierwszym wśród równych.\n\nSkład Rady od dekad odzwierciedla **formułę magiczną** — nieformalną zasadę stałego podziału miejsc między największe partie. Dlatego nie ma tu podziału na rząd i opozycję, a decyzje zapadają w drodze porozumienia.\n\nParlament tworzą **Rada Narodowa** (**200 członków**, proporcjonalnie do ludności kantonów) i **Rada Kantonów** (**46 członków**, po dwóch z kantonu).\n\nNajbardziej znana jest szwajcarska **demokracja bezpośrednia**. Obywatele mogą zgłosić **inicjatywę ludową** zmieniającą konstytucję (100 tysięcy podpisów) oraz skorzystać z **weta ludowego**, poddając pod głosowanie uchwaloną już ustawę (50 tysięcy podpisów w 100 dni). Szwajcaria utrzymuje **neutralność** i pozostaje poza Unią Europejską."},{"id":"wlochy","title":"Włochy — republika parlamentarna","text":"Włochy to **republika parlamentarna** działająca na podstawie **konstytucji z 1948 r.**, uchwalonej po upadku faszyzmu i zniesieniu monarchii.\n\n**Prezydent** wybierany jest na **7 lat** — najdłużej spośród omawianych państw — nie przez obywateli, lecz przez połączone izby parlamentu z przedstawicielami regionów. Jego funkcje są zwykle reprezentacyjne, ale w kryzysie rosną: desygnuje premiera i może rozwiązać parlament.\n\nRząd musi cieszyć się zaufaniem parlamentu. Włoską specyfiką jest **bikameralizm symetryczny** — obie izby mają **równe uprawnienia**, a rząd potrzebuje wotum zaufania **każdej z nich** osobno; ustawę trzeba uchwalić w obu w identycznym brzmieniu.\n\nTo rozwiązanie w połączeniu z rozdrobnieniem partyjnym sprawia, że Włochy słyną z **niestabilności rządów** — od 1948 r. gabinety zmieniały się średnio częściej niż co dwa lata.\n\nPo referendum z 2020 r. parlament wyraźnie zmniejszono: od 2022 r. **Izba Deputowanych** liczy **400 członków** (wcześniej 630), a **Senat** **200** (wcześniej 315). Włochy są państwem **unitarnym**, ale silnie zregionalizowanym — pięć z 20 regionów ma status specjalny."},{"id":"chiny","title":"Chiny — system monopartyjny","text":"Chińska Republika Ludowa to **państwo socjalistyczne** rządzone niepodzielnie przez **Komunistyczną Partię Chin**. Nie ma tu podziału władz, wolnych wyborów ani pluralizmu politycznego.\n\nKluczowe dla zrozumienia tego ustroju jest odróżnienie struktur państwowych od partyjnych — **realna władza leży po stronie partii**.\n\nFormalnie najwyższym organem władzy państwowej jest **Ogólnochińskie Zgromadzenie Przedstawicieli Ludowych**, liczące blisko **3 tysiące deputowanych**. Zbiera się jednak raz w roku na kilkanaście dni i w praktyce zatwierdza decyzje podjęte wcześniej przez kierownictwo partii.\n\nOśrodkiem faktycznej władzy jest **Biuro Polityczne** Komitetu Centralnego KPCh, a zwłaszcza jego wąski **Stały Komitet**. Najważniejszym stanowiskiem w państwie nie jest urząd przewodniczącego ChRL, lecz funkcja **sekretarza generalnego partii**; duże znaczenie ma też przewodniczenie **Centralnej Komisji Wojskowej**, dającej kontrolę nad armią.\n\nW **2018 r. zniesiono limit dwóch kadencji** przewodniczącego ChRL, co umożliwiło sprawowanie urzędu bezterminowo. Wobec Hongkongu i Makau stosowana jest zasada **jeden kraj, dwa systemy**, choć jej zakres w ostatnich latach wyraźnie się skurczył."}],"concepts":[{"term":"System prezydencki","def":"Prezydent jest głową państwa i szefem rządu, a parlament nie może go odwołać wotum nieufności — jak w USA."},{"term":"System parlamentarno-gabinetowy","def":"Rząd wyłania parlament i przed nim odpowiada; głowa państwa pełni funkcje reprezentacyjne — jak we Włoszech."},{"term":"System półprezydencki","def":"Silny prezydent z wyborów powszechnych współistnieje z rządem odpowiedzialnym przed parlamentem — jak we Francji."},{"term":"System kanclerski","def":"Odmiana systemu parlamentarnego z bardzo silną pozycją szefa rządu — jak w Niemczech."},{"term":"System komitetowy","def":"Władzę wykonawczą sprawuje kolegialny organ wybierany przez parlament — jak w Szwajcarii."},{"term":"System monopartyjny","def":"Ustrój z jedną legalną partią sprawującą niepodzielną władzę — jak w Chinach."},{"term":"Impeachment","def":"Procedura usunięcia prezydenta USA: oskarża Izba Reprezentantów, sądzi Senat większością 2/3."},{"term":"Konstytucja niepisana","def":"Brak jednego spisanego aktu — konstytucję tworzą ustawy, orzeczenia sądów i konwenanse, jak w Wielkiej Brytanii."},{"term":"Kohabitacja","def":"Sytuacja we Francji, gdy prezydent i większość parlamentarna pochodzą z przeciwnych obozów."},{"term":"Konstruktywne wotum nieufności","def":"Odwołanie szefa rządu możliwe tylko z jednoczesnym wyborem następcy — rozwiązanie niemieckie, przejęte przez Polskę."}],"numbers":[{"label":"USA — Izba Reprezentantów","value":"435 (2 lata)"},{"label":"USA — Senat","value":"100 (6 lat)"},{"label":"USA — kolegium elektorów","value":"538 (próg 270)"},{"label":"USA — kadencja prezydenta","value":"4 lata, max 2"},{"label":"USA — Sąd Najwyższy","value":"9 sędziów, dożywotnio"},{"label":"Wielka Brytania — Izba Gmin","value":"650 posłów"},{"label":"Francja — Zgromadzenie Narodowe","value":"577 (5 lat)"},{"label":"Francja — Senat","value":"348 (6 lat, wybór pośredni)"},{"label":"Francja — kadencja prezydenta","value":"5 lat"},{"label":"Niemcy — Bundestag","value":"630 posłów"},{"label":"Niemcy — okręgi jednomandatowe","value":"299"},{"label":"Niemcy — próg wyborczy","value":"5% lub 3 mandaty bezpośrednie"},{"label":"Niemcy — kraje związkowe","value":"16"},{"label":"Rosja — Duma Państwowa","value":"450 (5 lat)"},{"label":"Rosja — kadencja prezydenta","value":"6 lat"},{"label":"Szwajcaria — Rada Federalna","value":"7 członków"},{"label":"Szwajcaria — kadencja prezydenta","value":"1 rok, rotacyjnie"},{"label":"Szwajcaria — Rada Narodowa / Rada Kantonów","value":"200 / 46"},{"label":"Szwajcaria — inicjatywa ludowa","value":"100 000 podpisów"},{"label":"Szwajcaria — weto ludowe","value":"50 000 podpisów w 100 dni"},{"label":"Włochy — Izba Deputowanych","value":"400 (od 2022)"},{"label":"Włochy — Senat","value":"200 (od 2022)"},{"label":"Włochy — kadencja prezydenta","value":"7 lat"},{"label":"Chiny — OZPL","value":"ok. 3000 deputowanych"},{"label":"Chiny — zniesienie limitu kadencji","value":"2018 r."}],"cases":[{"situation":"W państwie X prezydent pochodzi z wyborów powszechnych i ma silne uprawnienia, w tym prawo rozwiązania izby niższej. Po wyborach parlamentarnych większość zdobywa jednak obóz opozycyjny wobec prezydenta i to on formuje rząd. Prezydent musi powołać premiera wskazanego przez tę większość.","question":"Jak nazywa się ta sytuacja, w jakim systemie występuje i co dzieje się z władzą prezydenta?","answer":"To kohabitacja, charakterystyczna dla systemu półprezydenckiego, którego modelowym przykładem jest Francja. Prezydent zachowuje urząd i formalne uprawnienia, ale jego realny wpływ na politykę wewnętrzną wyraźnie maleje, bo rząd opiera się na wrogiej mu większości parlamentarnej. W praktyce zachowuje przewagę głównie w polityce zagranicznej i obronnej, tradycyjnie uznawanych za domenę prezydencką. Sytuacja taka nie mogłaby wystąpić w systemie prezydenckim, gdzie prezydent sam kieruje rządem."},{"situation":"W wyborach prezydenckich w USA kandydat A zdobył w skali całego kraju o kilka milionów głosów więcej niż kandydat B. Mimo to prezydentem zostaje B.","question":"Jak to możliwe?","answer":"Prezydenta USA wybiera Kolegium Elektorów (538 osób, do wygranej potrzeba 270). W prawie wszystkich stanach kandydat, który zwycięży w danym stanie, zdobywa wszystkich jego elektorów. B wygrał w stanach dających razem więcej elektorów, choć ogółem miał mniej głosów — tak było np. w 2000 i 2016 r."},{"situation":"Brytyjski premier traci poparcie własnej partii i podaje się do dymisji. Partia wybiera nowego lidera, a ten — bez żadnych wyborów parlamentarnych — zostaje nowym premierem.","question":"Czy to zgodne z zasadami brytyjskiego ustroju?","answer":"Tak. W Wielkiej Brytanii monarcha powołuje na premiera lidera partii, która ma większość w Izbie Gmin. Wyborcy głosują na posłów, a nie bezpośrednio na premiera, więc zmiana lidera partii rządzącej nie wymaga nowych wyborów (tak było np. w 2022 r.)."},{"situation":"Kongres USA uchwalił ustawę, ale prezydent ją zawetował.","question":"Czy ustawa ostatecznie upada?","answer":"Niekoniecznie. Kongres może odrzucić weto prezydenta większością 2/3 głosów w obu izbach — Izbie Reprezentantów i Senacie. Jeśli tej większości nie zbierze, ustawa upada. Dla porównania: w Polsce weto prezydenta Sejm odrzuca większością 3/5 głosów."},{"situation":"Prezydent USA jest w sporze z Kongresem, który od miesięcy blokuje jego budżet. Doradcy proponują, by rozwiązał Kongres i rozpisał nowe wybory.","question":"Czy prezydent może to zrobić?","answer":"Nie. W systemie prezydenckim obowiązuje ścisły podział władz: prezydent nie może rozwiązać Kongresu, a Kongres nie może odwołać prezydenta za politykę (jedynie w procedurze impeachmentu za naruszenie prawa). Obie władze mają stałe kadencje i muszą szukać porozumienia."},{"situation":"Mieszkańcy pewnego państwa kilka razy w roku głosują w ogólnokrajowych referendach — np. nad długością urlopu, budową minaretów czy zakupem samolotów dla armii. Wiele z tych głosowań odbywa się dlatego, że zebrano odpowiednią liczbę podpisów obywateli.","question":"O jakie państwo chodzi i jakie narzędzia mają tam obywatele?","answer":"To Szwajcaria — państwo o najbardziej rozwiniętej demokracji bezpośredniej. 100 tys. obywateli może zgłosić inicjatywę ludową, czyli projekt zmiany konstytucji, a 50 tys. może zażądać referendum nad ustawą przyjętą już przez parlament."},{"situation":"Po wyborach w Niemczech żadna partia nie ma samodzielnej większości. Partie przez kilka tygodni negocjują umowę koalicyjną, a potem parlament wybiera szefa rządu.","question":"Jak nazywa się szef rządu, kto go wybiera i jak można go odwołać?","answer":"Szefem rządu jest kanclerz. Wybiera go Bundestag na wniosek prezydenta federalnego. Odwołać go można tylko przez konstruktywne wotum nieufności — Bundestag musi jednocześnie wybrać nowego kanclerza. To system kanclerski."},{"situation":"W pewnym państwie ten sam polityk rządzi jako prezydent lub premier od ponad 25 lat. Wybory formalnie się odbywają, ale główni kandydaci opozycji nie są dopuszczani do startu, niezależne media są zamknięte, a krytycy władzy trafiają do więzienia.","question":"O jakie państwo najpewniej chodzi i jak określić jego ustrój?","answer":"To Rosja. Formalnie ma system mieszany, ale w praktyce jest to system superprezydencki — prezydent dominuje nad parlamentem, rządem i sądami. Reżim jest autorytarny: wybory mają charakter fasadowy, bo nie dają realnej możliwości zmiany władzy."},{"situation":"W pewnym państwie najwyższym organem władzy jest według konstytucji parlament liczący blisko 3000 deputowanych, który zbiera się raz w roku na kilkanaście dni. Przewodniczący państwa jest jednocześnie sekretarzem generalnym jedynej rządzącej partii.","question":"O jakie państwo chodzi i gdzie leży realna władza?","answer":"To Chiny. Realna władza należy do Komunistycznej Partii Chin — jej Biura Politycznego i jego Stałego Komitetu, na czele z sekretarzem generalnym. Parlament (Ogólnochińskie Zgromadzenie Przedstawicieli Ludowych) zatwierdza decyzje podjęte wcześniej przez kierownictwo partii. To system monopartyjny."},{"situation":"Uczeń twierdzi na lekcji: „Wielka Brytania nie ma konstytucji, bo nie da się // ---------- master-detail helper ----------
function masterDetail(m, opt){
  // opt: {head, items:[{id,num,title,sub}], current, renderDetail(id, el, back)}
  m.innerHTML = `<div class="wrap">${opt.head||""}<div class="md" data-view="${opt.startDetail?"detail":"list"}">
    <nav class="col md-side" aria-label="${esc(opt.label||"Lista")}"><ul class="md-list"></ul></nav>
    <section class="col md-detail" style="overflow:hidden"></section></div></div>`;
  const md = $(".md",m), ul=$(".md-list",m), det=$(".md-detail",m);
  let cur = opt.items.some(it=>it.id===opt.current) ? opt.current : opt.items[0].id;
  function renderList(){
    ul.innerHTML = opt.items.map(it=>`<li><button class="md-item" data-id="${it.id}" aria-current="${it.id===cur}"><span class="num">${esc(it.num)}</span><span><b>${esc(it.title)}</b><small>${esc(it.sub||"")}</small></span></button></li>`).join("");
  }
  function open(id, toDetail){
    cur=id; renderList(); if(opt.onSelect) opt.onSelect(id);
    det.innerHTML = ""; opt.renderDetail(id, det);
    const b = det.querySelector(".back"); if(b) b.addEventListener("click",()=>{ md.dataset.view="list"; window.scrollTo(0,0); });
    if(toDetail){ md.dataset.view="detail"; if(window.innerWidth<=860) window.scrollTo(0,0); }
  }
  ul.addEventListener("click", e=>{ const b=e.target.closest(".md-item"); if(b) open(b.dataset.id, true); });
  open(cur, false);
  return {open};
}
const backBtn = label => `<button class="back">← ${esc(label)}</button>`;

function accordion(items, startOpen){
  // items: [{title, html, n}]
  const wrap = document.createElement("div"); wrap.className="acc-list";
  wrap.innerHTML = items.map((it,i)=>`<div class="acc-item"><button class="acc-btn" aria-expanded="${i===startOpen}"><span class="n">${esc(it.n ?? String(i+1).padStart(2,"0"))}</span><b>${esc(it.title)}</b><span class="chev">▼</span></button><div class="acc-body" ${i===startOpen?"":"hidden"}>${it.html}</div></div>`).join("");
  wrap.addEventListener("click", e=>{ const b=e.target.closest(".acc-btn"); if(!b) return; const open=b.getAttribute("aria-expanded")!=="true"; b.setAttribute("aria-expanded",open); b.nextElementSibling.hidden=!open; });
  return wrap;
}
function expandAllBtn(container){
  const b=document.createElement("button"); b.className="chip"; b.textContent="Rozwiń wszystkie";
  b.addEventListener("click",()=>{ const btns=container.querySelectorAll(".acc-btn"); const anyClosed=[...btns].some(x=>x.getAttribute("aria-expanded")!=="true"); btns.forEach(x=>{x.setAttribute("aria-expanded",anyClosed); x.nextElementSibling.hidden=!anyClosed;}); b.textContent=anyClosed?"Zwiń wszystkie":"Rozwiń wszystkie"; });
  return b;
}

// ---------- MAPY ----------
const WAVE = ["#173f5f","#20639b","#2a9d8f","#4fb27a","#a8bf3f","#e0a43a"];
function mapStatus(M, name, year){
  const y = M.czl[name];
  if(M.wyszli && M.wyszli[name]){ const [a,b,t]=M.wyszli[name]; if(year>=a && year<b) return {k:"mem", wave:waveOf(M,a), y:a, txt:`Członek od ${a} r.`}; if(year>=b) return {k:"left", txt:t}; }
  if(y && y<=year) return {k:"mem", wave:waveOf(M,y), y, txt:`Członek od ${y} r.`};
  if(y && y>year) return {k:"no", txt:`Przystąpi w ${y} r.`};
  if(M.zewn && M.zewn[name]) return {k:"ext", txt:M.zewn[name]};
  if(M.inne && M.inne.kraje.includes(name) && (!M.inne.ueOnly || (MAPY[0].czl[name]||9999)<=year)) return {k:"oth", txt:M.inne.label};
  if(M.inne && M.inne.extra && M.inne.extra[name]) return {k:"oth", txt:M.inne.extra[name]};
  return {k:"no", txt:"Nie należy"};
}
function waveOf(M,y){ let w=0; M.legenda.forEach((l,i)=>{ if(y>=l[0]) w=i; }); return w; }
R.mapy = m => {
  const EXTRA_MAPS=[["woj","Województwa"],["mniej","Mniejszości"],["konflikty","Konflikty"]];

    <div class="subnav" role="tablist">${MAPY.map(x=>`<button role="tab" data-k="${x.id}">${esc(x.n)}</button>`).join("")}${EXTRA_MAPS.map(x=>`<button role="tab" data-k="${x[0]}">${x[1]}</button>`).join("")}</div>

    const members = Object.keys(M.czl).filter(n=>n!=="Åland" && M.czl[n]<=year);

    panel.innerHTML = `<div class="md-hero"><span class="eyebrow">${esc(M.krotko)}</span><h2>${esc(M.n)}</h2><p>${esc(M.opis)}</p></div>
      <div class="md-body">
        <div class="yearbox"><label for="map-y">Stan na rok <b class="yv">${year}</b></label><span class="count">${count} ${count===1?"państwo":(count%10>=2&&count%10<=4&&(count%100<10||count%100>=20))?"państwa":"państw"}</span></div>

        <div class="sec-t">Legenda i członkowie</div>

          ${M.poza?`<div class="lg"><span class="sw" style="background:${WAVE[0]}"></span><div><b>Poza mapą</b><div class="lgc">${M.poza.map(p=>`<span class="lk">${p[0]} (${p[1]})</span>`).join("")}</div></div></div>`:""}
          ${M.inne?`<div class="lg"><span class="sw c-oth-sw"></span><div><b>${esc(M.inne.label)}</b><div class="lgc">${[...M.inne.kraje, ...Object.keys(M.inne.extra||{})].map(n=>`<button class="lk" data-n="${esc(n)}">${esc(pl(n))}</button>`).join("")}</div></div></div>`:""}
          ${M.zewn?`<div class="lg"><span class="sw c-ext-sw"></span><div><b>Używają euro poza UE</b><div class="lgc">${Object.keys(M.zewn).map(n=>`<button class="lk" data-n="${esc(n)}">${esc(pl(n))}</button>`).join("")}</div></div></div>`:""}
          ${M.wyszli?`<div class="lg"><span class="sw c-left-sw"></span><div><b>Byli członkowie</b><div class="lgc">${Object.keys(M.wyszli).map(n=>`<button class="lk" data-n="${esc(n)}">${esc(pl(n))}</button>`).join("")}</div></div></div>`:""}
        </div>
        <div class="sec-t">Warto wiedzieć</div><ul class="blist">${M.fakty.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      </div>`;
    $("#map-y",panel).addEventListener("input",e=>{ year=+e.target.value; stop(); draw(); $("#map-y",panel).focus(); });

  }
  function stop(){ if(timer){clearInterval(timer); timer=null;} }

      panel.onclick=e=>{ const b=e.target.closest("button.lk"); if(b) { sel=b.dataset.n; draw(); } };
      draw();

  }
  sn.addEventListener("click",e=>{const b=e.target.closest("button"); if(b) tab(b.dataset.k);});

  const obs = new MutationObserver(()=>{ if(!document.body.contains(box)){ stop(); obs.disconnect(); } }); obs.observe(document.getElementById("main"),{childList:true});

function mcq(q, correct, wrongs, explain, tag){
  const opts = shuffle([correct, ...pick(wrongs.filter(w=>w!==correct), 3)]);
  return {q, options:opts, correct:opts.indexOf(correct), explain, tag};
}
const G = {
  quiz(dz){
    const all=[]; DZIALY.forEach(d=>{ if(dz && dz!=="all" && d.id!==dz) return; (d.quiz||[]).forEach(q=>all.push({q:q.q,options:q.options,correct:q.correct,explain:q.explain,tag:d.name})); });
    return pick(all,10);
  },
  organ(dz){
    const items=[]; USTROJ.organy.forEach(o=>o.komp.forEach(c=>items.push([c,o.n])));
    const names=USTROJ.organy.map(o=>o.n);
    return pick(items,10).map(([c,n])=>mcq(`Który organ: ${c.charAt(0).toLowerCase()+c.slice(1)}?`, n, names, `To kompetencja organu: ${n}.`, "Ustrój RP"));
  },
  panstwo(dz){
    const ids = Object.keys(PANSTWA_QUIZ);
    const order = shuffle(ids).concat(pick(ids,1));
    const name = id => PANSTWA.find(p=>p.id===id).n;
    return order.slice(0,10).map(id=>{ const f=pick(PANSTWA_QUIZ[id],3); return mcq(`Które to państwo? Cechy jego ustroju:\n${f.map(x=>"• "+x).join("\n")}`, name(id), ids.filter(x=>x!==id).map(name), `To ${name(id)} — ${PANSTWA.find(p=>p.id===id).sys.toLowerCase()}.`, "Ustroje państw"); });
  },
  ideologia(dz){
    const FAM = { socjalizm:"lew", socjaldemokracja:"lew", komunizm:"lew", liberalizm:"lib", libertarianizm:"lib", konserwatyzm:"praw", chadecja:"praw", faszyzm:"tot", nazizm:"tot" };
    const items=[]; IDEOLOGIE.forEach(i=>{ i.hasla.forEach(h=>items.push([`Hasło lub postulat: „${h}”`,i])); items.push([`Stosunek do gospodarki: ${i.gosp}`,i]); });
    return pick(items,10).map(([c,i])=>{ const wrongs=IDEOLOGIE.filter(x=>x.id!==i.id && !(FAM[i.id] && FAM[x.id]===FAM[i.id])).map(x=>x.n); return mcq(`Z którą ideologią się to wiąże? ${c}`, i.n, wrongs, `To ${i.n}.`, "Ideologie"); });
  },
  unia(dz){
    const names=UNIA.instytucje.map(o=>o.n);
    const items=[]; UNIA.instytucje.forEach(o=>{ o.komp.forEach(c=>items.push(mcq(`Która instytucja UE: ${c.charAt(0).toLowerCase()+c.slice(1)}?`, o.n, names, `To ${o.n}.`, "Unia Europejska"))); });
    const years=UNIA.historia.map(h=>h.r);
    UNIA.historia.forEach(h=>items.push(mcq(`W którym roku: ${h.n}?`, h.r, years, h.t, "Historia integracji")));
    const akty=UNIA.prawo.zrodla.slice(1,4).map(z=>z.n);
    UNIA.prawo.zrodla.slice(1,4).forEach(z=>items.push(mcq(`Który akt prawa UE opisano? „${z.t.split(". Przykład")[0]}”`, z.n, [...akty,"Zalecenie"], `To ${z.n.toLowerCase()}.`, "Prawo UE")));
    return pick(items,10);
  },
  organizacja(dz){
    const items=[]; ORG.forEach(o=>{ o.cechy.forEach(c=>items.push([c,o])); });
    const names=ORG.map(o=>o.skr+" — "+o.n);
    return pick(items,10).map(([c,o])=>mcq(`Której organizacji dotyczy ta informacja? „${c}”`, o.skr+" — "+o.n, names, `To ${o.n} (${o.skr}).`, "Organizacje"));
  },
  liczby(dz){
    const items=LICZBY_Q.filter(x=>inDz(dz,x[0]));
    const dn=id=>(DZIALY.find(d=>d.id===id)||{}).name||"";
    return pick(items,10).map(([d,q,c,w,e])=>mcq(q, c, w, e, dn(d)));
  },
  tf(dz){
    const st=[];
    const kad=USTROJ.organy.map(o=>[o.n,o.kadencja]);
    kad.forEach(([n,k])=>{ st.push({d:"ustroj-rp",s:`${n} — kadencja: ${k}.`, t:true, e:`Prawda: ${n} — ${k}.`}); const w=pick(kad.filter(x=>x[1]!==k),1)[0]; st.push({d:"ustroj-rp",s:`${n} — kadencja: ${w[1]}.`, t:false, e:`Fałsz. ${n} — ${k}.`}); });
    PANSTWA.forEach(p=>{ st.push({d:"systemy-panstw",s:`${p.n}: ${p.sys.toLowerCase()}.`, t:true, e:`Prawda: ${p.n} — ${p.sys}.`}); const w=pick(PANSTWA.filter(x=>x.typ!==p.typ),1)[0]; st.push({d:"systemy-panstw",s:`${p.n}: ${w.sys.toLowerCase()}.`, t:false, e:`Fałsz. ${p.n} — ${p.sys}.`}); });
    ORG.forEach(o=>{ const d=o.id==="ue"?"ue":"stosunki"; st.push({d,s:`${o.skr} powstała w ${o.rok} r.`, t:true, e:`Prawda.`}); const wy=pick(ORG.filter(x=>x.rok!==o.rok),1)[0].rok; st.push({d,s:`${o.skr} powstała w ${wy} r.`, t:false, e:`Fałsz. ${o.skr} powstała w ${o.rok} r.`}); });

    MAPY.forEach(M=>{ const d=M.id==="nato"?"stosunki":"ue"; Object.keys(M.czl).filter(n=>n!=="Åland").forEach(n=>st.push({d,s:`${KRAJE[n]} należy do: ${M.n}.`, t:true, e:`Prawda — od ${M.czl[n]} r.`})); (M.inne?M.inne.kraje:[]).forEach(n=>st.push({d,s:`${KRAJE[n]} należy do: ${M.n}.`, t:false, e:`Fałsz. ${KRAJE[n]}: ${M.inne.label.toLowerCase()}.`})); });
    return pick(st.filter(x=>inDz(dz,x.d)),10).map(x=>({q:x.s, options:["Prawda","Fałsz"], correct:x.t?0:1, explain:x.e, tag:"Prawda czy fałsz", tf:true}));
  }
};
const inDz = (dz,id) => dz==="all" || dz===id;
const GROUP_DZ = { "Ustrój RP":"ustroj-rp", "Systemy polityczne państw":"systemy-panstw", "Ideologie":"polityka", "Organizacje międzynarodowe":"stosunki" };
const groupDz = g => (DZIALY.find(d=>d.name===g)||{}).id || GROUP_DZ[g];
const pojDz = dz => POJ.filter(p=>inDz(dz, groupDz(p.g)));
const MODE_DZ = { organ:["ustroj-rp"], panstwo:["systemy-panstw"], ideologia:["polityka"], organizacja:["stosunki"], unia:["ue"], mapy:["ue","stosunki","ustroj-rp","narod"] };
function modeCount(id, dz){
  if(MODE_DZ[id]) return dz==="all"||MODE_DZ[id].includes(dz) ? 1 : 0;
  if(id==="quiz") return DZIALY.filter(d=>inDz(dz,d.id)).reduce((s,d)=>s+(d.quiz||[]).length,0);
  if(id==="liczby") return LICZBY_Q.filter(x=>inDz(dz,x[0])).length;
  if(id==="kazusy") return DZIALY.filter(d=>inDz(dz,d.id)).reduce((s,d)=>s+(d.cases||[]).length,0);
  if(id==="fiszki") return pojDz(dz).length;
  if(id==="dopasuj") return pojDz(dz).length>=5 ? 1 : 0;
  if(id==="tf") return G.tf(dz).length;
  return 1;
}

    const best=store.get("best",{});
    zb.innerHTML = `<div class="modes">${MODES.map(([id,t,d])=>{ const ok=modeCount(id,dz)>0; return `<button class="card mode" data-m="${id}" ${ok?"":"disabled"}><h3>${t}</h3><p>${d}</p>${!ok?`<span class="count">brak zadań w tym dziale</span>`:best[id+":"+dz]!=null?`<span class="count">najlepszy wynik: ${best[id+":"+dz]}/10</span>`:""}</button>`; }).join("")}</div>`;
    zb.querySelectorAll("[data-m]:not([disabled])").forEach(b=>b.addEventListener("click",()=>start(b.dataset.m)));
  }
  function start(id){
    const mode=MODES.find(x=>x[0]===id);
    const back=()=>{ menu(); window.scrollTo(0,0); };
    sel.parentElement.hidden=true;
    zb.innerHTML=""; window.scrollTo(0,0);
    if(id==="fiszki") return runFlash(zb, back, dz, dzName());
    if(id==="dopasuj") return runMatch(zb, back, dz, dzName());
    if(id==="kazusy") return runCases(zb, back, dz, dzName());
    const box=document.createElement("div"); box.className="game"; zb.appendChild(box);
    runGame(box,{title:mode[1], sub:dzName(), gen:()=>G[id](dz), type:"mcq", id:id+":"+dz, back});
  }
  menu();
};

function runGame(el, cfg){
  let qs = cfg.gen(), i=0, score=0;
  function render(){
    if(i>=qs.length) return finish();
    const q=qs[i];
    el.innerHTML = `${cfg.back?`<div class="toolbar"><button class="btn gback">← Tryby</button></div>`:""}
      <div class="gtop"><div><b style="font-family:var(--f-display);font-size:24px">${esc(cfg.title)}</b>${cfg.sub?`<div class="count">${esc(cfg.sub)}</div>`:""}</div><span class="count">Pytanie ${i+1}/${qs.length} · wynik ${score}</span></div>
      <div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qcard"><div class="qtag">${esc(q.tag||"")}</div><div class="qq">${esc(plain(q.q))}</div>
      <div class="${q.tf?"tf":"opts"}">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${q.tf?"":`<span class="L">${"ABCD"[k]}</span>`}<span>${esc(plain(o))}</span></button>`).join("")}</div><div class="fbw"></div></div>`;
    const gb=el.querySelector(".gback"); if(gb) gb.addEventListener("click",cfg.back);
    el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  }
  function answer(k){
    const q=qs[i]; const ok=k===q.correct; if(ok) score++;
    el.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.correct) b.classList.add("ok"); else if(j===k) b.classList.add("bad"); });
    el.querySelector(".fbw").innerHTML = `<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Dobrze!":"Niestety nie."}</b> ${esc(plain(q.explain||""))}</div><div class="gnext"><button class="btn pri nx">${i+1<qs.length?"Dalej →":"Zobacz wynik"}</button></div>`;
    const nx=el.querySelector(".nx"); nx.addEventListener("click",()=>{i++;render();}); nx.focus({preventScroll:true});
    el.querySelector(".gtop > .count").textContent=`Pytanie ${i+1}/${qs.length} · wynik ${score}`;
  }
  function finish(){
    if(cfg.id && qs.length===10){ const best=store.get("best",{}); if(best[cfg.id]==null||score>best[cfg.id]){best[cfg.id]=score; store.set("best",best);} }
    const pct=Math.round(score/qs.length*100);
    el.innerHTML = `${cfg.back?`<div class="toolbar"><button class="btn gback">← Tryby</button></div>`:""}<div class="qcard result"><div class="qtag">${esc(cfg.title)}</div><div class="big">${score}/${qs.length}</div><p style="font-size:18px">${pct>=90?"Znakomicie — poziom maturalny.":pct>=70?"Dobry wynik. Przejrzyj pytania, w których się pomyliłeś.":pct>=50?"Połowa za Tobą. Wróć do tematów i spróbuj jeszcze raz.":"Warto powtórzyć materiał i spróbować ponownie."}</p><div class="gnext" style="justify-content:center"><button class="btn pri again">Nowy zestaw</button></div></div>`;
    const gb=el.querySelector(".gback"); if(gb) gb.addEventListener("click",cfg.back);
    el.querySelector(".again").addEventListener("click",()=>{qs=cfg.gen(); i=0; score=0; render();});
  }
  render();
}

function runFlash(zb, back, dz, dn){
  const SRC=pojDz(dz); let deck=pick(SRC,20), known=0, flipped=false;
  const total=deck.length;
  const el=document.createElement("div"); el.className="game"; zb.appendChild(el);
  function render(){
    if(!deck.length){ el.innerHTML=`<div class="toolbar"><button class="btn gback">← Tryby</button></div><div class="qcard result"><div class="qtag">Fiszki</div><div class="big">${total}/${total}</div><p style="font-size:18px">Wszystkie pojęcia z tej talii opanowane.</p><div class="gnext" style="justify-content:center"><button class="btn pri again">Nowa talia</button></div></div>`;
      el.querySelector(".gback").addEventListener("click",back); el.querySelector(".again").addEventListener("click",()=>{deck=pick(SRC,20);known=0;render();}); return; }
    const c=deck[0];
    el.innerHTML=`<div class="toolbar"><button class="btn gback">← Tryby</button></div><div class="gtop"><div><b style="font-family:var(--f-display);font-size:24px">Fiszki</b><div class="count">${esc(dn)}</div></div><span class="count">umiem ${known}/${total} · w talii ${deck.length}</span></div>
      <div class="prog"><i style="width:${known/total*100}%"></i></div>
      <div class="qcard flash" tabindex="0" role="button" aria-label="Odwróć fiszkę"><div>${flipped?`<div class="qtag">${esc(c.t)}</div><p class="def">${esc(c.d)}</p>`:`<div class="qtag">${esc(c.g)}</div><div class="face">${esc(c.t)}</div><p class="muted" style="font-size:14px">Kliknij, aby odwrócić</p>`}</div></div>
      <div class="gnext" style="justify-content:center"><button class="btn no">Jeszcze nie umiem</button><button class="btn pri yes">Umiem</button></div>`;
    el.querySelector(".gback").addEventListener("click",back);
    const fl=el.querySelector(".flash"); const flip=()=>{flipped=!flipped;render();};
    fl.addEventListener("click",flip); fl.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
    el.querySelector(".yes").addEventListener("click",()=>{deck.shift();known++;flipped=false;render();});
    el.querySelector(".no").addEventListener("click",()=>{deck.push(deck.shift());flipped=false;render();});
  }
  render();
}

function runMatch(zb, back, dz, dn){
  const SRC=pojDz(dz);
  const el=document.createElement("div"); el.className="game"; zb.appendChild(el);
  let round=0, errors=0;
  function newRound(){
    const set=pick(SRC,5); let selT=null, done=0;
    const defs=shuffle(set);
    el.innerHTML=`<div class="toolbar"><button class="btn gback">← Tryby</button></div><div class="gtop"><div><b style="font-family:var(--f-display);font-size:24px">Dopasuj pojęcia</b><div class="count">${esc(dn)}</div></div><span class="count rc">runda ${round+1} · błędy ${errors}</span></div>
    <div class="qcard"><div class="qtag">Kliknij pojęcie, a potem pasującą definicję</div><div class="match" style="margin-top:12px"><div class="mcol">${set.map((p,i)=>`<button class="mbtn t" data-i="${POJ.indexOf(p)}"><b>${esc(p.t)}</b></button>`).join("")}</div><div class="mcol">${defs.map(p=>`<button class="mbtn d" data-i="${POJ.indexOf(p)}">${esc(p.d)}</button>`).join("")}</div></div><div class="fbw"></div></div>`;
    el.querySelector(".gback").addEventListener("click",back);
    el.querySelectorAll(".mbtn.t").forEach(b=>b.addEventListener("click",()=>{ if(b.classList.contains("done")) return; el.querySelectorAll(".mbtn.t").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); selT=b; }));
    el.querySelectorAll(".mbtn.d").forEach(b=>b.addEventListener("click",()=>{
      if(!selT||b.classList.contains("done")) return;
      if(b.dataset.i===selT.dataset.i){ b.classList.add("done"); selT.classList.add("done"); selT.classList.remove("sel"); b.disabled=true; selT.disabled=true; selT=null; done++;
        if(done===5){ el.querySelector(".fbw").innerHTML=`<div class="fb ok"><b>Wszystkie pary dopasowane.</b></div><div class="gnext"><button class="btn pri nx">Następna runda →</button></div>`; el.querySelector(".nx").addEventListener("click",()=>{round++;newRound();}); }
      } else { errors++; b.classList.remove("err"); void b.offsetWidth; b.classList.add("err"); el.querySelector(".gtop .rc").textContent=`runda ${round+1} · błędy ${errors}`; }
    }));
  }
  newRound();
}

function runCases(zb, back, dz, dn){
  const all=[]; DZIALY.filter(d=>inDz(dz,d.id)).forEach(d=>(d.cases||[]).forEach(c=>all.push({...c,g:d.name})));
  const el=document.createElement("div"); el.className="game"; zb.appendChild(el);
  let deck=shuffle(all), i=0, good=0;
  function render(){
    if(i>=deck.length) i=0, deck=shuffle(all);
    const c=deck[i];
    el.innerHTML=`<div class="toolbar"><button class="btn gback">← Tryby</button></div><div class="gtop"><b style="font-family:var(--f-display);font-size:24px">Kazusy</b><span class="count">kazus ${i+1}/${deck.length} · trafione ${good}</span></div>
    <div class="case"><div class="pill acc">${esc(c.g)}</div><div class="sit" style="margin-top:10px;font-size:17.5px">${esc(c.situation)}</div><div class="q">${esc(c.question)}</div>
    <button class="btn pri rv">Pokaż rozwiązanie</button><div class="ans" hidden>${esc(c.answer)}<div class="gnext"><button class="btn no">Nie wiedziałem</button><button class="btn pri yes">Wiedziałem</button></div></div></div>`;
    el.querySelector(".gback").addEventListener("click",back);
    el.querySelector(".rv").addEventListener("click",e=>{e.currentTarget.hidden=true; el.querySelector(".ans").hidden=false;});
    el.querySelector(".yes").addEventListener("click",()=>{good++;i++;render();window.scrollTo(0,0);});
    el.querySelector(".no").addEventListener("click",()=>{i++;render();window.scrollTo(0,0);});
  }
  render();
}

G.mapy = function(dz){
  dz = dz||"all";
  const mapsOk = MAPY.filter(M=>inDz(dz, M.id==="nato"?"stosunki":"ue"));
  const europe = Object.keys(KRAJE).filter(n=>!["Åland","N. Cyprus","Faeroe Is.","Isle of Man","Jersey","Guernsey","Morocco","Algeria","Tunisia","Libya","Egypt","Syria","Iraq","Iran","Israel","Lebanon","Jordan","Saudi Arabia","Palestine","Kuwait","Kazakhstan","Vatican","Monaco","San Marino","Andorra","Liechtenstein"].includes(n));
  const out=[];
  for(let k=0;k<40 && out.length<10 && mapsOk.length;k++){
    const M=mapsOk[Math.floor(Math.random()*mapsOk.length)];
    const mem=Object.keys(M.czl).filter(n=>n!=="Åland");
    const non=europe.filter(n=>!M.czl[n]);
    const r=Math.random();
    if(r<0.4){ const c=pick(mem,1)[0]; out.push(mcq(`Które z tych państw należy do: ${M.n}?`, KRAJE[c], non.map(n=>KRAJE[n]), `${KRAJE[c]} — członek od ${M.czl[c]} r.${M.uwagi[c]?" "+M.uwagi[c]:""}`, "Mapy")); }
    else if(r<0.7){ const c=pick(non,1)[0]; out.push(mcq(`Które z tych państw NIE należy do: ${M.n}?`, KRAJE[c], mem.map(n=>KRAJE[n]), `${KRAJE[c]} nie należy do: ${M.n}.${M.uwagi[c]?" "+M.uwagi[c]:""}`, "Mapy")); }
    else { const c=pick(mem,1)[0]; const y=String(M.czl[c]); const years=[...new Set(Object.values(M.czl).map(String))]; if(years.length<4) continue; out.push(mcq(`W którym roku ${KRAJE[c]} ${M.id==="euro"?"przyjęła euro / weszła do strefy euro":"przystąpiła do: "+M.n}?`, y, years, `${KRAJE[c]}: ${y} r.`, "Mapy")); }
  }
  for(let k=0;k<(dz==="all"?3:dz==="ustroj-rp"?10:0);k++){ const n=pick(Object.keys(WOJ),1)[0]; const w=WOJ[n]; out.splice(Math.floor(Math.random()*(out.length+1)),0, mcq(`Gdzie ma siedzibę wojewoda województwa ${n}?`, w.woj, Object.values(WOJ).map(x=>x.woj), w.woj===w.sej?`${w.woj} — tam też obraduje sejmik.`:`Wojewoda: ${w.woj}, sejmik i marszałek: ${w.sej}.`, "Województwa")); }
  for(let k=0;k<(dz==="all"?2:dz==="narod"?10:0);k++){ const JP=MNIEJ.filter(x=>x.jp); const M=pick(JP,1)[0]; out.splice(Math.floor(Math.random()*(out.length+1)),0, mcq(`Która społeczność ma gminy z językiem pomocniczym na tym obszarze: ${M.gdzie}?`, M.n, JP.map(x=>x.n), M.t, "Mniejszości")); }
  const seenQ=new Set(); return out.filter(q=>{const k=q.q+q.options[q.correct]; if(seenQ.has(k)) return false; seenQ.add(k); return true;}).slice(0,10);
};

show(location.hash.slice(1) || "start");
})();
