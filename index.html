<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiedza o społeczeństwie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: deep-teal sticky topbar with module tabs; modules are master–detail or card grids on a mint-grey ground; teal = civic accent, ochre = articles and institutions */
:root{
  --bg:#edf3f1; --panel:#ffffff; --panel2:#f3f8f6; --ink:#10231f; --muted:#52675f; --line:#d3e1dc;
  --acc:#0f6b62; --acc-soft:#dcefea; --navy:#b0561a; --navy-soft:#f8e9dc; --ok:#1f7a55; --ok-soft:#e3f2ea; --bad:#b4232f; --bad-soft:#f8e4e6;
  --sea:#dbe9ee; --land:#e9eeec; --bar:#0f3d38; --bar-ink:#e8f4f1; --bar-muted:#a7c9c1; --bar-tab:#16524b;
  --f-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1513; --panel:#12201d; --panel2:#172926; --ink:#e4f0ec; --muted:#9db5ad; --line:#24403a;
  --acc:#4cc2b1; --acc-soft:#123631; --navy:#e6a25e; --navy-soft:#3a2716; --ok:#52b98c; --ok-soft:#163327; --bad:#e5606b; --bad-soft:#3a1d22;
  --sea:#0d2329; --land:#1d2b28; --bar:#081a17; --bar-ink:#e4f0ec; --bar-muted:#8fb1a8; --bar-tab:#123631; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1513; --panel:#12201d; --panel2:#172926; --ink:#e4f0ec; --muted:#9db5ad; --line:#24403a;
  --acc:#4cc2b1; --acc-soft:#123631; --navy:#e6a25e; --navy-soft:#3a2716; --ok:#52b98c; --ok-soft:#163327; --bad:#e5606b; --bad-soft:#3a1d22;
  --sea:#0d2329; --land:#1d2b28; --bar:#081a17; --bar-ink:#e4f0ec; --bar-muted:#8fb1a8; --bar-tab:#123631; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--navy)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 23px/1.1 var(--f-display);white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.brand{color:var(--bar-ink)}
.brand span{color:var(--navy)}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:4px}
.tabs button{flex:none;white-space:nowrap;font:500 15px/1 var(--f-body);color:var(--bar-muted);background:none;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--bar-tab);color:var(--bar-ink);box-shadow:inset 0 -2px 0 var(--navy)}
.tabs button:focus-visible{outline-color:var(--navy)}
.wrap{max-width:1280px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 12px/1.2 var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--acc)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.05}
.muted{color:var(--muted)}
.vhead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.vhead h1{font-size:clamp(34px,5vw,50px)}
.vhead p{margin:0;max-width:70ch;color:var(--muted);font-size:17px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pill{display:inline-block;font:500 12px/1.3 var(--f-mono);padding:3px 9px;border-radius:999px;background:var(--navy-soft);color:var(--navy);letter-spacing:.02em}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.trap{border:1px dashed var(--acc);background:var(--acc-soft);border-radius:10px;padding:12px 14px;font-size:15.5px}
.trap b{color:var(--acc);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
.search{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:16px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:500;font-size:15.5px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06201c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#06201c}}
.rich p{margin:0 0 12px}
.rich p:last-child{margin-bottom:0}
.rich strong{color:var(--ink);font-weight:700;background:linear-gradient(transparent 62%, var(--acc-soft) 62%)}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px;border-bottom:1px solid var(--line)}
.subnav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--muted);font-size:15.5px;white-space:nowrap}
.subnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}

/* start */
.st-hero{padding:8px 2px 26px;max-width:860px}
.st-hero h1{font-size:clamp(40px,6.4vw,72px);margin:10px 0 14px}
.st-hero p{font-size:19px;line-height:1.55;max-width:62ch;margin:0 0 8px}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.st-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.st-card:hover{border-color:var(--acc);transform:translateY(-2px)}
.st-card h2{font-size:27px}
.st-card p{margin:0;font-size:16px;color:var(--muted)}
.st-card .stat{margin-top:auto;padding-top:8px;font:500 13px/1.3 var(--f-mono)}
.st-art{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 26px;background:var(--panel)}
.st-art div{padding:16px 18px;border-right:1px solid var(--line)}
.st-art div:last-child{border-right:0}
.st-art b{display:block;font:700 30px/1 var(--f-display);color:var(--acc);font-variant-numeric:tabular-nums}
.st-art span{font-size:14.5px;color:var(--muted)}

/* master-detail */
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.md-list{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:2px}
.md-item{width:100%;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;position:relative}
.md-item:hover,.md-item[aria-current="true"]{background:var(--panel2)}
.md-item[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--acc)}
.md-item .num{font:600 21px/1 var(--f-display);color:var(--acc);text-align:center;padding-top:2px}
.md-item b{display:block;font-size:16px;line-height:1.25}
.md-item small{display:block;font:12px/1.4 var(--f-mono);color:var(--muted);margin-top:3px}
.md-hero{padding:26px 26px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--acc-soft),var(--panel));display:flex;flex-direction:column;gap:8px}
.md-hero h2{font-size:clamp(32px,4.6vw,48px)}
.md-hero p{margin:0;max-width:68ch}
.md-body{padding:20px 26px 26px}
.back{display:none;align-self:flex-start;background:none;border:0;padding:2px 0 6px;color:var(--muted);font-size:14.5px;cursor:pointer}
@media (max-width:860px){
  .md{grid-template-columns:minmax(0,1fr)}
  .md[data-view="list"] .md-detail,.md[data-view="detail"] .md-side{display:none}
  .back{display:inline-block}
  .md-hero{padding:18px}
  .md-body{padding:16px 16px 20px}
  .st-art{grid-template-columns:1fr}
  .st-art div{border-right:0;border-bottom:1px solid var(--line)}
  .st-art div:last-child{border-bottom:0}
}

/* accordion */
.acc-item{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.acc-list{display:flex;flex-direction:column;gap:8px}
.acc-btn{width:100%;display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:14px 16px;cursor:pointer;text-align:left}
.acc-btn b{flex:1;font-size:17.5px;line-height:1.3}
.acc-btn .n{font:500 12.5px var(--f-mono);color:var(--acc);min-width:24px}
.acc-btn .chev{font-size:12px;color:var(--muted);transition:transform .15s}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-body{padding:0 18px 18px 52px;font-size:16.5px;max-width:78ch}
@media (max-width:600px){.acc-body{padding:0 16px 16px}}

/* kv rows */
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);border-top:1px solid var(--line)}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line);font-size:16px;min-width:0}
.kv>div:nth-child(odd){font:500 12.5px/1.6 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-right:12px}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv>div:nth-child(odd){border-bottom:0;padding-bottom:0}}
.blist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:16px}
.sec-t{font:700 22px/1.1 var(--f-display);margin:22px 0 10px}

/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{font-size:24px;margin-bottom:4px}
.card p{margin:6px 0 0;font-size:15.5px}
.numcard{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.numcard span{font-size:15.5px}
.numcard b{font:600 15px var(--f-mono);color:var(--acc);text-align:right;font-variant-numeric:tabular-nums}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.act{border-left:3px solid var(--navy);background:var(--panel);border-radius:0 10px 10px 0;padding:12px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.act .a{font:500 12.5px var(--f-mono);color:var(--navy)}
.act blockquote{margin:6px 0;font:500 19px/1.35 var(--f-display);font-style:italic}
.act p{margin:0;font-size:15px;color:var(--muted)}
.dispute{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dispute>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel2)}
.dispute h4{margin:0 0 6px;font-size:15px;font-family:var(--f-mono);letter-spacing:.04em}
.dispute .a h4{color:var(--ok)} .dispute .b h4{color:var(--bad)}
@media (max-width:640px){.dispute{grid-template-columns:1fr}}
.case{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--panel)}
.case .sit{font-size:16.5px}
.case .q{font-weight:700;margin:10px 0}
.case .ans{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:16px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
td:first-child{font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.hl td{background:var(--acc-soft)}

/* ustawa stepper */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.steps li::before{counter-increment:s;content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--panel);display:grid;place-items:center;font:700 20px var(--f-display);position:relative;z-index:1}
.steps li::after{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps h3{font-size:24px}
.steps .who{font:500 13px var(--f-mono);color:var(--navy);margin:2px 0 6px}
.steps p{margin:0;font-size:16px;max-width:68ch}

/* ideology map */
.idmap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.idmap{grid-template-columns:minmax(0,1fr)}}
.mapbox{padding:14px}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox text{font-family:var(--f-body)}
.dot{cursor:pointer}
.dot circle{transition:r .15s}
.dot:hover circle,.dot.on circle{stroke:var(--ink);stroke-width:2.5}
.idlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* org */
.orgcard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.orgcard:hover,.orgcard[aria-pressed="true"]{border-color:var(--acc)}
.orgcard .skr{font:700 34px/1 var(--f-display);color:var(--acc)}
.orgcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:13px var(--f-mono);color:var(--muted);margin-top:auto;padding-top:6px}
.orgdetail{margin-bottom:16px}

/* pojęcia */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;text-align:left;min-width:0}
.term b{font-size:17px;display:block}
.term small{font:12px var(--f-mono);color:var(--muted)}
.term p{margin:6px 0 0;font-size:15.5px}
.term.hid{cursor:pointer}
.term.hid p{filter:blur(6px);user-select:none}
.term.hid:hover{border-color:var(--acc)}
.count{font:13px var(--f-mono);color:var(--muted)}

/* zadania */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mode{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, transform .15s}
.mode:hover{border-color:var(--acc);transform:translateY(-2px)}
.mode h3{font-size:23px}
.mode p{margin:0;font-size:15px;color:var(--muted)}
.game{max-width:820px;margin:0 auto}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.qcard .qtag{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qcard .qq{font:600 25px/1.25 var(--f-display);margin:8px 0 16px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:16.5px;display:flex;gap:10px}
.opt .L{font:500 13px var(--f-mono);color:var(--muted);padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.gnext{display:flex;justify-content:flex-end;margin-top:14px;gap:8px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700;font-size:18px}
.flash{min-height:230px;display:grid;place-items:center;text-align:center;cursor:pointer;perspective:800px}
.flash .face{font:700 32px/1.15 var(--f-display);max-width:30ch}
.flash .def{font-size:18px;max-width:52ch}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match .mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 12px;cursor:pointer;font-size:15px}
.mbtn.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.mbtn.done{background:var(--ok-soft);border-color:var(--ok);cursor:default}
.mbtn.err{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:600px){.match{grid-template-columns:1fr}.qcard{padding:16px}.qcard .qq{font-size:22px}}
.result{text-align:center;padding:30px 20px}
.result .big{font:700 72px/1 var(--f-display);color:var(--acc);font-variant-numeric:tabular-nums}
.sel-dzial{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){.brand{font-size:20px}.tabs{width:100%}.tabs button{padding:9px 11px;font-size:14px}}

/* mapy */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapwrap{overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:900px){.mapwrap{position:static}}
.mapsvg svg{display:block;width:100%;height:auto}
.mapsvg .sea{fill:var(--sea)}
.mapsvg .cty{stroke:var(--panel);stroke-width:.7;stroke-linejoin:round;cursor:pointer;transition:fill .2s}
.mapsvg .cty.far{cursor:default}
.mapsvg .c-no{fill:var(--land)}
.mapsvg .c-oth{fill:var(--navy-soft);stroke:var(--navy);stroke-width:.8;stroke-dasharray:3 2}
.mapsvg .c-ext{fill:var(--acc-soft);stroke:var(--acc);stroke-width:.8;stroke-dasharray:3 2}
.mapsvg .c-left{fill:var(--bad-soft);stroke:var(--bad);stroke-width:.8;stroke-dasharray:3 2}
.mapsvg .cty:not(.far):hover{filter:brightness(1.12)}
.mapsvg .cty.sel{stroke:var(--ink);stroke-width:2;stroke-dasharray:none;paint-order:stroke}
.mapsvg .mini{stroke:var(--panel);stroke-width:1.5}
.mapsvg .mini.sel{stroke:var(--ink);stroke-width:2.5}
.yearbox{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.yearbox label{font-size:15px;color:var(--muted)}
.yearbox .yv{font:700 30px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;margin-left:6px}
.yearrow{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.yearrow input{flex:1;accent-color:var(--acc)}
.yearrow .play{padding:8px 12px;min-width:44px}

<script>
const WOS = [{"id":"spoleczenstwo","number":"I","icon":"Users","name":"Człowiek i społeczeństwo","blurb":"Socjalizacja, struktura społeczna, grupy, konflikty i zmiana społeczna.","status":"ready","topics":[{"id":"socjalizacja","title":"Jednostka, socjalizacja i role społeczne","text":"Nikt nie rodzi się gotowym członkiem społeczeństwa. Uczymy się tego przez całe życie — jak mówić, co wypada, co jest ważne, jak się zachować w danej sytuacji. Ten proces uczenia się nazywamy **socjalizacją**.\n\nDzieli się on na dwa etapy. **Socjalizacja pierwotna** to ta z dzieciństwa, głównie w rodzinie — wtedy uczymy się języka i podstawowych zasad, i wtedy kształtuje się to, kim czujemy się jako ludzie. **Socjalizacja wtórna** trwa przez resztę życia: w szkole, w pracy, w wojsku, w nowym mieście uczymy się kolejnych zasad i zachowań.\n\nKażdy z nas zajmuje w społeczeństwie wiele miejsc naraz — jest jednocześnie czyimś dzieckiem, uczniem, kolegą, pracownikiem. Takie miejsce nazywamy **pozycją społeczną (statusem)**, a to, czego się od nas na tym miejscu oczekuje — **rolą społeczną**.\n\nStatusy dzielą się na dwa rodzaje. **Status przypisany** dostajemy niezależnie od tego, co robimy — płeć, wiek, pochodzenie. **Status osiągnięty** zdobywamy sami: zawód, wykształcenie, stanowisko. Im nowocześniejsze społeczeństwo, tym więcej znaczą statusy osiągnięte, a mniej to, w jakiej rodzinie ktoś się urodził.\n\nCzasem oczekiwania z różnych ról kłócą się ze sobą — wtedy mówimy o **konflikcie ról**. Klasyczny przykład: rodzic, który powinien być wieczorem w domu, ma jednocześnie ważne obowiązki w pracy. Warto pamiętać, że socjalizacja to nie tresura — człowiek nie tylko przyjmuje zasady, ale też je ocenia, dopasowuje do siebie, a bywa, że odrzuca."},{"id":"typy-spoleczenstw","title":"Typy społeczeństw — od zbieractwa do informacji","text":"Społeczeństwa zmieniały się przez tysiące lat, a to, z czego ludzie żyli, decydowało o całej reszcie: o tym, ilu ich było, gdzie mieszkali i kto miał władzę. Wyróżnia się kilka głównych typów.\n\n**Społeczeństwo zbieracko-łowieckie (nomadyczne)** to najstarszy typ. Ludzie utrzymywali się ze zbierania roślin i polowania, więc musieli wędrować za pożywieniem — stąd nazwa nomadyczne, czyli koczownicze. Grupy były małe, po kilkadziesiąt osób, majątku prawie nie było, a różnice między ludźmi były niewielkie.\n\n**Społeczeństwo rolnicze (agrarne)** powstało, gdy ludzie nauczyli się uprawiać ziemię i hodować zwierzęta. To pozwoliło osiąść na stałe i zgromadzić zapasy żywności. Pojawiły się wsie i miasta, a wraz z nimi wyraźne różnice majątkowe, władza i podział na warstwy. Większość ludzi pracowała na roli.\n\n**Społeczeństwo przemysłowe (industrialne)** narodziło się wraz z rewolucją przemysłową w XVIII i XIX w. Produkcję przejęły fabryki i maszyny. Ludzie masowo przenosili się ze wsi do miast, powstały nowe grupy — robotnicy i właściciele fabryk. Upowszechniła się szkoła, praca najemna i praca na godziny.\n\n**Społeczeństwo poprzemysłowe (postindustrialne)** to etap, w którym najwięcej osób pracuje już nie w fabrykach, lecz w usługach — w handlu, edukacji, zdrowiu, finansach. Rośnie znaczenie wykształcenia, a fizyczna praca ustępuje miejsca pracy umysłowej.\n\n**Społeczeństwo informacyjne** to najnowszy etap, w którym najważniejszym zasobem stała się informacja i wiedza. Podstawą gospodarki są technologie, dane i komunikacja, a Internet zmienia sposób pracy, nauki i kontaktów między ludźmi. Polska należy dziś do społeczeństw łączących cechy poprzemysłowego i informacyjnego."},{"id":"indywidualizm-kolektywizm","title":"Indywidualizm i kolektywizm","text":"Społeczeństwa różnią się tym, co stawiają na pierwszym miejscu: dobro pojedynczego człowieka czy dobro grupy. To jeden z najważniejszych podziałów w porównywaniu kultur.\n\n**Indywidualizm** to nastawienie, w którym najważniejsza jest jednostka — jej wolność, samodzielność i prawo do decydowania o własnym życiu. Człowiek odpowiada przede wszystkim za siebie, sukces uważa się za osobistą zasługę, a porażkę za osobistą sprawę. Ceni się niezależność, wyróżnianie się i mówienie wprost, co się myśli. Więzi z rodziną i grupą istnieją, ale są luźniejsze i bardziej dobrowolne. Kultury silnie indywidualistyczne to m.in. Stany Zjednoczone, Wielka Brytania, Holandia czy kraje skandynawskie.\n\n**Kolektywizm** to nastawienie odwrotne — na pierwszym miejscu stoi grupa: rodzina, wspólnota, naród, firma. Od człowieka oczekuje się lojalności wobec swoich i gotowości do rezygnacji z własnych planów dla dobra ogółu. W zamian grupa zapewnia oparcie i poczucie bezpieczeństwa. Ceni się zgodę, unikanie konfliktu i szacunek dla starszych; ostra krytyka wprost bywa uznawana za nietakt. Kultury kolektywistyczne to m.in. Japonia, Chiny, Korea Południowa oraz wiele krajów Ameryki Łacińskiej i Afryki.\n\nŻadne społeczeństwo nie jest w pełni indywidualistyczne ani w pełni kolektywistyczne — chodzi o przewagę jednego nastawienia. Polska mieści się pośrodku: rodzina i wspólnota są ważne, ale coraz mocniej ceni się samodzielność i osobisty wybór, zwłaszcza wśród młodszych pokoleń. Oba podejścia mają swoją cenę: indywidualizm bywa okupiony samotnością i słabszym wsparciem w kryzysie, kolektywizm — presją grupy i mniejszą swobodą jednostki."},{"id":"grupy","title":"Grupy społeczne i ich rodzaje","text":"**Grupa społeczna** to co najmniej trzy osoby, które łączy trwalsza więź, wspólny cel i poczucie, że tworzą jakąś całość. Sama zbieranina ludzi na przystanku grupą nie jest — brakuje więzi i wspólnego celu.\n\nNajważniejszy podział to grupy pierwotne i wtórne. **Grupa pierwotna** jest mała, ludzie znają się osobiście i łączą ich emocje — to rodzina, paczka przyjaciół. **Grupa wtórna** jest większa i bardziej sformalizowana, a ludzi łączy przede wszystkim wspólny cel, nie uczucia — firma, partia, stowarzyszenie.\n\nInne przydatne podziały: **grupy formalne** mają spisane zasady i strukturę (klasa szkolna, wojsko), **nieformalne** ich nie mają (grupa znajomych). **Grupa własna** to ta, do której czujemy, że należymy, **grupa obca** to ta, wobec której czujemy dystans. Osobno wyróżnia się **grupę odniesienia** — tę, do której się porównujemy i której zasady bierzemy za wzór, nawet jeśli wcale do niej nie należymy.\n\nSzczególne miejsce zajmuje **rodzina** — podstawowa grupa pierwotna. Pełni kilka zadań naraz: rodzi i wychowuje dzieci, uczy ich zasad, utrzymuje domowników i daje im wsparcie emocjonalne. Model rodziny się zmienia: kiedyś częste były rodziny wielopokoleniowe pod jednym dachem, dziś przeważa rodzina złożona z rodziców i dzieci, przybywa też osób mieszkających samotnie, a małżeństwa zawierane są później niż dawniej."},{"id":"struktura","title":"Struktura społeczna i awans","text":"**Struktura społeczna** to sposób, w jaki ludzie i grupy są w społeczeństwie poukładani względem siebie — kto jest wyżej, kto niżej i kto od kogo zależy.\n\nO pozycji człowieka decydują trzy rzeczy: **majątek**, **władza** i **prestiż**, czyli szacunek i uznanie. Nie zawsze idą one w parze — nauczyciel czy lekarz może mieć wysoki prestiż przy średnich zarobkach, a ktoś bardzo bogaty może nie cieszyć się szacunkiem. Zwrócił na to uwagę **Max Weber**, spierając się z **Karolem Marksem**, który sprowadzał pozycję człowieka głównie do tego, czy posiada środki produkcji — fabryki, ziemię, kapitał.\n\n**Stratyfikacja** to podział społeczeństwa na warstwy różniące się dostępem do tego, co cenione. Systemy takiego podziału bywają **zamknięte** — jak system kastowy w Indiach czy dawny podział stanowy, gdzie pozycję się dziedziczyło i nie dało się jej zmienić — albo **otwarte**, jak dzisiejszy system klasowy, w którym awans jest przynajmniej formalnie możliwy.\n\nZmianę pozycji nazywamy **ruchliwością społeczną**. **Ruchliwość pionowa** to ruch w górę (awans) lub w dół (degradacja). **Ruchliwość pozioma** to zmiana bez zmiany poziomu — na przykład przejście do innej firmy na to samo stanowisko. Porównując pokolenia, mówimy o **ruchliwości międzypokoleniowej** (czy dzieciom powodzi się lepiej niż rodzicom), a patrząc na jedno życie — o **wewnątrzpokoleniowej**. Im łatwiej o awans, tym bardziej otwarte społeczeństwo."},{"id":"kontrola","title":"Rodzaje norm społecznych i kontrola społeczna","text":"**Normy** to reguły mówiące, jak należy postępować. Nie wszystkie działają tak samo — różnią się tym, skąd pochodzą i co grozi za ich złamanie. Wyróżnia się pięć rodzajów.\n\n**Normy prawne** ustanawia państwo i zapisuje je w ustawach. Jako jedyne stoi za nimi przymus państwa — za ich złamanie karze sąd, policja czy urząd. Przykład: zakaz kradzieży, obowiązek płacenia podatków.\n\n**Normy obyczajowe** mówią, co w danym środowisku wypada, a co nie. Nikt za ich złamanie nie ukarze, ale spotka się to z dezaprobatą otoczenia. Przykład: ustąpienie miejsca osobie starszej, odpowiedni ubiór na pogrzeb.\n\n**Normy zwyczajowe** to utrwalone sposoby postępowania przekazywane przez tradycję. Ich złamanie budzi raczej zdziwienie niż potępienie. Przykład: dzielenie się opłatkiem w Wigilię, śmigus-dyngus, obyczaje weselne.\n\n**Normy moralne** opierają się na odróżnianiu dobra od zła i odwołują się do sumienia. Karą jest wyrzut sumienia i potępienie ze strony innych. Przykład: nakaz mówienia prawdy, obowiązek pomocy komuś w potrzebie.\n\n**Normy religijne** wynikają z nauki danej religii i obowiązują jej wyznawców, a ich uzasadnieniem jest wola Boga. Przykład: przykazania Dekalogu, post, praktyki religijne.\n\nTe zakresy często się nakładają — zakaz zabijania jest jednocześnie normą prawną, moralną i religijną. Bywa też odwrotnie: coś może być legalne, ale uznawane za niemoralne. **Kontrola społeczna** to cały system nagród i kar pilnujący przestrzegania norm; działa oficjalnie (sądy, policja, regulaminy) i nieoficjalnie (dezaprobata, plotka, wykluczenie z towarzystwa). Gdy normy się rozsypują — zwykle po gwałtownych zmianach — mówimy za **Emilem Durkheimem** o **anomii**."},{"id":"konflikty","title":"Konflikty społeczne i sposoby ich rozwiązywania","text":"**Konflikt społeczny** to sytuacja, w której interesy, wartości lub dążenia ludzi albo grup są ze sobą sprzeczne.\n\nSocjologowie nie oceniają konfliktu jednoznacznie źle. Jedni podkreślają, że rozbija on wspólnotę i utrudnia współpracę. Inni zwracają uwagę, że bez konfliktu nic by się nie zmieniało — to właśnie spory bywały sposobem, w jaki grupy dotąd pomijane upominały się o swoje prawa.\n\nSposoby rozwiązywania konfliktów różnią się tym, kto podejmuje decyzję. **Negocjacje** to bezpośrednie rozmowy samych stron. W **mediacji** pomaga bezstronny pośrednik, ale to strony muszą się dogadać — mediator niczego nie narzuca. W **arbitrażu** strony wybierają rozjemcę i z góry zgadzają się przyjąć jego rozstrzygnięcie. Najdalej idzie **droga sądowa**, gdzie decyduje sąd, a strony nie wybierają ani sędziego, ani zasad.\n\nKonflikt może zakończyć się na kilka sposobów. **Kompromis** to wzajemne ustępstwa — każdy coś traci. **Konsensus** to rozwiązanie, które wszyscy uznają za swoje, bez poczucia straty. Możliwe jest też zwycięstwo jednej strony. Rozwiązanie okazuje się trwałe zwykle wtedy, gdy uwzględnia rzeczywiste potrzeby obu stron, a nie tylko to, czego głośno się domagały."},{"id":"zmiana","title":"Zmiana społeczna i wyzwania współczesności","text":"**Zmiana społeczna** to przekształcenie tego, jak zorganizowane jest społeczeństwo — jego instytucji, zwyczajów, sposobu życia. Powodują ją nowe technologie, gospodarka, liczba i wiek mieszkańców, nowe idee albo polityka. Dziś zmiany zachodzą szybciej niż kiedykolwiek wcześniej.\n\n**Globalizacja** to coraz mocniejsze powiązanie gospodarek, kultur i społeczeństw na całym świecie. Ocenia się ją bardzo różnie. Zwolennicy wskazują na wzrost zamożności, dostęp do technologii i wymianę kulturową. Krytycy — na to, że zyski rozłożyły się nierówno, że decyzje o losie lokalnych społeczności zapadają daleko od nich i poza kontrolą wyborców, oraz że lokalne kultury i wspólnoty słabną.\n\nPolska mierzy się też z problemami demograficznymi, czyli dotyczącymi liczby i wieku mieszkańców. Rodzi się mało dzieci, a społeczeństwo się starzeje — coraz mniej pracujących utrzymuje coraz więcej emerytów, co obciąża system emerytalny i ochronę zdrowia.\n\nZmienił się też kierunek wyjazdów. Przez dekady Polacy głównie wyjeżdżali za pracą; dziś Polska stała się również krajem, do którego przyjeżdżają pracownicy z zagranicy."}],"concepts":[{"term":"Socjalizacja","def":"Proces uczenia się norm, wartości i ról obowiązujących w danym społeczeństwie."},{"term":"Rola społeczna","def":"Zespół oczekiwań kierowanych wobec osoby zajmującej określoną pozycję społeczną."},{"term":"Status przypisany","def":"Pozycja społeczna niezależna od woli i wysiłku jednostki, np. płeć czy pochodzenie."},{"term":"Status osiągnięty","def":"Pozycja zdobyta własnym działaniem, np. wykształcenie lub zawód."},{"term":"Grupa pierwotna","def":"Mała grupa oparta na bezpośrednich, emocjonalnych więziach, np. rodzina."},{"term":"Grupa odniesienia","def":"Grupa, do której jednostka się porównuje i której standardy przyjmuje za własne."},{"term":"Stratyfikacja","def":"Uwarstwienie społeczeństwa według dostępu do bogactwa, władzy i prestiżu."},{"term":"Ruchliwość pionowa","def":"Zmiana pozycji społecznej w górę (awans) lub w dół (degradacja)."},{"term":"Kontrola społeczna","def":"System nagród i sankcji egzekwujących przestrzeganie norm."},{"term":"Normy prawne","def":"Reguły ustanowione przez państwo, jako jedyne wyposażone w przymus państwowy; sankcję wymierzają powołane organy."},{"term":"Normy obyczajowe","def":"Reguły zachowań uznanych za przyzwoite w danej zbiorowości; sankcją jest dezaprobata otoczenia."},{"term":"Normy zwyczajowe","def":"Utrwalone tradycją, powtarzalne sposoby postępowania; ich naruszenie budzi raczej zdziwienie niż potępienie."},{"term":"Normy moralne","def":"Reguły oparte na rozróżnieniu dobra i zła, odwołujące się do sumienia; sankcją jest wyrzut sumienia i potępienie."},{"term":"Normy religijne","def":"Reguły wynikające z doktryny religijnej, obowiązujące wyznawców; sankcja ma charakter religijny."},{"term":"Anomia","def":"Stan osłabienia lub rozchwiania norm społecznych, typowy dla okresów gwałtownych zmian."},{"term":"Stereotyp","def":"Uproszczony, uogólniony i trudny do zmiany obraz grupy społecznej."},{"term":"Mediacja","def":"Rozwiązywanie sporu przy udziale bezstronnego pośrednika, który nie narzuca rozstrzygnięcia."},{"term":"Konsensus","def":"Stanowisko wypracowane i akceptowane przez wszystkie strony sporu."},{"term":"Społeczeństwo zbieracko-łowieckie","def":"Najstarszy typ — ludzie wędrują za pożywieniem, grupy są małe, różnice majątkowe niewielkie."},{"term":"Społeczeństwo rolnicze","def":"Oparte na uprawie ziemi i hodowli; osiadły tryb życia, wyraźne warstwy i różnice majątkowe."},{"term":"Społeczeństwo przemysłowe","def":"Oparte na produkcji fabrycznej; masowe przenosiny do miast, nowe grupy — robotnicy i właściciele fabryk."},{"term":"Społeczeństwo poprzemysłowe","def":"Większość ludzi pracuje w usługach, nie w fabrykach; rośnie znaczenie wykształcenia."},{"term":"Społeczeństwo informacyjne","def":"Najważniejszym zasobem jest informacja i wiedza; podstawą gospodarki są technologie i dane."},{"term":"Indywidualizm","def":"Nastawienie stawiające na pierwszym miejscu jednostkę, jej wolność i samodzielność."},{"term":"Kolektywizm","def":"Nastawienie stawiające na pierwszym miejscu dobro grupy — rodziny, wspólnoty, narodu."},{"term":"Globalizacja","def":"Proces rosnącego powiązania gospodarek, kultur i społeczeństw w skali świata."}],"disputes":[{"question":"Czy globalizacja służy społeczeństwom, czy im szkodzi?","sideA":{"label":"Argumenty za","points":["Otwarcie rynków przyspieszyło wzrost gospodarczy i wydźwignęło z ubóstwa setki milionów ludzi, zwłaszcza w Azji.","Swobodny przepływ technologii, wiedzy i leków podnosi poziom życia także w krajach, które same ich nie wytwarzają.","Wymiana kulturowa i mobilność poszerzają horyzonty oraz możliwości życiowe jednostek."]},"sideB":{"label":"Argumenty przeciw","points":["Zyski z globalizacji rozłożyły się nierówno — w krajach rozwiniętych ucierpiały regiony przemysłowe i pracownicy o niższych kwalifikacjach.","Decyzje o losie lokalnych społeczności zapadają w korporacjach i instytucjach, nad którymi wyborcy nie mają realnej kontroli.","Ujednolicanie wzorców kulturowych osłabia lokalne wspólnoty, języki i tożsamości."]}},{"question":"Czy nierówności społeczne są problemem, który państwo powinno aktywnie zmniejszać?","sideA":{"label":"Za aktywną redystrybucją","points":["Duże nierówności ograniczają realną równość szans — pozycja rodziców w znacznym stopniu przesądza o losie dzieci.","Nadmierne rozwarstwienie osłabia spójność społeczną i zaufanie, a w dłuższej perspektywie także stabilność demokracji.","Dostęp do edukacji i ochrony zdrowia bywa uznawany za warunek korzystania z wolności, a nie za dobro rynkowe."]},"sideB":{"label":"Za ograniczoną rolą państwa","points":["Zróżnicowanie dochodów odzwierciedla różnice w wysiłku, kwalifikacjach i podejmowanym ryzyku, a jego wyrównywanie osłabia motywację.","Rozbudowana redystrybucja wymaga wysokich podatków, które hamują inwestycje i przedsiębiorczość.","Ważniejsza od równości wyników jest równość szans i wzrost, który podnosi poziom życia wszystkich grup."]}}],"cases":[{"situation":"Pracownica firmy zostaje awansowana na kierowniczkę zespołu, w którym dotąd pracowała jako szeregowa członkini. Wkrótce zaczyna odczuwać napięcie: dawni koledzy oczekują od niej lojalności i przymykania oka na spóźnienia, a przełożeni — egzekwowania dyscypliny.","question":"Jakie zjawisko socjologiczne opisuje ta sytuacja i na czym dokładnie polega?","answer":"To konflikt ról społecznych. Kobieta pełni jednocześnie rolę koleżanki (z oczekiwaniem solidarności grupowej) i rolę kierowniczki (z oczekiwaniem egzekwowania regulaminu), a oczekiwania związane z tymi rolami wzajemnie się wykluczają. Dodatkowo mamy tu do czynienia ze zmianą statusu osiągniętego, która wymusza renegocjację pozycji w grupie pierwotnej, jaką stał się dla niej zespół."},{"situation":"Dwie firmy sąsiadujące ze sobą spierają się o prawo do korzystania z drogi dojazdowej. Chcą uniknąć wieloletniego procesu, ale nie potrafią samodzielnie dojść do porozumienia. Zależy im, by ostateczne rozstrzygnięcie było dla obu wiążące.","question":"Który sposób rozwiązania konfliktu będzie najodpowiedniejszy i czym różni się od pozostałych?","answer":"Najodpowiedniejszy będzie arbitraż. Strony powołują bezstronną osobę trzecią i z góry zobowiązują się przyjąć jej rozstrzygnięcie jako wiążące. Różni się to od mediacji, w której pośrednik jedynie pomaga stronom wypracować własne porozumienie i nie ma prawa niczego narzucić, oraz od negocjacji, prowadzonych bezpośrednio przez strony bez udziału osób trzecich. Od drogi sądowej arbitraż odróżnia to, że strony same wybierają rozjemcę i procedurę."},{"situation":"Ola zaczęła naukę w nowym liceum. Wkrótce zauważa, że zaczyna ubierać się, mówić i spędzać przerwy tak jak grupa popularnych uczniów z trzeciej klasy — choć wcale do niej nie należy, a bardzo by chciała.","question":"Jak nazywa się grupa, do której Ola się porównuje i na której się wzoruje?","answer":"To grupa odniesienia (pozytywna). Jednostka nie musi do niej należeć — wystarczy, że traktuje ją jako wzór zachowań, wartości i ocen. Gdyby Ola odrzucała wzory jakiejś grupy i chciała się od niej odróżnić, byłaby to negatywna grupa odniesienia."},{"situation":"Na lekcji nauczyciel pokazuje trzy odcinki i pyta po kolei uczniów, który jest najdłuższy. Pierwszych sześć osób — umówionych wcześniej z nauczycielem — podaje tę samą, wyraźnie błędną odpowiedź. Siódmy uczeń widzi, że to nieprawda, ale też podaje błędną odpowiedź.","question":"Jak nazywa się zjawisko, któremu uległ siódmy uczeń?","answer":"To konformizm — dostosowanie się do zdania lub zachowania grupy pod wpływem jej presji, nawet wbrew własnemu przekonaniu. Sytuacja odtwarza słynny eksperyment Solomona Ascha. Przeciwieństwem jest nonkonformizm, czyli świadome przeciwstawienie się grupie."},{"situation":"Kierowca jedzie przez miasto 90 km/h. Zatrzymuje go policja i wystawia mandat. Gdy wraca do domu, żona robi mu awanturę, a znajomi przestają chcieć z nim jeździć.","question":"Jakie rodzaje sankcji spotkały kierowcę?","answer":"Mandat to sankcja formalna negatywna — przewidziana w przepisach i nałożona przez instytucję państwa (policję). Reakcja żony i znajomych to sankcje nieformalne negatywne — wynikają z oczekiwań otoczenia, a nie z przepisów. Obie są formami kontroli społecznej."},{"situation":"Tomek jako dziecko nauczył się w domu mówić „dzień dobry”, jeść nożem i widelcem i modlić się przed snem. W liceum dołączył do drużyny siatkarskiej, gdzie nauczył się zasad pracy w zespole, a na pierwszym stażu — jak zachowywać się wobec przełożonych.","question":"Jakie rodzaje socjalizacji przeszedł Tomek?","answer":"Nauka w domu w dzieciństwie to socjalizacja pierwotna — najważniejsza, zachodząca głównie w rodzinie i kształtująca podstawy osobowości. Drużyna sportowa i praca to socjalizacja wtórna — trwająca przez całe życie w kolejnych grupach i instytucjach."},{"situation":"Pan Kowalski jest synem rolnika z małej wsi. Skończył medycynę i został lekarzem, a po kilkunastu latach — ordynatorem oddziału w szpitalu wojewódzkim.","question":"Jaki rodzaj ruchliwości społecznej opisuje ta historia?","answer":"To ruchliwość pionowa wznosząca (awans społeczny). W porównaniu z ojcem jest to ruchliwość międzypokoleniowa, a przejście od lekarza do ordynatora w ciągu jego własnego życia — ruchliwość wewnątrzpokoleniowa. Głównym kanałem awansu było wykształcenie."},{"situation":"W dawnych Indiach to, czy ktoś zostanie kapłanem, kupcem czy sprzątaczem, zależało od kasty, w której się urodził, a małżeństwa między kastami były zakazane. We współczesnej Polsce o pozycji człowieka decydują głównie wykształcenie, zawód i dochód.","question":"Czym różnią się te dwa społeczeństwa pod względem statusu i struktury?","answer":"W systemie kastowym dominuje status przypisany — otrzymany przy urodzeniu, niezależnie od wysiłku — a struktura jest zamknięta, bez możliwości awansu. We współczesnej Polsce przeważa status osiągnięty — zdobyty własnymi działaniami — a struktura jest otwarta i umożliwia ruchliwość społeczną."},{"situation":"Państwo Nowakowie mieszkają z dwójką dzieci i rodzicami pana Nowaka. Babcia odbiera wnuki ze szkoły i uczy je modlitw, dziadek dokłada się do rachunków ze swojej emerytury, a wieczorem cała rodzina razem je kolację i rozmawia o tym, co się wydarzyło.","question":"Jaki to typ rodziny i jakie funkcje rodziny widać w opisie?","answer":"To rodzina wielopokoleniowa (poszerzona) — w przeciwieństwie do rodziny nuklearnej, złożonej tylko z rodziców i dzieci. Widać funkcje: opiekuńczą (odbieranie dzieci), socjalizacyjną i religijną (nauka modlitw), ekonomiczną (wspólne utrzymanie) oraz emocjonalną (wspólne kolacje i rozmowy)."},{"situation":"Wszyscy mieszkańcy miasta zgadzają się, że potrzebna jest nowa spalarnia śmieci. Jednak gdy władze proponują kolejne lokalizacje, mieszkańcy każdej dzielnicy organizują protest pod hasłem: „Tak, ale nie u nas!”.","question":"Jak nazywa się ta postawa i jak można rozwiązać taki konflikt?","answer":"To syndrom NIMBY (z ang. „not in my backyard” — nie na moim podwórku): akceptacja inwestycji w ogóle, ale sprzeciw wobec jej budowy w sąsiedztwie. To konflikt interesów. Można go łagodzić przez konsultacje społeczne, mediacje, rzetelną informację o skutkach i rekompensaty dla mieszkańców (np. nowy park lub niższe opłaty)."}],"quiz":[{"q":"Jak nazywa się proces uczenia się norm i wartości społecznych?","options":["Stratyfikacja","Socjalizacja","Anomia","Mobilność"],"correct":1,"explain":"Socjalizacja to przyswajanie norm, wartości i ról obowiązujących w danym społeczeństwie."},{"q":"Który status jest statusem przypisanym?","options":["Zawód","Wykształcenie","Płeć","Stanowisko"],"correct":2,"explain":"Status przypisany nie zależy od wysiłku jednostki — należą do niego m.in. płeć, wiek i pochodzenie."},{"q":"Rodzina jest przykładem grupy:","options":["wtórnej","pierwotnej","formalnej","odniesienia"],"correct":1,"explain":"Grupa pierwotna opiera się na bezpośrednich, emocjonalnych więziach — rodzina jest jej klasycznym przykładem."},{"q":"Które trzy wymiary decydują o pozycji społecznej człowieka?","options":["wiek, płeć i wykształcenie","majątek, władza i prestiż","zawód, miejsce zamieszkania i dochód","pochodzenie, religia i narodowość"],"correct":1,"explain":"Nie muszą iść w parze — nauczyciel może mieć wysoki prestiż przy średnich zarobkach."},{"q":"Awans zawodowy to przykład ruchliwości:","options":["poziomej","pionowej","międzypokoleniowej wyłącznie","przestrzennej"],"correct":1,"explain":"Ruchliwość pionowa to zmiana pozycji w górę lub w dół w hierarchii społecznej."},{"q":"Który system stratyfikacyjny jest systemem zamkniętym?","options":["Klasowy","Kastowy","Zawodowy","Rynkowy"],"correct":1,"explain":"W systemie kastowym pozycja jest dziedziczna, a jej zmiana formalnie niemożliwa."},{"q":"Stan osłabienia i rozchwiania norm społecznych to:","options":["stratyfikacja","anomia","socjalizacja","konformizm"],"correct":1,"explain":"Pojęcie anomii wprowadził Emile Durkheim."},{"q":"Który typ społeczeństwa wiąże się z koczowniczym trybem życia?","options":["rolnicze","zbieracko-łowieckie","przemysłowe","informacyjne"],"correct":1,"explain":"Ludzie musieli wędrować za pożywieniem, bo utrzymywali się ze zbieractwa i polowania."},{"q":"Co umożliwiło ludziom przejście do osiadłego trybu życia?","options":["wynalezienie maszyny parowej","uprawa ziemi i hodowla zwierząt","rozwój usług","powstanie Internetu"],"correct":1,"explain":"Rolnictwo pozwoliło gromadzić zapasy żywności i osiąść na stałe."},{"q":"Czym charakteryzuje się społeczeństwo poprzemysłowe?","options":["Większość pracuje w rolnictwie","Większość pracuje w fabrykach","Większość pracuje w usługach","Ludzie wędrują za pożywieniem"],"correct":2,"explain":"Praca przenosi się z fabryk do handlu, edukacji, zdrowia i finansów."},{"q":"Co jest najważniejszym zasobem w społeczeństwie informacyjnym?","options":["ziemia","surowce i maszyny","informacja i wiedza","siła robocza"],"correct":2,"explain":"Podstawą gospodarki stają się technologie, dane i komunikacja."},{"q":"Które nastawienie kładzie nacisk na lojalność wobec grupy i unikanie konfliktu?","options":["indywidualizm","kolektywizm","liberalizm","nomadyzm"],"correct":1,"explain":"W kulturach kolektywistycznych dobro grupy stoi przed interesem jednostki."},{"q":"Które kraje uchodzą za silnie indywidualistyczne?","options":["Japonia i Korea Południowa","USA i kraje skandynawskie","Chiny i Wietnam","kraje Ameryki Łacińskiej"],"correct":1,"explain":"Ceni się tam samodzielność, niezależność i mówienie wprost, co się myśli."},{"q":"Które normy jako jedyne wyposażone są w przymus państwowy?","options":["moralne","obyczajowe","prawne","religijne"],"correct":2,"explain":"Tylko naruszenie normy prawnej pociąga sankcję wymierzaną przez organy państwa."},{"q":"Dzielenie się opłatkiem w Wigilię to przykład normy:","options":["prawnej","zwyczajowej","moralnej","religijnej"],"correct":1,"explain":"Normy zwyczajowe to utrwalone tradycją sposoby postępowania przekazywane w danej społeczności."},{"q":"Sankcją za naruszenie normy obyczajowej jest:","options":["kara wymierzona przez sąd","dezaprobata otoczenia","wyrzut sumienia","wykluczenie ze wspólnoty religijnej"],"correct":1,"explain":"Normy obyczajowe egzekwuje nieformalna kontrola społeczna, nie aparat państwa."},{"q":"Na czym polega mediacja?","options":["Rozjemca narzuca stronom wiążące rozstrzygnięcie","Bezstronny pośrednik pomaga stronom wypracować własne porozumienie","Strony rozmawiają bez udziału osób trzecich","Spór rozstrzyga sąd"],"correct":1,"explain":"Mediator nie ma prawa narzucić rozwiązania — to odróżnia mediację od arbitrażu."},{"q":"Które rozwiązanie konfliktu polega na wzajemnych ustępstwach obu stron?","options":["Konsensus","Kompromis","Arbitraż","Dominacja"],"correct":1,"explain":"Kompromis to wzajemne ustępstwa; konsensus to stanowisko akceptowane przez wszystkich bez poczucia straty."},{"q":"Które zjawisko demograficzne stanowi obecnie wyzwanie dla polskiego systemu emerytalnego?","options":["Wyż demograficzny","Starzenie się społeczeństwa","Wzrost dzietności","Spadek długości życia"],"correct":1,"explain":"Niska dzietność i starzenie się społeczeństwa zwiększają obciążenie systemu emerytalnego."},{"q":"Grupa, do której jednostka się porównuje, choć nie musi do niej należeć, to grupa:","options":["pierwotna","własna","odniesienia","formalna"],"correct":2,"explain":"Grupa odniesienia dostarcza standardów oceny własnej sytuacji."}]},{"id":"ustroj-rp","number":"V","icon":"Landmark","name":"Ustrój Rzeczypospolitej Polskiej","blurb":"Zasady konstytucyjne, władza ustawodawcza, wykonawcza i sądownicza, samorząd, organy kontroli.","status":"ready","topics":[{"id":"zasady","title":"Zasady ustrojowe Konstytucji RP","text":"**Konstytucja RP** została uchwalona **2 kwietnia 1997 r.**, a weszła w życie **17 października 1997 r.** Opiera ustrój państwa na kilku podstawowych zasadach.\n\n**Zasada suwerenności narodu** mówi, że władza należy do Narodu, który sprawuje ją na dwa sposoby: **przez przedstawicieli** (posłów, senatorów, radnych) albo **bezpośrednio** (referendum, obywatelska inicjatywa ustawodawcza).\n\n**Zasada demokratycznego państwa prawnego** oznacza, że władza może działać tylko na podstawie prawa i w jego granicach, a obywatel musi móc przewidzieć skutki swoich działań.\n\n**Zasada podziału i równowagi władz** dzieli władzę na trzy części, żeby nawzajem się kontrolowały: **ustawodawczą** (Sejm i Senat), **wykonawczą** (Prezydent i Rada Ministrów) oraz **sądowniczą** (sądy i trybunały).\n\nPozostałe zasady to: **nadrzędność Konstytucji** (żaden przepis nie może być z nią sprzeczny), **pluralizm polityczny** (swoboda tworzenia partii), **decentralizacja i samorządność** (część zadań wykonują wspólnoty lokalne), **społeczna gospodarka rynkowa** oraz **godność człowieka** jako źródło wszystkich praw.\n\nWarto zapamiętać: Polska jest państwem **jednolitym (unitarnym)**, a nie federacją — województwa nie mają własnych konstytucji ani parlamentów."},{"id":"parlament","title":"Sejm i Senat","text":"**Sejm** liczy **460 posłów**, a **Senat 100 senatorów**. Kadencja obu izb trwa **4 lata** i jest wspólna — skrócenie kadencji Sejmu automatycznie skraca też kadencję Senatu.\n\nRóżnią się sposobem wyboru. Posłów wybiera się w wyborach **proporcjonalnych**: mandaty dzieli się między komitety w proporcji do zdobytych głosów. Senatorów wybiera się **większościowo** w okręgach jednomandatowych — wygrywa ten, kto ma najwięcej głosów. Dlatego nie wolno mówić, że wszystkie wybory w Polsce są proporcjonalne.\n\nW podziale mandatów w Sejmie biorą udział tylko te komitety, które przekroczyły **próg wyborczy**: **5% dla partii** i **8% dla koalicji**. Komitety mniejszości narodowych są z progu zwolnione. Głosy przelicza się na mandaty **metodą D'Hondta**, która premiuje ugrupowania większe.\n\nSejm pełni trzy funkcje. **Ustawodawcza** to uchwalanie ustaw. **Kontrolna** to sprawdzanie rządu — przez interpelacje, zapytania, komisje śledcze, absolutorium i wotum nieufności. Uwaga: funkcja kontrolna przysługuje **tylko Sejmowi**, nie Senatowi. **Kreacyjna** to powoływanie osób do organów państwa, np. sędziów TK czy Prezesa NIK.\n\nGdy obie izby obradują razem pod przewodnictwem Marszałka Sejmu, tworzą **Zgromadzenie Narodowe**. Odbiera ono przysięgę od Prezydenta, może uznać go za trwale niezdolnego do sprawowania urzędu i postawić przed Trybunałem Stanu."},{"id":"ustawodawcza","title":"Jak powstaje ustawa","text":"**Inicjatywa ustawodawcza** to prawo do zgłoszenia projektu ustawy. Mają je: **posłowie** (grupa co najmniej 15 posłów albo komisja), **Senat**, **Prezydent**, **Rada Ministrów** oraz **grupa 100 000 obywateli** mających prawo głosowania do Sejmu.\n\nProjekt przechodzi w Sejmie przez **trzy czytania** oraz prace w komisjach. Po uchwaleniu trafia do **Senatu**, który ma **30 dni**, żeby ustawę przyjąć bez zmian, wnieść poprawki albo odrzucić ją w całości. Stanowisko Senatu nie jest jednak wiążące — Sejm może je odrzucić **bezwzględną większością** głosów przy obecności co najmniej połowy posłów.\n\nNastępnie ustawa trafia do **Prezydenta**, który ma **21 dni** i trzy możliwości. Może ją **podpisać**. Może skierować ją do **Trybunału Konstytucyjnego**, jeśli ma wątpliwości co do zgodności z Konstytucją — to tzw. kontrola prewencyjna, czyli przed wejściem w życie. Może wreszcie **zawetować** ustawę, czyli odesłać ją Sejmowi do ponownego rozpatrzenia.\n\nDwie rzeczy warto zapamiętać dokładnie. Po pierwsze, **nie można połączyć weta z wnioskiem do TK** — Prezydent musi wybrać jedną drogę. Po drugie, Sejm odrzuca weto **większością 3/5** głosów przy obecności co najmniej połowy posłów. To trudniejsze niż odrzucenie stanowiska Senatu."},{"id":"prezydent","title":"Prezydent RP","text":"**Prezydent** jest najwyższym przedstawicielem państwa i gwarantem ciągłości władzy. Czuwa nad przestrzeganiem Konstytucji oraz stoi na straży suwerenności i bezpieczeństwa państwa.\n\nWybierany jest przez obywateli **bezwzględną większością** głosów. Jeśli w pierwszej turze nikt jej nie uzyska, po dwóch tygodniach odbywa się **druga tura** między dwoma kandydatami z najlepszym wynikiem. Kadencja trwa **5 lat**, a tę samą osobę można wybrać **najwyżej dwa razy**. Kandydować może obywatel, który ukończył **35 lat** i został zgłoszony przez **100 000 obywateli**.\n\nNajważniejsze do zrozumienia jest pojęcie **kontrasygnaty**. To podpis Prezesa Rady Ministrów pod aktem Prezydenta. Zasada jest taka: **większość aktów Prezydenta wymaga kontrasygnaty**, a premier, podpisując, bierze za nie odpowiedzialność przed Sejmem. Bez tego podpisu akt jest nieważny.\n\nOd tej zasady Konstytucja przewiduje wyjątki, zwane **prerogatywami** — to uprawnienia, które Prezydent wykonuje **samodzielnie**. Należą do nich m.in.: weto ustawodawcze, wniosek do Trybunału Konstytucyjnego, zarządzanie wyborów, desygnowanie premiera, powoływanie sędziów na wniosek KRS, nadawanie orderów i **prawo łaski**.\n\nZa naruszenie Konstytucji lub ustawy Prezydent odpowiada przed **Trybunałem Stanu** — nie przed Sejmem i nie przed zwykłym sądem."},{"id":"rada-ministrow","title":"Rada Ministrów","text":"**Rada Ministrów**, czyli rząd, prowadzi politykę wewnętrzną i zagraniczną państwa oraz kieruje administracją rządową. Obowiązuje tu **domniemanie kompetencji**: wszystko, co nie zostało zastrzeżone dla innych organów ani dla samorządu, należy do rządu.\n\nPowoływanie rządu przebiega w **trzech krokach**. W **pierwszym** Prezydent wskazuje premiera i powołuje rząd, a Sejm udziela mu **wotum zaufania bezwzględną większością**. Jeśli się nie uda, w **drugim kroku** premiera i rząd wybiera sam Sejm — również bezwzględną większością. Jeśli i to zawiedzie, w **trzecim kroku** inicjatywa wraca do Prezydenta, ale tym razem Sejmowi wystarczy **zwykła większość**. Gdy i to się nie powiedzie, Prezydent skraca kadencję Sejmu i zarządza nowe wybory.\n\nOdwołanie rządu jest możliwe wyłącznie przez **konstruktywne wotum nieufności**. Słowo 'konstruktywne' oznacza, że wniosek musi **wskazywać imiennie kandydata na nowego premiera** — nie wystarczy chcieć obalić dotychczasowy rząd. Wniosek składa co najmniej **46 posłów**, a do przyjęcia potrzeba **bezwzględnej większości ustawowej liczby posłów**, czyli minimum 231 głosów. Rozwiązanie to chroni państwo przed sytuacją, w której Sejm potrafi rząd obalić, ale nie potrafi powołać nowego.\n\nMożliwe jest też odwołanie **pojedynczego ministra** — tu wniosek składa **69 posłów**."},{"id":"sady","title":"Sądy i trybunały","text":"Wymiar sprawiedliwości sprawują **Sąd Najwyższy**, **sądy powszechne**, **sądy administracyjne** i **sądy wojskowe**. Sądy są władzą **odrębną i niezależną**, a sędziowie w orzekaniu są **niezawiśli** i podlegają tylko Konstytucji i ustawom.\n\nNiezawisłość zabezpiecza kilka gwarancji: **nieusuwalność** sędziego, **immunitet**, **apolityczność** oraz powoływanie **na czas nieoznaczony**, czyli bez kadencji.\n\n**Sądy powszechne** dzielą się na rejonowe, okręgowe i apelacyjne; rozpoznają sprawy karne, cywilne, rodzinne i z zakresu prawa pracy. **Sądy administracyjne** — wojewódzkie oraz Naczelny Sąd Administracyjny — sprawdzają, czy urzędy działały zgodnie z prawem. Postępowanie jest zawsze co najmniej **dwuinstancyjne**, czyli od wyroku można się odwołać.\n\nObok sądów działają dwa **trybunały**, których nie należy mylić. **Trybunał Konstytucyjny** bada, czy ustawy i umowy międzynarodowe są zgodne z Konstytucją, rozstrzyga spory kompetencyjne między organami państwa oraz rozpoznaje skargi konstytucyjne obywateli. **Trybunał Stanu** sądzi najwyższych urzędników państwa — Prezydenta, premiera, ministrów — za naruszenie Konstytucji lub ustawy."},{"id":"samorzad","title":"Samorząd terytorialny","text":"**Samorząd terytorialny** to wspólnoty mieszkańców, które wykonują część zadań publicznych **we własnym imieniu i na własną odpowiedzialność**. Są trzy szczeble: **gmina**, **powiat** i **województwo**.\n\nNajważniejsza jest **gmina** — obowiązuje **domniemanie kompetencji gminy**, czyli wszystko, czego nie przypisano powiatowi ani województwu, należy do niej.\n\nNa każdym szczeblu działają dwa rodzaje organów: **stanowiący** (uchwala i kontroluje) oraz **wykonawczy** (realizuje). W gminie to **rada gminy** oraz **wójt, burmistrz lub prezydent miasta** — wybierany **bezpośrednio przez mieszkańców**. W powiecie to **rada powiatu** i **zarząd ze starostą**, wybierany przez radę. W województwie to **sejmik** i **zarząd z marszałkiem**, także wybierany przez sejmik.\n\nUwaga na częsty błąd: **wojewoda nie jest organem samorządu**. To przedstawiciel rządu w terenie, który sprawuje **nadzór** nad samorządem. Nadzór ten obejmuje wyłącznie **legalność**, czyli zgodność z prawem — wojewoda nie może uchylić uchwały tylko dlatego, że uważa ją za nierozsądną.\n\nZadania dzielą się na **własne**, finansowane z dochodów jednostki (szkoły podstawowe, drogi gminne, wodociągi), oraz **zlecone** z administracji rządowej, finansowane dotacją (ewidencja ludności, organizacja wyborów). Mieszkańcy mogą też decydować sami w **referendum lokalnym**, w tym odwołać wójta lub radę przed końcem kadencji."},{"id":"organy-kontroli","title":"Organy kontroli i ochrony prawa","text":"**Najwyższa Izba Kontroli** to naczelny organ kontroli państwowej, podległy **Sejmowi**. Sprawdza, jak wydawane są publiczne pieniądze.\n\nStosuje przy tym cztery kryteria, ale nie wobec wszystkich tak samo. Administrację rządową bada pod kątem **legalności, gospodarności, celowości i rzetelności**. Samorząd — tylko pod kątem legalności, gospodarności i rzetelności, **bez celowości**, bo samorząd sam odpowiada za trafność swoich decyzji przed mieszkańcami. Podmioty prywatne korzystające z publicznych pieniędzy bada wyłącznie pod kątem legalności i gospodarności. NIK przedstawia też Sejmowi analizę wykonania budżetu i opinię w sprawie **absolutorium** dla rządu.\n\n**Rzecznik Praw Obywatelskich** stoi na straży wolności i praw człowieka i obywatela. Jest **niezależny** od innych organów. Może działać z własnej inicjatywy albo na wniosek — wniosek jest bezpłatny i może go złożyć każdy. Rzecznik może żądać wszczęcia postępowania, przystąpić do sprawy w sądzie i kierować wnioski do Trybunału Konstytucyjnego. Ważne ograniczenie: **nie rozstrzyga spraw** — nie zastępuje sądu ani urzędu.\n\n**Krajowa Rada Radiofonii i Telewizji** stoi na straży wolności słowa i prawa do informacji w radiu i telewizji. **Narodowy Bank Polski** to bank centralny odpowiadający za wartość polskiego pieniądza; jego organami są Prezes NBP, Rada Polityki Pieniężnej i Zarząd."},{"id":"demokracja-bezposrednia","title":"Udział obywateli i zmiana Konstytucji","text":"Polska jest **demokracją przedstawicielską** — na co dzień decydują wybrani przedstawiciele. Konstytucja przewiduje jednak narzędzia, dzięki którym obywatele mogą decydować sami.\n\n**Referendum ogólnokrajowe** zarządza Sejm bezwzględną większością albo Prezydent za zgodą Senatu. Jego wynik jest **wiążący tylko wtedy, gdy weźmie w nim udział więcej niż połowa uprawnionych** do głosowania. Poniżej tego progu referendum ma charakter jedynie opiniodawczy.\n\n**Obywatelska inicjatywa ustawodawcza** wymaga **100 000 podpisów**. Sejm ma obowiązek taki projekt **rozpatrzyć**, ale **nie ma obowiązku go uchwalić** — to istotna różnica.\n\nNa szczeblu lokalnym działają **referendum lokalne**, **konsultacje społeczne** oraz **budżet obywatelski**, w którym mieszkańcy sami decydują o przeznaczeniu części pieniędzy gminy.\n\n**Zmiana Konstytucji** wymaga szczególnie wysokich większości, i tu łatwo o pomyłkę. Sejm uchwala ją większością **2/3** głosów przy obecności co najmniej połowy posłów, a Senat — **bezwzględną większością** przy takim samym kworum. Większości są więc **różne w obu izbach**. Dodatkowo przy zmianie rozdziałów I, II lub XII uprawnione podmioty mogą zażądać **referendum zatwierdzającego**."}],"concepts":[{"term":"Suwerenność narodu","def":"Zasada, zgodnie z którą władza zwierzchnia należy do Narodu, sprawującego ją przez przedstawicieli lub bezpośrednio."},{"term":"Państwo prawne","def":"Państwo, w którym organy władzy działają na podstawie i w granicach prawa, a prawo chroni jednostkę przed arbitralnością."},{"term":"Podział władz","def":"Rozdzielenie władzy ustawodawczej, wykonawczej i sądowniczej wraz z mechanizmami wzajemnego hamowania."},{"term":"Kontrasygnata","def":"Podpis Prezesa Rady Ministrów pod aktem Prezydenta, przenoszący odpowiedzialność za akt na rząd."},{"term":"Prerogatywa","def":"Uprawnienie Prezydenta wykonywane samodzielnie, bez wymogu kontrasygnaty premiera."},{"term":"Weto ustawodawcze","def":"Odmowa podpisania ustawy przez Prezydenta i przekazanie jej Sejmowi do ponownego rozpatrzenia."},{"term":"Konstruktywne wotum nieufności","def":"Odwołanie rządu połączone z jednoczesnym wyborem nowego premiera wskazanego we wniosku."},{"term":"Wotum zaufania","def":"Uchwała Sejmu wyrażająca poparcie dla rządu i jego programu."},{"term":"Absolutorium","def":"Akceptacja przez Sejm wykonania budżetu państwa przez Radę Ministrów za dany rok."},{"term":"Immunitet parlamentarny","def":"Ochrona posła lub senatora przed pociągnięciem do odpowiedzialności karnej bez zgody izby."},{"term":"Skarga konstytucyjna","def":"Środek pozwalający jednostce zakwestionować przed TK przepis, na podstawie którego naruszono jej konstytucyjne prawa."},{"term":"Odpowiedzialność konstytucyjna","def":"Odpowiedzialność najwyższych urzędników przed Trybunałem Stanu za naruszenie Konstytucji lub ustawy."},{"term":"Domniemanie kompetencji gminy","def":"Zasada, że wszystkie zadania samorządowe niezastrzeżone dla innych jednostek należą do gminy."},{"term":"Zadania własne","def":"Zadania samorządu realizowane z dochodów własnych jednostki i na jej odpowiedzialność."},{"term":"Zadania zlecone","def":"Zadania z zakresu administracji rządowej wykonywane przez samorząd i finansowane dotacją."},{"term":"Metoda D'Hondta","def":"Sposób przeliczania głosów na mandaty, premiujący ugrupowania o większym poparciu."},{"term":"Próg wyborczy","def":"Minimalne poparcie wymagane do udziału w podziale mandatów: 5% dla partii, 8% dla koalicji."},{"term":"Zgromadzenie Narodowe","def":"Sejm i Senat obradujące wspólnie pod przewodnictwem Marszałka Sejmu w sprawach określonych w Konstytucji."}],"institutions":[{"name":"Sejm","subtitle":"władza ustawodawcza — izba pierwsza","rows":[{"k":"Skład","v":"460 posłów"},{"k":"Wybory","v":"powszechne, równe, bezpośrednie, proporcjonalne, tajne"},{"k":"Kadencja","v":"4 lata (wspólna z Senatem)"},{"k":"Bierne prawo wyborcze","v":"ukończone 21 lat"},{"k":"Główne funkcje","v":"ustawodawcza, kontrolna wobec rządu, kreacyjna"},{"k":"Kompetencje szczególne","v":"uchwalanie budżetu, absolutorium, wotum nieufności, komisje śledcze"}]},{"name":"Senat","subtitle":"władza ustawodawcza — izba druga","rows":[{"k":"Skład","v":"100 senatorów"},{"k":"Wybory","v":"powszechne, bezpośrednie, tajne, większościowe w okręgach jednomandatowych"},{"k":"Kadencja","v":"4 lata (wspólna z Sejmem)"},{"k":"Bierne prawo wyborcze","v":"ukończone 30 lat"},{"k":"Rola w ustawodawstwie","v":"30 dni na przyjęcie, poprawki albo odrzucenie ustawy"},{"k":"Siła stanowiska","v":"Sejm odrzuca je bezwzględną większością przy kworum połowy"}]},{"name":"Prezydent RP","subtitle":"władza wykonawcza — głowa państwa","rows":[{"k":"Wybór","v":"wybory powszechne, bezwzględna większość, ewentualna II tura"},{"k":"Kadencja","v":"5 lat, tylko jedna reelekcja"},{"k":"Bierne prawo wyborcze","v":"ukończone 35 lat, zgłoszenie przez 100 000 obywateli"},{"k":"Akty urzędowe","v":"co do zasady wymagają kontrasygnaty premiera"},{"k":"Prerogatywy","v":"m.in. weto, wniosek do TK, desygnowanie premiera, prawo łaski, powoływanie sędziów"},{"k":"Odpowiedzialność","v":"konstytucyjna przed Trybunałem Stanu"}]},{"name":"Rada Ministrów","subtitle":"władza wykonawcza — rząd","rows":[{"k":"Skład","v":"Prezes Rady Ministrów, wiceprezesi, ministrowie, przewodniczący komitetów"},{"k":"Powołanie","v":"trzy kroki konstytucyjne; niepowodzenie skraca kadencję Sejmu"},{"k":"Wotum zaufania","v":"bezwzględna większość przy kworum połowy (kroki I i II), zwykła (krok III)"},{"k":"Odwołanie","v":"konstruktywne wotum nieufności — wniosek 46 posłów ze wskazaniem nowego premiera"},{"k":"Zakres działania","v":"polityka wewnętrzna i zagraniczna, kierowanie administracją rządową"},{"k":"Zasada kompetencji","v":"domniemanie na rzecz Rady Ministrów"}]},{"name":"Trybunał Konstytucyjny","subtitle":"kontrola konstytucyjności prawa","rows":[{"k":"Skład","v":"15 sędziów"},{"k":"Powoływanie","v":"wybierani indywidualnie przez Sejm"},{"k":"Kadencja","v":"9 lat, bez możliwości ponownego wyboru"},{"k":"Główne kompetencje","v":"zgodność ustaw i umów z Konstytucją, skargi konstytucyjne, spory kompetencyjne"},{"k":"Rodzaje kontroli","v":"prewencyjna (przed podpisaniem ustawy) i następcza"},{"k":"Skutek orzeczenia","v":"utrata mocy obowiązującej przepisu uznanego za niezgodny"}]},{"name":"Trybunał Stanu","subtitle":"odpowiedzialność konstytucyjna","rows":[{"k":"Skład","v":"przewodniczący oraz 2 zastępców i 16 członków"},{"k":"Przewodniczący","v":"Pierwszy Prezes Sądu Najwyższego z urzędu"},{"k":"Wybór członków","v":"przez Sejm na okres swojej kadencji"},{"k":"Zakres podmiotowy","v":"m.in. Prezydent, premier, ministrowie, Prezes NBP, Prezes NIK"},{"k":"Podstawa odpowiedzialności","v":"naruszenie Konstytucji lub ustawy w związku z zajmowanym stanowiskiem"},{"k":"Kary","v":"m.in. utrata urzędu, zakaz zajmowania stanowisk, utrata praw wyborczych"}]},{"name":"Najwyższa Izba Kontroli","subtitle":"naczelny organ kontroli państwowej","rows":[{"k":"Podległość","v":"Sejmowi; działa na zasadach kolegialności"},{"k":"Prezes","v":"powoływany przez Sejm za zgodą Senatu"},{"k":"Kadencja Prezesa","v":"6 lat, jedno ponowne powołanie"},{"k":"Kryteria wobec administracji rządowej","v":"legalność, gospodarność, celowość, rzetelność"},{"k":"Kryteria wobec samorządu","v":"legalność, gospodarność, rzetelność (bez celowości)"},{"k":"Kluczowy obowiązek","v":"analiza wykonania budżetu i opinia w sprawie absolutorium"}]},{"name":"Rzecznik Praw Obywatelskich","subtitle":"ochrona wolności i praw","rows":[{"k":"Powołanie","v":"przez Sejm za zgodą Senatu"},{"k":"Kadencja","v":"5 lat"},{"k":"Pozycja ustrojowa","v":"niezależny od innych organów, odpowiada wyłącznie przed Sejmem"},{"k":"Wszczęcie sprawy","v":"z urzędu lub na wniosek obywateli, organizacji i samorządów"},{"k":"Uprawnienia","v":"żądanie wszczęcia postępowania, udział w postępowaniach, wnioski do TK"},{"k":"Ograniczenie","v":"nie rozstrzyga spraw — nie zastępuje sądu ani organu administracji"}]}],"numbers":[{"label":"Liczba posłów","value":"460"},{"label":"Liczba senatorów","value":"100"},{"label":"Kadencja Sejmu i Senatu","value":"4 lata"},{"label":"Kadencja Prezydenta","value":"5 lat (max 2 kadencje)"},{"label":"Kadencja sędziego TK","value":"9 lat, bez reelekcji"},{"label":"Kadencja Prezesa NIK","value":"6 lat"},{"label":"Kadencja RPO","value":"5 lat"},{"label":"Próg wyborczy — partia","value":"5%"},{"label":"Próg wyborczy — koalicja","value":"8%"},{"label":"Bierne prawo — poseł","value":"21 lat"},{"label":"Bierne prawo — senator","value":"30 lat"},{"label":"Bierne prawo — Prezydent","value":"35 lat"},{"label":"Czynne prawo wyborcze","value":"18 lat"},{"label":"Obywatelska inicjatywa ustawodawcza","value":"100 000 podpisów"},{"label":"Zgłoszenie kandydata na Prezydenta","value":"100 000 podpisów"},{"label":"Inicjatywa poselska","value":"15 posłów lub komisja"},{"label":"Wniosek o wotum nieufności dla rządu","value":"46 posłów"},{"label":"Wniosek o wotum nieufności dla ministra","value":"69 posłów"},{"label":"Odrzucenie weta Prezydenta","value":"3/5 głosów przy kworum połowy"},{"label":"Odrzucenie stanowiska Senatu","value":"bezwzględna większość przy kworum połowy"},{"label":"Zmiana Konstytucji — Sejm","value":"2/3 przy kworum połowy"},{"label":"Zmiana Konstytucji — Senat","value":"bezwzględna większość przy kworum połowy"},{"label":"Ratyfikacja umowy z art. 90 (przekazanie kompetencji)","value":"2/3 w Sejmie i 2/3 w Senacie"},{"label":"Termin Senatu na rozpatrzenie ustawy","value":"30 dni"},{"label":"Termin Prezydenta na podpisanie ustawy","value":"21 dni"},{"label":"Wiążące referendum ogólnokrajowe","value":"frekwencja powyżej 50%"}],"acts":[{"act":"Konstytucja RP","article":"Art. 2","text":"Rzeczpospolita Polska jest demokratycznym państwem prawnym, urzeczywistniającym zasady sprawiedliwości społecznej.","note":"Zasada demokratycznego państwa prawnego — jedna z najczęściej powoływanych w orzecznictwie TK."},{"act":"Konstytucja RP","article":"Art. 4","text":"1. Władza zwierzchnia w Rzeczypospolitej Polskiej należy do Narodu.\n2. Naród sprawuje władzę przez swoich przedstawicieli lub bezpośrednio.","note":"Zasada suwerenności narodu wraz ze wskazaniem obu form jej realizacji."},{"act":"Konstytucja RP","article":"Art. 8","text":"1. Konstytucja jest najwyższym prawem Rzeczypospolitej Polskiej.\n2. Przepisy Konstytucji stosuje się bezpośrednio, chyba że Konstytucja stanowi inaczej.","note":"Zasada nadrzędności Konstytucji i jej bezpośredniego stosowania."},{"act":"Konstytucja RP","article":"Art. 10","text":"1. Ustrój Rzeczypospolitej Polskiej opiera się na podziale i równowadze władzy ustawodawczej, władzy wykonawczej i władzy sądowniczej.\n2. Władzę ustawodawczą sprawują Sejm i Senat, władzę wykonawczą Prezydent Rzeczypospolitej Polskiej i Rada Ministrów, a władzę sądowniczą sądy i trybunały.","note":"Podstawa trójpodziału władzy w polskim porządku ustrojowym."},{"act":"Konstytucja RP","article":"Art. 30","text":"Przyrodzona i niezbywalna godność człowieka stanowi źródło wolności i praw człowieka i obywatela. Jest ona nienaruszalna, a jej poszanowanie i ochrona jest obowiązkiem władz publicznych.","note":"Godność jako źródło wszystkich pozostałych praw — punkt wyjścia rozdziału II."},{"act":"Konstytucja RP","article":"Art. 84","text":"Każdy jest obowiązany do ponoszenia ciężarów i świadczeń publicznych, w tym podatków, określonych w ustawie.","note":"Płacenie podatków jest obowiązkiem prawnym wynikającym z ustawy — nie kwestią uznania czy postawy obywatelskiej."},{"act":"Konstytucja RP","article":"Art. 87 ust. 1","text":"Źródłami powszechnie obowiązującego prawa Rzeczypospolitej Polskiej są: Konstytucja, ustawy, ratyfikowane umowy międzynarodowe oraz rozporządzenia.","note":"Zamknięty katalog źródeł prawa powszechnie obowiązującego; osobno Konstytucja wymienia akty prawa miejscowego."},{"act":"Konstytucja RP","article":"Art. 91 ust. 2","text":"Umowa międzynarodowa ratyfikowana za uprzednią zgodą wyrażoną w ustawie ma pierwszeństwo przed ustawą, jeżeli ustawy tej nie da się pogodzić z umową.","note":"Kluczowe rozróżnienie: pierwszeństwo przed ustawą ma tylko umowa ratyfikowana za zgodą wyrażoną w ustawie. Umowa ratyfikowana przez Prezydenta samodzielnie takiego pierwszeństwa nie ma."},{"act":"Konstytucja RP","article":"Art. 95","text":"1. Władzę ustawodawczą w Rzeczypospolitej Polskiej sprawują Sejm i Senat.\n2. Sejm sprawuje kontrolę nad działalnością Rady Ministrów w zakresie określonym przepisami Konstytucji i ustaw.","note":"Funkcja kontrolna przysługuje Sejmowi — nie Senatowi."},{"act":"Konstytucja RP","article":"Art. 96","text":"1. Sejm składa się z 460 posłów.\n2. Wybory do Sejmu są powszechne, równe, bezpośrednie i proporcjonalne oraz odbywają się w głosowaniu tajnym.","note":"Pięć przymiotników wyborczych dla Sejmu. Dla Senatu Konstytucja nie przewiduje proporcjonalności ani równości w tym samym brzmieniu."},{"act":"Konstytucja RP","article":"Art. 118 ust. 2","text":"Inicjatywa ustawodawcza przysługuje również grupie co najmniej 100 000 obywateli mających prawo wybierania do Sejmu.","note":"Obywatelska inicjatywa ustawodawcza — Sejm ma obowiązek projekt rozpatrzyć, nie uchwalić."},{"act":"Konstytucja RP","article":"Art. 235 ust. 4","text":"Ustawę o zmianie Konstytucji uchwala Sejm większością co najmniej 2/3 głosów w obecności co najmniej połowy ustawowej liczby posłów oraz Senat bezwzględną większością głosów w obecności co najmniej połowy ustawowej liczby senatorów.","note":"Uwaga na różnicę większości: Sejm 2/3, Senat bezwzględna. To częsty punkt pomyłek."}],"disputes":[{"question":"Czy Senat jest w polskim ustroju izbą potrzebną?","sideA":{"label":"Za utrzymaniem Senatu","points":["Druga izba wymusza ponowne przemyślenie ustawy i wychwytuje błędy legislacyjne popełnione w pośpiechu.","Odmienny sposób wyboru i wyższy wiek bierny sprzyjają innej perspektywie niż w Sejmie.","Stanowi dodatkowy element równowagi w systemie, utrudniając skoncentrowanie władzy w rękach jednej większości."]},"sideB":{"label":"Za likwidacją lub reformą","points":["Kompetencje Senatu są słabe — Sejm odrzuca jego stanowisko bezwzględną większością, więc realny wpływ bywa iluzoryczny.","Wydłuża i podraża proces ustawodawczy, nie wnosząc proporcjonalnej wartości.","Skoro skład polityczny obu izb zwykle bywa zbliżony, funkcja refleksji i kontroli słabnie."]}},{"question":"Czy Trybunał Konstytucyjny powinien mieć prawo uchylania ustaw uchwalonych przez parlament?","sideA":{"label":"Za silną kontrolą konstytucyjną","points":["Konstytucja jest najwyższym prawem, a jej gwarancje byłyby pozorne bez organu zdolnego egzekwować je wobec ustawodawcy.","Chroni prawa mniejszości i jednostek przed decyzjami większości parlamentarnej.","Zapewnia spójność systemu prawa i przewidywalność sytuacji prawnej obywatela."]},"sideB":{"label":"Za prymatem parlamentu","points":["Sędziowie nie pochodzą z wyborów powszechnych, a mogą unieważnić decyzję organu wyłonionego przez wyborców.","Granica między wykładnią Konstytucji a rozstrzyganiem sporów politycznych bywa nieostra, co wciąga sąd konstytucyjny w politykę.","Kontrola sądowa może służyć zamrożeniu status quo i blokowaniu reform mających demokratyczne poparcie."]}},{"question":"Czy próg wyborczy 5% powinien zostać utrzymany?","sideA":{"label":"Za utrzymaniem progu","points":["Zapobiega rozdrobnieniu Sejmu, które utrudniałoby zbudowanie stabilnej większości rządowej.","Wymusza łączenie się małych ugrupowań i formułowanie szerszych programów.","Chroni przed paraliżem decyzyjnym znanym z okresu międzywojennego i z niektórych systemów wielopartyjnych."]},"sideB":{"label":"Za obniżeniem lub zniesieniem","points":["Głosy oddane na komitety poniżej progu przepadają, co narusza zasadę równości siły głosu.","Próg utrwala pozycję dużych partii i podnosi barierę wejścia dla nowych ruchów politycznych.","Stabilność rządu można zapewnić innymi mechanizmami, np. konstruktywnym wotum nieufności, które już obowiązuje."]}}],"cases":[{"situation":"Sejm uchwalił ustawę. Prezydent uważa, że jest ona szkodliwa politycznie, ale nie ma zastrzeżeń co do jej zgodności z Konstytucją. Rozważa, czy zawetować ją, czy skierować do Trybunału Konstytucyjnego — a najchętniej zrobiłby jedno i drugie.","question":"Jakie ma możliwości i czego zrobić nie może?","answer":"Prezydent ma trzy warianty: podpisać ustawę, skierować ją do TK w trybie kontroli prewencyjnej albo przekazać Sejmowi do ponownego rozpatrzenia (weto). Nie może połączyć weta z wnioskiem do TK — musi wybrać jedną drogę. Skoro zastrzeżenia mają charakter polityczny, a nie konstytucyjny, właściwym instrumentem jest weto. Sejm może je odrzucić większością 3/5 głosów w obecności co najmniej połowy ustawowej liczby posłów."},{"situation":"Grupa 50 posłów opozycji składa wniosek o wotum nieufności wobec Rady Ministrów, uzasadniając go złą sytuacją gospodarczą. Wniosek nie wskazuje żadnego kandydata na nowego premiera.","question":"Czy taki wniosek może doprowadzić do odwołania rządu?","answer":"Nie. Konstytucja przewiduje wyłącznie konstruktywne wotum nieufności — wniosek musi imiennie wskazywać kandydata na nowego Prezesa Rady Ministrów. Brak takiego wskazania powoduje, że wniosek jest formalnie wadliwy. Spełniony jest natomiast wymóg liczbowy: wniosek musi złożyć co najmniej 46 posłów, a złożyło go 50. Do przyjęcia wniosku konieczna byłaby bezwzględna większość ustawowej liczby posłów, czyli co najmniej 231 głosów."},{"situation":"Mieszkaniec gminy przegrał sprawę w sądzie. Uważa, że przepis ustawy, na podstawie którego zapadł wyrok, jest sprzeczny z konstytucyjną wolnością działalności gospodarczej. Wykorzystał już apelację i wyrok jest prawomocny.","question":"Jaki środek prawny mu przysługuje i jakie są jego granice?","answer":"Przysługuje mu skarga konstytucyjna do Trybunału Konstytucyjnego. Warunkiem jest wyczerpanie drogi prawnej — ten warunek został spełniony. Istotne ograniczenie: skarga nie służy podważeniu samego wyroku ani ustaleń faktycznych sądu, lecz wyłącznie zakwestionowaniu przepisu, na podstawie którego orzeczono o konstytucyjnych prawach skarżącego. Stwierdzenie niezgodności przepisu z Konstytucją otwiera dopiero drogę do wznowienia postępowania."},{"situation":"Po wyborach żadna partia nie ma samodzielnej większości. Prezydent desygnuje premiera i powołuje rząd, ale Sejm nie udziela mu wotum zaufania. W drugim kroku Sejm próbuje sam wybrać premiera — również bez skutku. W trzecim kroku inicjatywa wraca do Prezydenta, a Sejm ponownie odmawia zaufania.","question":"Co dzieje się dalej?","answer":"Prezydent skraca kadencję Sejmu i zarządza przedterminowe wybory. Warto zapamiętać różnicę w wymaganych większościach: w pierwszym i drugim kroku potrzebna jest bezwzględna większość głosów przy obecności co najmniej połowy ustawowej liczby posłów, natomiast w trzecim wystarczy większość zwykła. Konstytucja celowo ułatwia powołanie rządu na ostatnim etapie, a dopiero jego niepowodzenie prowadzi do rozwiązania izby."},{"situation":"Grupa 120 000 obywateli składa w Sejmie projekt ustawy. Po kilku miesiącach Sejm odrzuca go w pierwszym czytaniu. Inicjatorzy protestują, twierdząc, że skoro zebrali wymagane podpisy, Sejm miał obowiązek projekt uchwalić, a odrzucenie narusza zasadę suwerenności narodu.","question":"Czy mają rację?","answer":"Nie. Obywatelska inicjatywa ustawodawcza wymaga 100 000 podpisów — ten warunek spełniono — ale rodzi ona jedynie obowiązek rozpatrzenia projektu, a nie jego uchwalenia. Sejm zachowuje pełną swobodę decyzji, także co do odrzucenia. Nie narusza to zasady suwerenności narodu: Konstytucja przewiduje, że Naród sprawuje władzę przez przedstawicieli lub bezpośrednio, a inicjatywa obywatelska jest formą wprowadzenia sprawy pod obrady, nie zaś sposobem stanowienia prawa z pominięciem parlamentu."},{"situation":"Posła zatrzymuje policja za jazdę 50 km/h ponad dozwoloną prędkość. Poseł odmawia przyjęcia mandatu, powołując się na immunitet.","question":"Czy ma do tego prawo i co dzieje się dalej?","an
