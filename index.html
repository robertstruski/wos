swer":"Tak. Poseł ma immunitet formalny — bez zgody Sejmu nie może zostać pociągnięty do odpowiedzialności karnej ani za wykroczenia. Policja może skierować sprawę do Sejmu z wnioskiem o uchylenie immunitetu. Poseł może też sam się na to zgodzić — na przykład przyjąć mandat."},{"situation":"22-letnia studentka prawa chce kandydować w najbliższych wyborach do Senatu, a jej 19-letni brat — do Sejmu.","question":"Czy mogą kandydować?","answer":"Żadne z nich nie może. Bierne prawo wyborcze do Senatu przysługuje od 30 lat, a do Sejmu od 21 lat. Studentka może więc kandydować do Sejmu, ale nie do Senatu. Brat nie może kandydować do żadnej z izb, choć — jako osoba pełnoletnia — może głosować."},{"situation":"Prezydent RP umiera w trakcie kadencji.","question":"Kto przejmuje jego obowiązki i co dzieje się dalej?","answer":"Obowiązki Prezydenta tymczasowo przejmuje Marszałek Sejmu. Musi on w ciągu 14 dni zarządzić wybory prezydenckie, które odbywają się w ciągu 60 dni od ich zarządzenia. Tak było w 2010 r. po katastrofie smoleńskiej, gdy obowiązki przejął Marszałek Bronisław Komorowski."},{"situation":"Opozycja ostro krytykuje ministra zdrowia za stan szpitali. Nie chce obalać całego rządu, ale domaga się odwołania tego jednego ministra.","question":"Czy Sejm może odwołać pojedynczego ministra?","answer":"Tak. Sejm może wyrazić wotum nieufności wobec pojedynczego ministra. Wniosek musi złożyć co najmniej 69 posłów, a uchwała wymaga większości ustawowej liczby posłów, czyli co najmniej 231 głosów. Jeśli wniosek przejdzie, Prezydent odwołuje ministra."},{"situation":"Sejm uchwalił ustawę budżetową. Prezydent uważa, że zakłada ona zbyt wysokie wydatki, i zapowiada weto.","question":"Czy Prezydent może zawetować budżet?","answer":"Nie. Prezydent nie może zawetować ustawy budżetowej — musi ją podpisać w ciągu 7 dni albo skierować do Trybunału Konstytucyjnego, który ma 2 miesiące na wydanie orzeczenia. Uchwalenie budżetu przez Sejm jest tak ważne, że Konstytucja wyłącza tu weto."}],"quiz":[{"q":"Z ilu posłów składa się Sejm?","options":["100","230","460","560"],"correct":2,"explain":"Sejm liczy 460 posłów; Senat — 100 senatorów."},{"q":"Które przymiotniki charakteryzują wybory do Sejmu?","options":["powszechne, równe, bezpośrednie, proporcjonalne, tajne","powszechne, bezpośrednie, większościowe, tajne","pośrednie, równe, proporcjonalne","powszechne, jawne, proporcjonalne"],"correct":0,"explain":"Dla Senatu proporcjonalność nie obowiązuje — wybory są tam większościowe w okręgach jednomandatowych."},{"q":"Jaką większością Sejm odrzuca weto Prezydenta?","options":["zwykłą","bezwzględną","3/5 głosów","2/3 głosów"],"correct":2,"explain":"Weto odrzuca się większością 3/5 w obecności co najmniej połowy ustawowej liczby posłów."},{"q":"Ilu obywateli musi poprzeć obywatelski projekt ustawy?","options":["15 000","50 000","100 000","500 000"],"correct":2,"explain":"Wymagane jest 100 000 podpisów obywateli mających prawo wybierania do Sejmu."},{"q":"Na czym polega konstruktywne wotum nieufności?","options":["Wniosek wymaga zgody Prezydenta","Wniosek musi wskazywać kandydata na nowego premiera","Wystarczy zwykła większość głosów","Odwołuje pojedynczego ministra"],"correct":1,"explain":"Bez wskazania nowego premiera wniosek jest formalnie wadliwy — chroni to państwo przed próżnią władzy."},{"q":"Ile lat trwa kadencja sędziego Trybunału Konstytucyjnego?","options":["5 lat","6 lat","9 lat","dożywotnio"],"correct":2,"explain":"Sędziowie TK wybierani są przez Sejm na 9 lat, bez możliwości reelekcji."},{"q":"Kto z urzędu przewodniczy Trybunałowi Stanu?","options":["Prezes TK","Pierwszy Prezes Sądu Najwyższego","Marszałek Sejmu","Prezes NSA"],"correct":1,"explain":"Przewodniczącym Trybunału Stanu jest z urzędu Pierwszy Prezes Sądu Najwyższego."},{"q":"Które kryterium NIK stosuje wobec administracji rządowej, ale nie wobec samorządu?","options":["legalność","gospodarność","celowość","rzetelność"],"correct":2,"explain":"Wobec samorządu NIK nie bada celowości — to wyraz jego samodzielności."},{"q":"Jaką większością zmienia się Konstytucję w Sejmie?","options":["zwykłą","bezwzględną","3/5","2/3 przy kworum połowy"],"correct":3,"explain":"Sejm — 2/3 przy kworum połowy; Senat — bezwzględna większość przy takim samym kworum."},{"q":"Która jednostka samorządu ma domniemanie kompetencji?","options":["województwo","powiat","gmina","sołectwo"],"correct":2,"explain":"Wszystkie zadania samorządowe niezastrzeżone dla innych jednostek należą do gminy."},{"q":"Kim jest wojewoda?","options":["organem wykonawczym województwa","przewodniczącym sejmiku","przedstawicielem rządu w terenie","organem samorządu powiatowego"],"correct":2,"explain":"Organem wykonawczym województwa jest marszałek; wojewoda reprezentuje rząd i sprawuje nadzór."},{"q":"Kiedy wynik referendum ogólnokrajowego jest wiążący?","options":["zawsze","gdy frekwencja przekroczy 30%","gdy weźmie w nim udział więcej niż połowa uprawnionych","gdy zatwierdzi go Sejm"],"correct":2,"explain":"Wymagana jest frekwencja powyżej 50% uprawnionych do głosowania."},{"q":"Która umowa międzynarodowa ma pierwszeństwo przed ustawą?","options":["każda ratyfikowana","ratyfikowana za uprzednią zgodą wyrażoną w ustawie","ratyfikowana samodzielnie przez Prezydenta","podpisana przez ministra"],"correct":1,"explain":"Umowa ratyfikowana przez Prezydenta bez zgody parlamentu nie ma pierwszeństwa przed ustawą."},{"q":"Czym jest kontrasygnata?","options":["Zgoda Sejmu na akt Prezydenta","Podpis premiera przenoszący odpowiedzialność za akt Prezydenta na rząd","Prerogatywa Prezydenta","Opinia Trybunału Konstytucyjnego"],"correct":1,"explain":"Akty objęte kontrasygnatą obciążają politycznie rząd, który odpowiada za nie przed Sejmem."},{"q":"Ilu posłów musi złożyć wniosek o wotum nieufności wobec Rady Ministrów?","options":["15","46","69","115"],"correct":1,"explain":"46 posłów wobec całego rządu; 69 posłów wobec pojedynczego ministra."}]},{"id":"narod","number":"II","icon":"Flag","name":"Naród, tożsamość, mniejszości","blurb":"Naród i państwo, tożsamość narodowa, mniejszości narodowe i etniczne w Polsce, Polonia.","status":"ready","topics":[{"id":"narod-pojecie","title":"Czym jest naród","text":"**Naród** to wspólnota ludzi, którzy czują, że łączy ich coś trwałego: język, kultura, historia, terytorium i poczucie, że są odrębni od innych.\n\nIstnieją dwa sposoby rozumienia narodu. **Ujęcie etniczno-kulturowe** (nazywane niemieckim) mówi, że o przynależności decyduje pochodzenie, język i kultura — naród się w pewnym sensie dziedziczy. **Ujęcie polityczno-obywatelskie** (nazywane francuskim) mówi, że naród tworzą obywatele, którzy uznają wspólne państwo i wartości, niezależnie od tego, skąd pochodzą.\n\nW praktyce oba podejścia się mieszają. Konstytucja RP odwołuje się do jednego i drugiego: mówi o narodzie jako o wszystkich obywatelach Rzeczypospolitej, a jednocześnie przywołuje wspólne dziedzictwo kulturowe.\n\nNarodu nie należy mylić z **państwem**, czyli organizacją polityczną mającą terytorium, ludność i władzę. Państwo, w którym prawie wszyscy należą do jednego narodu — jak dzisiejsza Polska — nazywamy **jednonarodowym**. W historii było to jednak rzadkością; większość państw była i jest **wielonarodowa**."},{"id":"tozsamosc","title":"Tożsamość narodowa i patriotyzm","text":"**Tożsamość narodowa** to poczucie, że należy się do danego narodu, oraz utożsamianie się z jego kulturą, historią i symbolami. Nie rodzimy się z nią — kształtuje się przez rodzinę, szkołę, język, wspólne święta i rocznice.\n\n**Patriotyzm** to szacunek i troska o własną wspólnotę oraz gotowość do wysiłku na jej rzecz. Odróżnia się go od **nacjonalizmu**, który — w znaczeniu krytycznym — oznacza przekonanie o wyższości własnego narodu i lekceważenie innych. Warto jednak wiedzieć, że część badaczy używa słowa nacjonalizm neutralnie, po prostu na określenie dążenia do posiadania własnego państwa narodowego.\n\nDalej idą postawy skrajne. **Szowinizm** to agresywne wywyższanie własnego narodu połączone z wrogością wobec innych. **Ksenofobia** to lęk i niechęć wobec obcych. Na przeciwnym biegunie stoi **kosmopolityzm** — postawa, dla której ważniejsza od narodu jest przynależność do całej ludzkości.\n\nMówi się też o **patriotyzmie lokalnym**, czyli przywiązaniu do własnego miasta czy regionu, oraz o **patriotyzmie gospodarczym** — wspieraniu rodzimych firm i produktów."},{"id":"symbole","title":"Symbole narodowe i obowiązki obywatela","text":"**Symbole narodowe** określa sama Konstytucja. **Godłem** jest wizerunek orła białego w koronie na czerwonym polu, **barwami** biel i czerwień, a **hymnem** Mazurek Dąbrowskiego. Symbole są chronione prawem — ich znieważenie jest przestępstwem.\n\nKonstytucja wymienia też **obowiązki**. Są to: wierność Rzeczypospolitej i troska o dobro wspólne, przestrzeganie prawa, ponoszenie ciężarów publicznych — w tym **płacenie podatków** — obrona Ojczyzny oraz dbałość o środowisko. Warto zwrócić uwagę na jedną rzecz: płacenie podatków jest **obowiązkiem prawnym wynikającym z ustawy**, a nie kwestią dobrej woli czy deklarowanej postawy.\n\n**Obywatelstwo polskie** nabywa się przede wszystkim przez urodzenie z rodziców, z których przynajmniej jedno jest obywatelem polskim. Tę zasadę nazywamy **prawem krwi (ius sanguinis)**. Sam fakt urodzenia się na terytorium Polski — czyli **prawo ziemi (ius soli)** — co do zasady nie wystarcza; stosuje się je tylko pomocniczo, na przykład wobec dzieci znalezionych. Obywatelstwo może też **nadać Prezydent** albo **uznać wojewoda**."},{"id":"mniejszosci","title":"Mniejszości narodowe i etniczne w Polsce","text":"Ustawa z 2005 r. dzieli mniejszości na dwie grupy, a różnica między nimi jest prosta.\n\n**Mniejszość narodowa** to grupa, która utożsamia się z narodem mającym własne państwo gdzie indziej. Ustawa wymienia **dziewięć** takich mniejszości: białoruską, czeską, litewską, niemiecką, ormiańską, rosyjską, słowacką, ukraińską i żydowską.\n\n**Mniejszość etniczna** to grupa, która **nie ma własnego państwa** nigdzie na świecie. Ustawa wymienia **cztery**: karaimską, łemkowską, romską i tatarską.\n\nWspólny warunek dla obu grup: zamieszkiwanie na terenie Polski od co najmniej **stu lat**. Dlatego niedawno przybyli imigranci nie są mniejszością w rozumieniu tej ustawy.\n\nOsobny status ma **język kaszubski** — jedyny uznany w Polsce **język regionalny**. Nie jest to język mniejszości narodowej ani etnicznej, lecz trzecia, odrębna kategoria.\n\nUstawa daje mniejszościom konkretne uprawnienia: prawo do nauki własnego języka, możliwość używania go jako **języka pomocniczego** w urzędach gmin, gdzie mniejszość stanowi **co najmniej 20%** mieszkańców, prawo do **dwujęzycznych nazw miejscowości** oraz zakaz dyskryminacji i przymusowej asymilacji. W wyborach do Sejmu komitety mniejszości narodowych są **zwolnione z progu wyborczego**."},{"id":"polonia","title":"Polonia i emigracja","text":"**Polonia** to osoby polskiego pochodzenia mieszkające poza Polską wraz z ich potomkami. Największe skupiska to Stany Zjednoczone, Niemcy, Wielka Brytania, Kanada i Francja.\n\nOsobną grupę stanowią Polacy na Wschodzie — na Białorusi, Litwie i Ukrainie. Warto pamiętać, że w wielu wypadkach oni nigdzie nie wyjechali: znaleźli się poza Polską dlatego, że po II wojnie światowej **przesunięto granice**.\n\nFale wyjazdów miały różne przyczyny. **Emigracja polityczna** to ucieczka przed represjami — Wielka Emigracja po powstaniu listopadowym, wyjazdy po II wojnie światowej i po wprowadzeniu stanu wojennego. **Emigracja zarobkowa** to wyjazdy za pracą: masowa emigracja 'za chlebem' na przełomie XIX i XX w. oraz wyjazdy po wejściu Polski do Unii Europejskiej w 2004 r.\n\nPaństwo utrzymuje kontakt z Polonią przez ambasady i konsulaty, wspieranie szkół polonijnych, media (m.in. TVP Polonia) oraz **Kartę Polaka**. Karta potwierdza przynależność do narodu polskiego i daje pewne uprawnienia w Polsce, ale **nie jest obywatelstwem** — to częsty błąd."},{"id":"migracje","title":"Migracje i wielokulturowość","text":"**Migracje** to przemieszczanie się ludzi na stałe lub na dłuższy czas. Dzieli się je na wewnętrzne (w obrębie kraju) i zagraniczne, dobrowolne i przymusowe, legalne i nielegalne. **Emigracja** to wyjazd z kraju, **imigracja** — przyjazd do niego.\n\nKluczowe jest rozróżnienie dwóch pojęć, bo ma ono skutki prawne. **Uchodźca** to osoba, która opuściła kraj, bo groziły jej prześladowania — i tylko jej przysługuje **ochrona międzynarodowa**. **Migrant ekonomiczny** wyjeżdża w poszukiwaniu lepszych warunków życia i takiej ochrony nie otrzymuje.\n\nPolska przez dekady była krajem, z którego się wyjeżdżało. W ostatnich latach stała się także krajem, do którego się przyjeżdża — głównie z Ukrainy i Białorusi, a po 2022 r. również w związku z wojną.\n\nPaństwa różnie radzą sobie z różnorodnością kulturową. **Asymilacja** oznacza, że przybysze mają przyjąć kulturę większości i porzucić własną. **Integracja** zakłada pełne uczestnictwo w życiu społecznym przy zachowaniu własnej tożsamości. **Wielokulturowość** to aktywne wspieranie odrębnych kultur przez państwo. **Separacja** oznacza życie obok siebie bez kontaktu. Który model działa najlepiej, pozostaje przedmiotem sporu w całej Europie, a doświadczenia poszczególnych krajów bywają bardzo różne."}],"concepts":[{"term":"Naród","def":"Wspólnota połączona poczuciem tożsamości opartym na kulturze, języku, historii i terytorium."},{"term":"Koncepcja etniczno-kulturowa narodu","def":"Ujęcie, w którym o przynależności do narodu decyduje pochodzenie, język i kultura."},{"term":"Koncepcja polityczno-obywatelska narodu","def":"Ujęcie, w którym naród tworzą obywatele państwa niezależnie od pochodzenia etnicznego."},{"term":"Tożsamość narodowa","def":"Poczucie przynależności do wspólnoty narodowej i identyfikacji z jej kulturą oraz historią."},{"term":"Patriotyzm","def":"Przywiązanie do ojczyzny połączone z troską o dobro wspólne i gotowością działania na jej rzecz."},{"term":"Nacjonalizm","def":"Ideologia stawiająca naród w centrum polityki; w wersji skrajnej — interes narodu ponad wszystkie inne wartości."},{"term":"Szowinizm","def":"Skrajne wywyższanie własnego narodu połączone z pogardą dla innych."},{"term":"Ksenofobia","def":"Lęk i niechęć wobec obcych, cudzoziemców lub odmiennych kulturowo."},{"term":"Mniejszość narodowa","def":"Grupa utożsamiająca się z narodem zorganizowanym we własnym państwie, np. mniejszość niemiecka."},{"term":"Mniejszość etniczna","def":"Grupa o odrębnej tożsamości, która nie posiada własnego państwa, np. Łemkowie, Romowie."},{"term":"Język regionalny","def":"Status przysługujący w Polsce wyłącznie językowi kaszubskiemu."},{"term":"Język pomocniczy","def":"Język mniejszości dopuszczony w kontaktach z urzędem w gminach, gdzie mniejszość stanowi co najmniej 20% mieszkańców."},{"term":"Ius sanguinis","def":"Zasada krwi — nabycie obywatelstwa po rodzicach, podstawowa w prawie polskim."},{"term":"Ius soli","def":"Zasada ziemi — nabycie obywatelstwa przez urodzenie na terytorium państwa."},{"term":"Karta Polaka","def":"Dokument potwierdzający przynależność do narodu polskiego, niedający obywatelstwa."},{"term":"Asymilacja","def":"Przyjęcie przez grupę mniejszościową kultury większości i zanik odrębności."},{"term":"Integracja","def":"Włączenie mniejszości w życie społeczne przy zachowaniu jej odrębności kulturowej."}],"numbers":[{"label":"Mniejszości narodowe uznane ustawowo","value":"9"},{"label":"Mniejszości etniczne uznane ustawowo","value":"4"},{"label":"Języki regionalne w Polsce","value":"1 (kaszubski)"},{"label":"Próg dla języka pomocniczego w gminie","value":"20% mieszkańców"},{"label":"Wymóg zamieszkiwania dla uznania mniejszości","value":"co najmniej 100 lat"},{"label":"Próg wyborczy dla komitetów mniejszości","value":"nie obowiązuje"},{"label":"Ustawa o mniejszościach","value":"6 stycznia 2005 r."},{"label":"Wejście Polski do UE (początek fali migracji)","value":"1 maja 2004 r."}],"acts":[{"act":"Konstytucja RP","article":"Art. 35","text":"1. Rzeczpospolita Polska zapewnia obywatelom polskim należącym do mniejszości narodowych i etnicznych wolność zachowania i rozwoju własnego języka, zachowania obyczajów i tradycji oraz rozwoju własnej kultury.\n2. Mniejszości narodowe i etniczne mają prawo do tworzenia własnych instytucji edukacyjnych, kulturalnych i instytucji służących ochronie tożsamości religijnej oraz do uczestnictwa w rozstrzyganiu spraw dotyczących ich tożsamości kulturowej.","note":"Konstytucyjna podstawa ochrony mniejszości; ustawa z 2005 r. ją konkretyzuje."},{"act":"Konstytucja RP","article":"Art. 34","text":"1. Obywatelstwo polskie nabywa się przez urodzenie z rodziców będących obywatelami polskimi. Inne przypadki nabycia obywatelstwa polskiego określa ustawa.\n2. Obywatel polski nie może utracić obywatelstwa polskiego, chyba że sam się go zrzeknie.","note":"Zasada krwi jako podstawowa oraz zakaz jednostronnego pozbawienia obywatelstwa przez państwo."},{"act":"Konstytucja RP","article":"Art. 82","text":"Obowiązkiem obywatela polskiego jest wierność Rzeczypospolitej Polskiej oraz troska o dobro wspólne.","note":"Obowiązek adresowany wyłącznie do obywateli — inaczej niż obowiązek przestrzegania prawa z art. 83."},{"act":"Konstytucja RP","article":"Art. 27","text":"W Rzeczypospolitej Polskiej językiem urzędowym jest język polski. Przepis ten nie narusza praw mniejszości narodowych wynikających z ratyfikowanych umów międzynarodowych.","note":"Język urzędowy nie wyklucza używania języka pomocniczego mniejszości w gminach spełniających próg 20%."}],"disputes":[{"question":"Czy państwo powinno aktywnie wspierać zachowanie odrębności mniejszości, czy raczej dążyć do ich integracji z większością?","sideA":{"label":"Za wsparciem odrębności","points":["Różnorodność kulturowa jest wartością samą w sobie i częścią dziedzictwa całego kraju.","Prawo do zachowania języka i tradycji jest prawem człowieka, a nie przywilejem nadawanym z łaski większości.","Wsparcie państwa równoważy naturalną przewagę kultury dominującej i chroni języki zagrożone wymarciem."]},"sideB":{"label":"Za priorytetem wspólnoty obywatelskiej","points":["Wspólny język i wspólne instytucje ułatwiają porozumienie oraz równy dostęp do rynku pracy i edukacji.","Zbyt silne akcentowanie odrębności może utrwalać podziały i sprzyjać powstawaniu równoległych społeczeństw.","Środki publiczne są ograniczone, a rozdzielne systemy edukacji i administracji podnoszą koszty funkcjonowania państwa."]}},{"question":"Czy patriotyzm i nacjonalizm da się jednoznacznie rozgraniczyć?","sideA":{"label":"Za wyraźnym rozróżnieniem","points":["Patriotyzm to troska o własną wspólnotę, nacjonalizm — przekonanie o jej wyższości nad innymi; to różnica jakościowa, nie stopnia.","Patriotyzm bywa łączony z krytycyzmem wobec własnego państwa; skrajny nacjonalizm zwykle krytykę odrzuca.","Rozróżnienie ma znaczenie praktyczne — pozwala oceniać konkretne postawy i programy polityczne."]},"sideB":{"label":"Za krytyką rozróżnienia","points":["Oba pojęcia bywają używane wartościująco: to samo stanowisko jedni nazwą patriotyzmem, inni nacjonalizmem.","W wielu językach i tradycjach politycznych nacjonalizm oznacza po prostu ruch narodowy, bez negatywnego zabarwienia.","Etykietowanie przeciwnika mianem nacjonalisty bywa narzędziem sporu politycznego, a nie opisem rzeczywistości."]}}],"cases":[{"situation":"W gminie na Opolszczyźnie mniejszość niemiecka stanowi 24% mieszkańców. Rada gminy chce wprowadzić dwujęzyczne tablice z nazwami miejscowości oraz umożliwić składanie pism w urzędzie po niemiecku.","question":"Czy jest to prawnie dopuszczalne i pod jakimi warunkami?","answer":"Tak. Ustawa o mniejszościach narodowych i etnicznych przewiduje możliwość używania języka mniejszości jako języka pomocniczego w gminach, w których mniejszość stanowi co najmniej 20% mieszkańców — próg jest tu spełniony (24%). Dopuszczalne są także dodatkowe, dwujęzyczne nazwy miejscowości. Kluczowe zastrzeżenie: język polski pozostaje językiem urzędowym, a nazwa w języku mniejszości ma charakter dodatkowy, nie zastępuje nazwy polskiej. Wymagany jest ponadto wpis gminy do właściwego rejestru prowadzonego przez ministra."},{"situation":"Dziecko rodzi się w Kanadzie. Matka jest obywatelką polską mieszkającą tam od dziesięciu lat, ojciec jest Kanadyjczykiem. Rodzice zastanawiają się, czy dziecko ma obywatelstwo polskie.","question":"Jakie obywatelstwo nabywa dziecko według prawa polskiego i dlaczego?","answer":"Dziecko nabywa obywatelstwo polskie z mocy prawa. Polska stosuje zasadę krwi (ius sanguinis): wystarczy, że co najmniej jedno z rodziców jest obywatelem polskim, a miejsce urodzenia nie ma znaczenia — długoletni pobyt matki za granicą również niczego nie zmienia. Równolegle dziecko może nabyć obywatelstwo kanadyjskie według prawa tego państwa, co oznacza podwójne obywatelstwo. Prawo polskie traktuje wówczas taką osobę wyłącznie jako obywatela polskiego na terytorium RP."},{"situation":"Komitet wyborczy reprezentujący mniejszość litewską uzyskał w wyborach do Sejmu 1,2% głosów w skali kraju, ale skoncentrowanych w kilku okręgach na Suwalszczyźnie.","question":"Czy komitet może uzyskać mandaty mimo wyniku poniżej 5%?","answer":"Tak. Kodeks wyborczy zwalnia komitety wyborcze organizacji mniejszości narodowych z obowiązku przekroczenia progu wyborczego. Rozwiązanie to ma zapewnić mniejszościom możliwość reprezentacji parlamentarnej mimo niewielkiej liczebności w skali kraju. Warunkiem jest zgłoszenie takiego charakteru komitetu Państwowej Komisji Wyborczej. Uzyskanie mandatu zależy następnie od wyniku w konkretnym okręgu przy podziale mandatów metodą D'Hondta — samo zwolnienie z progu mandatu nie gwarantuje."},{"situation":"Rodzina od trzech pokoleń mieszka w Polsce, posiada polskie obywatelstwo i mówi po polsku, ale w domu kultywuje tradycje ormiańskie, obchodzi ormiańskie święta i posyła dzieci na lekcje języka ormiańskiego. Sąsiad twierdzi, że „skoro mają polskie paszporty, to są Polakami i tyle”.","question":"Kto ma rację i jak wygląda to w świetle polskiego prawa?","answer":"Sąsiad myli obywatelstwo z tożsamością narodową. Obywatelstwo to więź prawna z państwem, a przynależność narodowa opiera się na poczuciu tożsamości i kulturze — te osoby są obywatelami polskimi należącymi do mniejszości ormiańskiej. Ustawa z 2005 r. wymienia Ormian wśród dziewięciu mniejszości narodowych, a Konstytucja gwarantuje im wolność zachowania języka, obyczajów i kultury oraz zakazuje przymusowej asymilacji. Przynależność do mniejszości jest przy tym sprawą indywidualnego wyboru, nie urzędowego przypisania."},{"situation":"Grupa pracowników z Filipin pracuje legalnie w Polsce od trzech lat. Tworzą własne stowarzyszenie, organizują święta narodowe i chcą, by gmina wprowadziła dwujęzyczne tablice oraz umożliwiła załatwianie spraw urzędowych po angielsku, powołując się na prawa mniejszości.","question":"Czy przysługują im uprawnienia przewidziane dla mniejszości narodowych?","answer":"Nie. Ustawa z 2005 r. stawia warunek zamieszkiwania na terytorium Polski od co najmniej stu lat — grupa niedawno przybyłych imigrantów nie spełnia go, niezależnie od legalności pobytu i stopnia zorganizowania. Nie oznacza to braku ochrony: przysługują im prawa człowieka, ochrona przed dyskryminacją i prawa pracownicze. Kazus pokazuje różnicę między mniejszością narodową w rozumieniu ustawy a społecznością imigrancką, do której stosuje się politykę integracyjną, a nie przepisy o mniejszościach."},{"situation":"Pan Marek wyjechał do USA 30 lat temu i ma obywatelstwo amerykańskie. Przed przyjazdem na wakacje do Polski martwi się, że stracił polskie obywatelstwo, bo „przyjął inne”.","question":"Czy pan Marek nadal jest obywatelem polskim?","answer":"Tak. Przyjęcie obcego obywatelstwa nie powoduje utraty polskiego — obywatelstwo polskie traci się tylko na własny wniosek, za zgodą Prezydenta RP. Wobec Rzeczypospolitej pan Marek jest traktowany wyłącznie jako obywatel polski, więc powinien wjeżdżać do Polski na polskim dokumencie."},{"situation":"Na meczu reprezentacji grupa kibiców wygwizduje hymn drużyny przeciwnej, pali jej flagę i wykrzykuje obraźliwe hasła o mieszkańcach tamtego kraju. Obok siedzi kibic, który głośno śpiewa „Mazurka Dąbrowskiego” i dopinguje polską drużynę, ale z szacunkiem przyjmuje hymn rywali.","question":"Jak ocenić obie postawy?","answer":"Drugi kibic prezentuje patriotyzm — miłość do własnej ojczyzny połączoną z szacunkiem dla innych narodów. Pierwsza grupa przejawia szowinizm (nacjonalizm skrajny) i ksenofobię — przekonanie o wyższości własnego narodu połączone z pogardą i wrogością wobec innych."},{"situation":"Pan Józef z Katowic w spisie powszechnym zadeklarował narodowość śląską. Teraz chce, żeby w jego gminie wprowadzono język śląski jako pomocniczy, powołując się na prawa mniejszości.","question":"Czy pan Józef może skorzystać z praw przewidzianych dla mniejszości?","answer":"Nie. W spisie każdy może zadeklarować dowolną narodowość, ale ustawa o mniejszościach narodowych i etnicznych oraz o języku regionalnym nie wymienia Ślązaków ani języka śląskiego. Uprawnienia, np. język pomocniczy, przysługują tylko wymienionym w niej 9 mniejszościom narodowym, 4 etnicznym oraz społeczności posługującej się językiem kaszubskim."},{"situation":"Pani Irena mieszka na Białorusi. Jej dziadkowie byli Polakami, w domu mówi się po polsku i obchodzi polskie święta. Pani Irena chce uzyskać Kartę Polaka i myśli, że dzięki niej zostanie obywatelką polską.","question":"Czym jest Karta Polaka i czy daje obywatelstwo?","answer":"Karta Polaka to dokument potwierdzający przynależność do narodu polskiego osób polskiego pochodzenia ze Wschodu. Nie jest równoznaczna z obywatelstwem ani nie zastępuje wizy czy paszportu. Ułatwia jednak legalną pracę, naukę i pobyt w Polsce, a następnie uzyskanie zezwolenia na pobyt stały i obywatelstwa."},{"situation":"Do Polski przyjeżdża dwóch mężczyzn. Pierwszy uciekł z kraju, w którym grozi mu więzienie za udział w antyrządowych protestach. Drugi przyjechał, bo w Polsce zarobi kilka razy więcej niż u siebie.","question":"Który z nich jest uchodźcą w rozumieniu prawa międzynarodowego?","answer":"Uchodźcą jest pierwszy mężczyzna. Według konwencji genewskiej z 1951 r. uchodźca to osoba, która opuściła swój kraj z uzasadnionej obawy przed prześladowaniem z powodu rasy, religii, narodowości, przynależności do grupy społecznej lub poglądów politycznych. Drugi to migrant ekonomiczny — wyjechał dobrowolnie w poszukiwaniu lepszych zarobków i nie ma prawa do ochrony jako uchodźca."}],"quiz":[{"q":"Która koncepcja narodu akcentuje wspólnotę obywateli niezależnie od pochodzenia?","options":["etniczno-kulturowa","polityczno-obywatelska","religijna","plemienna"],"correct":1,"explain":"Koncepcja polityczno-obywatelska (francuska) definiuje naród przez wspólne obywatelstwo i instytucje."},{"q":"Co odróżnia naród od państwa?","options":["naród to organizacja polityczna z terytorium i władzą","naród to wspólnota oparta na poczuciu tożsamości, a państwo to organizacja polityczna","to synonimy","naród zawsze pokrywa się z granicami państwa"],"correct":1,"explain":"Dlatego istnieją zarówno państwa wielonarodowe, jak i narody bez własnego państwa."},{"q":"Ile mniejszości narodowych uznaje polska ustawa z 2005 r.?","options":["4","9","13","15"],"correct":1,"explain":"Dziewięć mniejszości narodowych oraz — osobno — cztery mniejszości etniczne."},{"q":"Która z wymienionych jest mniejszością etniczną, a nie narodową?","options":["niemiecka","ukraińska","łemkowska","litewska"],"correct":2,"explain":"Łemkowie nie mają własnego państwa, dlatego są mniejszością etniczną."},{"q":"Który język ma w Polsce status języka regionalnego?","options":["śląski","kaszubski","łemkowski","mazurski"],"correct":1,"explain":"Ustawa przyznaje status języka regionalnego wyłącznie kaszubskiemu."},{"q":"Od jakiego progu mniejszość może używać języka pomocniczego w gminie?","options":["10%","15%","20%","30%"],"correct":2,"explain":"Próg wynosi 20% mieszkańców gminy."},{"q":"Jaka zasada nabycia obywatelstwa jest podstawowa w prawie polskim?","options":["ius soli","ius sanguinis","naturalizacja","repatriacja"],"correct":1,"explain":"Obywatelstwo nabywa się przede wszystkim po rodzicach, niezależnie od miejsca urodzenia."},{"q":"Czy państwo polskie może pozbawić obywatela obywatelstwa?","options":["Tak, decyzją Prezydenta","Tak, wyrokiem sądu","Nie — utrata możliwa tylko przez zrzeczenie się","Tak, w razie zdrady stanu"],"correct":2,"explain":"Konstytucja dopuszcza utratę obywatelstwa wyłącznie przez dobrowolne zrzeczenie się."},{"q":"Czym jest Karta Polaka?","options":["Dokumentem nadającym obywatelstwo","Potwierdzeniem przynależności do narodu polskiego bez nadania obywatelstwa","Wizą pracowniczą","Paszportem tymczasowym"],"correct":1,"explain":"Karta Polaka daje ułatwienia w pracy i nauce, ale nie jest równoznaczna z obywatelstwem."},{"q":"Które prawo przysługuje wyłącznie obywatelom polskim?","options":["prawo do życia","wolność sumienia","czynne prawo wyborcze do Sejmu","prawo do sądu"],"correct":2,"explain":"Prawa polityczne zastrzeżone są dla obywateli; prawa człowieka przysługują każdemu."},{"q":"Czy komitet mniejszości narodowej musi przekroczyć próg 5% w wyborach do Sejmu?","options":["Tak, zawsze","Nie — jest z progu zwolniony","Tak, ale próg wynosi 3%","Tylko w wyborach do Senatu"],"correct":1,"explain":"Zwolnienie z progu ma zapewnić mniejszościom możliwość reprezentacji parlamentarnej."},{"q":"Płacenie podatków jest według Konstytucji:","options":["dobrowolnym aktem patriotyzmu","obowiązkiem wynikającym z ustawy","przywilejem obywatelskim","wyłącznie obowiązkiem przedsiębiorców"],"correct":1,"explain":"Art. 84 określa ponoszenie ciężarów publicznych jako obowiązek prawny określony w ustawie."}]},{"id":"polityka","number":"III","icon":"Megaphone","name":"Polityka — teoria i systemy","blurb":"Władza, ideologie i doktryny, partie, systemy partyjne, reżimy polityczne, media.","status":"ready","topics":[{"id":"wladza","title":"Polityka, władza i legitymizacja","text":"**Polityka** to działalność związana ze zdobywaniem i sprawowaniem władzy oraz decydowaniem o sprawach wspólnych. **Władza polityczna** to zdolność do narzucenia swojej woli innym — także wtedy, gdy się z nią nie zgadzają.\n\nSama siła to jednak za mało. Żeby władza działała sprawnie, ludzie muszą uznawać, że sprawuje ją ktoś, kto ma do tego prawo. To uznanie nazywamy **legitymizacją**, czyli prawomocnością władzy.\n\n**Max Weber** wyróżnił trzy powody, dla których ludzie uznają czyjąś władzę. **Legitymizacja tradycyjna** opiera się na zwyczaju i dziedziczeniu — tak rządzili królowie. **Legitymizacja charyzmatyczna** wynika z wyjątkowych cech przywódcy, w którego ludzie wierzą. **Legitymizacja legalna** opiera się na prawie — rządzi ten, kto został wybrany zgodnie z obowiązującymi przepisami. To ostatnie jest podstawą władzy w państwach demokratycznych.\n\nWładzę można też podzielić według tego, jak działa: przez **przymus** (kara, siła), przez **zachętę** (korzyści, pieniądze) albo przez **przekonanie** (autorytet, wspólne wartości). Władza, która musi opierać się głównie na przymusie, jest zwykle słaba — bo znaczy to, że straciła uznanie rządzonych."},{"id":"teorie-panstwa","title":"Teorie powstania państwa","text":"Skąd wzięło się państwo i dlaczego jedni rządzą innymi? Na to pytanie odpowiadano przez wieki bardzo różnie, a każda odpowiedź prowadziła do innych wniosków o tym, jaka władza jest słuszna.\n\n**Teoria teistyczna (boskiego pochodzenia)** głosi, że państwo i władza pochodzą od Boga, a władca sprawuje rządy z Jego woli. Sprzeciw wobec władcy jest więc sprzeciwem wobec Boga. Tak uzasadniano monarchie średniowieczne i absolutne.\n\n**Teoria patriarchalna** wywodzi państwo z rodziny: władza króla nad poddanymi jest przedłużeniem naturalnej władzy ojca nad domownikami. Państwo powstało z rozrastania się rodów i plemion.\n\n**Teoria podboju (przemocy)** mówi, że państwo powstało, gdy silniejsza grupa podbiła słabszą i zorganizowała aparat władzy, by utrzymać ją w posłuszeństwie. Państwo jest tu przede wszystkim narzędziem panowania.\n\n**Teoria umowy społecznej** to najważniejsza koncepcja nowożytna. Zakłada, że ludzie żyli najpierw w stanie natury, bez władzy, a państwo powstało z ich porozumienia. **Thomas Hobbes** uważał, że stan natury był wojną wszystkich ze wszystkimi, więc ludzie oddali władzę silnemu władcy, by zapewnić sobie bezpieczeństwo. **John Locke** twierdził, że ludzie mieli prawa naturalne — do życia, wolności i własności — a państwo powołali po to, by ich strzegło; jeśli władza je łamie, wolno ją obalić. **Jan Jakub Rousseau** głosił, że władza należy do ludu i nie można jej nikomu oddać na stałe.\n\n**Teoria marksistowska** wiąże powstanie państwa z podziałem na klasy: gdy pojawiła się własność prywatna, klasa posiadająca stworzyła państwo jako narzędzie utrzymania przewagi nad resztą.\n\nWspółcześnie za najbardziej przekonującą uznaje się **teorię ewolucyjną**, według której państwo wyłaniało się stopniowo — wraz z rolnictwem, osiadłym trybem życia i potrzebą organizowania coraz większych grup."},{"id":"ideologie","title":"Główne ideologie i doktryny polityczne","text":"**Ideologia** to spójny zbiór poglądów na to, jak powinno wyglądać społeczeństwo i państwo, wraz z pomysłem, jak do tego dojść.\n\n**Liberalizm** stawia na pierwszym miejscu wolność jednostki. Głosi ograniczoną rolę państwa, ochronę własności prywatnej, swobodę gospodarczą i prawa obywatelskie. W wersji gospodarczej domaga się jak najmniejszej ingerencji państwa w rynek; w wersji socjalnej dopuszcza, by państwo wyrównywało szanse.\n\n**Konserwatyzm** ceni tradycję, religię, rodzinę i wypracowany przez pokolenia porządek. Jest nieufny wobec gwałtownych reform — nie dlatego, że odrzuca zmiany, lecz dlatego, że woli je stopniowe i sprawdzone. Podkreśla znaczenie autorytetu i wspólnoty narodowej.\n\n**Socjalizm** koncentruje się na równości i sprawiedliwości społecznej. Krytykuje nierówności wynikające z rynku i domaga się silnej roli państwa: redystrybucji dochodów, praw pracowniczych, publicznej edukacji i ochrony zdrowia. Skrajną odmianą jest **komunizm**, dążący do zniesienia własności prywatnej środków produkcji.\n\n**Chrześcijańska demokracja (chadecja)** to nurt łączący elementy konserwatyzmu i socjalizmu, wyrosły z katolickiej nauki społecznej. Broni tradycyjnych wartości i rodziny, ale jednocześnie domaga się od państwa troski o najsłabszych i praw pracowniczych — odrzuca zarówno nieograniczony rynek, jak i komunizm. Jej kluczowe idee to **solidarność** (obowiązek wzajemnej pomocy), **dobro wspólne** oraz **pomocniczość (subsydiarność)** — zasada, według której sprawy powinny być załatwiane na możliwie najniższym szczeblu, a państwo wkracza dopiero wtedy, gdy rodzina czy wspólnota lokalna sobie nie radzi. Chadecja odegrała ogromną rolę w powojennej Europie Zachodniej i przy budowie integracji europejskiej.\n\n**Nacjonalizm** stawia naród w centrum polityki. **Anarchizm** odrzuca państwo jako instytucję opartą na przymusie. **Ekologizm** za najważniejsze uznaje ochronę środowiska i granice wzrostu gospodarczego. **Faszyzm** i **nazizm** to ideologie totalitarne, oparte na kulcie wodza, przemocy i — w przypadku nazizmu — rasizmie."},{"id":"demokracja-bezposrednia","title":"Demokracja bezpośrednia i jej formy","text":"**Demokracja bezpośrednia** to taki sposób rządzenia, w którym obywatele sami podejmują decyzje, zamiast powierzać je wybranym przedstawicielom. Jej pierwowzorem było zgromadzenie ludowe w starożytnych Atenach, gdzie obywatele głosowali osobiście nad sprawami miasta.\n\nDziś nie da się w ten sposób rządzić całym państwem, dlatego demokracja bezpośrednia występuje jako uzupełnienie demokracji przedstawicielskiej. Ma kilka form.\n\n**Referendum** to głosowanie powszechne, w którym obywatele odpowiadają na postawione pytanie. Dzieli się je na kilka sposobów: **ogólnokrajowe** i **lokalne** (według zasięgu), **obligatoryjne** — obowiązkowe, gdy wymaga tego prawo — i **fakultatywne**, zarządzane wedle uznania, a także **wiążące**, gdy wynik trzeba wykonać, i **opiniodawcze**, gdy jest jedynie wskazówką. W Polsce referendum ogólnokrajowe jest wiążące, jeżeli wzięła w nim udział więcej niż połowa uprawnionych.\n\n**Plebiscyt** to głosowanie w sprawie przynależności państwowej danego terytorium — tak rozstrzygano m.in. losy Górnego Śląska po I wojnie światowej.\n\n**Inicjatywa ludowa (obywatelska)** pozwala grupie obywateli zgłosić projekt ustawy. W Polsce wymaga podpisów 100 000 osób; Sejm musi taki projekt rozpatrzyć, ale nie musi go uchwalić.\n\n**Weto ludowe** daje obywatelom prawo poddania pod głosowanie uchwalonej już ustawy i jej odrzucenia — w Polsce ta forma nie występuje.\n\n**Recall (odwołanie ze stanowiska)** to głosowanie nad usunięciem urzędnika przed końcem kadencji. W Polsce działa na szczeblu lokalnym jako referendum w sprawie odwołania wójta lub rady.\n\nDo form uczestnictwa obywateli zalicza się też **konsultacje społeczne**, **wysłuchanie publiczne** oraz **budżet obywatelski**, w którym mieszkańcy decydują o przeznaczeniu części pieniędzy gminy."},{"id":"partie","title":"Partie polityczne i grupy interesu","text":"**Partia polityczna** to dobrowolna organizacja, która dąży do zdobycia władzy w państwie, żeby realizować swój program. Odróżnia ją to od innych organizacji: partia chce rządzić, a nie tylko wpływać.\n\nPartie pełnią kilka zadań: układają programy i przedstawiają je wyborcom, wystawiają kandydatów w wyborach, obsadzają stanowiska w państwie, a przegrywając — kontrolują rządzących jako opozycja. Łączą też obywateli z władzą, przenosząc oczekiwania ludzi do polityki.\n\nDzieli się je na różne sposoby: według programu (lewicowe, centrowe, prawicowe), według sposobu działania (masowe, o dużej liczbie członków, i kadrowe, oparte na wąskiej grupie działaczy) oraz według stosunku do ustroju (systemowe, działające w jego ramach, i antysystemowe, dążące do jego obalenia).\n\n**Grupa interesu** to organizacja, która nie chce zdobyć władzy, lecz wpłynąć na jej decyzje w konkretnej sprawie — to związki zawodowe, organizacje pracodawców, stowarzyszenia branżowe. Ich działanie na rzecz określonych rozwiązań nazywa się **lobbingiem**. Lobbing jest legalny i w Polsce uregulowany ustawą; od korupcji odróżnia go jawność i brak korzyści majątkowej dla decydenta.\n\nCałość organizacji obywatelskich działających niezależnie od państwa — stowarzyszeń, fundacji, związków, ruchów — nazywamy **społeczeństwem obywatelskim**. Uznaje się je za jeden z warunków sprawnej demokracji, bo pozwala ludziom działać wspólnie bez czekania na państwo."},{"id":"systemy-partyjne","title":"Systemy partyjne i systemy rządów","text":"**System partyjny** to układ partii w danym państwie i zasady rywalizacji między nimi. **System jednopartyjny** dopuszcza tylko jedną partię i występuje w państwach niedemokratycznych. **System dwupartyjny** to układ, w którym o władzę realnie walczą dwie duże partie — jak w USA czy Wielkiej Brytanii. **System wielopartyjny** oznacza kilka liczących się ugrupowań, zwykle zmuszonych do tworzenia koalicji; tak jest w Polsce.\n\nOsobno dzieli się **systemy rządów**, czyli układ relacji między prezydentem, rządem i parlamentem. W **systemie parlamentarno-gabinetowym** rząd wyłania parlament i przed nim odpowiada, a prezydent pełni funkcje głównie reprezentacyjne — tak działa Polska, Niemcy czy Włochy. W **systemie prezydenckim** prezydent jest jednocześnie szefem państwa i rządu, pochodzi z wyborów powszechnych i nie może zostać odwołany przez parlament — tak jest w USA. **System półprezydencki (mieszany)** łączy oba rozwiązania: silny prezydent współistnieje z rządem odpowiedzialnym przed parlamentem, jak we Francji.\n\nOdrębnym rozwiązaniem jest **system kanclerski** w Niemczech, gdzie pozycję szefa rządu wzmacnia m.in. konstruktywne wotum nieufności, oraz **system komitetowy** w Szwajcarii, w którym władzę wykonawczą sprawuje kolegialna rada."},{"id":"wybory","title":"Wybory i przymiotniki wyborcze","text":"Wybory to podstawowy sposób, w jaki obywatele powierzają komuś władzę. Zasady, na jakich się odbywają, opisuje się za pomocą tzw. **przymiotników wyborczych**. To jedno z najczęściej sprawdzanych zagadnień, warto więc znać je dokładnie.\n\n**Powszechność** oznacza, że prawo głosu ma każdy dorosły obywatel, bez względu na płeć, majątek, wykształcenie czy pochodzenie. Ograniczenia mogą wynikać jedynie z wieku, ubezwłasnowolnienia lub pozbawienia praw publicznych.\n\n**Równość** ma dwa znaczenia. W sensie formalnym każdy wyborca ma jeden głos. W sensie materialnym każdy głos waży tyle samo, czyli okręgi wyborcze muszą być odpowiednio wyważone pod względem liczby mieszkańców.\n\n**Bezpośredniość** znaczy, że wyborca głosuje osobiście na kandydata, a nie na elektorów, którzy dopiero potem wybraliby władzę za niego.\n\n**Tajność głosowania** gwarantuje, że nikt nie może sprawdzić, jak dana osoba zagłosowała. Uwaga na sformułowanie: tajne jest samo głosowanie, a nie całe wybory.\n\n**Proporcjonalność albo większość** to piąty przymiotnik, zależny od rodzaju wyborów. **Wybory proporcjonalne** oznaczają, że mandaty dzieli się między komitety w proporcji do liczby zdobytych głosów — tak wybiera się Sejm, sejmiki, rady powiatów i większość rad gmin. **Wybory większościowe** oznaczają, że mandat zdobywa ten, kto uzyskał najwięcej głosów — tak wybiera się Senat, Prezydenta oraz wójtów, burmistrzów i prezydentów miast. Dlatego nie należy mówić, że wszystkie wybory w Polsce są proporcjonalne.\n\nOd przymiotników odróżnia się **czynne prawo wyborcze**, czyli prawo do głosowania, oraz **bierne prawo wyborcze**, czyli prawo kandydowania. Progi wieku dla biernego prawa są różne: 18 lat do rady gminy, 21 lat do Sejmu, 25 lat na wójta, 30 lat do Senatu i 35 lat na Prezydenta."},{"id":"rezimy","title":"Reżimy polityczne — demokracja, autorytaryzm, totalitaryzm","text":"**Reżim polityczny** to sposób sprawowania władzy w państwie. Wyróżnia się trzy główne typy.\n\n**Demokracja** opiera się na władzy pochodzącej od obywateli, wolnych i uczciwych wyborach, podziale władz, poszanowaniu praw mniejszości oraz swobodzie mediów i zrzeszania się. Sama większość głosów to za mało — bez ochrony praw jednostki i niezależnych sądów mamy do czynienia z rządami większości, a nie z pełną demokracją.\n\n**Autorytaryzm** to ustrój, w którym władza jest skupiona w rękach jednej osoby lub wąskiej grupy, wybory są pozorne lub ograniczone, a opozycja jest tłumiona. Państwo autorytarne kontroluje politykę, ale zwykle nie próbuje kontrolować całego życia obywateli — pozostawia im swobodę w sprawach prywatnych, religijnych czy gospodarczych, o ile nie zagrażają władzy.\n\n**Totalitaryzm** idzie znacznie dalej: dąży do kontroli nad wszystkimi dziedzinami życia. Cechują go jedna obowiązkowa ideologia, monopol jednej partii, kult wodza, masowy terror i policja polityczna, monopol na informację oraz kontrola gospodarki. Klasyczne przykłady to nazistowskie Niemcy i Związek Radziecki za Stalina.\n\nMówi się także o **demokracji bezpośredniej** i **przedstawicielskiej** (według sposobu podejmowania decyzji) oraz o **demokracji większościowej** i **konsensualnej** (według tego, czy liczy się przewaga większości, czy szukanie porozumienia wszystkich grup)."},{"id":"zagrozenia","title":"Zagrożenia dla demokracji","text":"Demokracja nie jest stanem danym raz na zawsze — może słabnąć i wyradzać się, nawet jeśli formalnie odbywają się wybory. Najczęściej wskazuje się kilka zagrożeń.\n\n**Oligarchizacja** to sytuacja, w której realna władza przechodzi w ręce wąskiej grupy — najbogatszych, wielkich firm lub partyjnych elit — a wpływ zwykłych obywateli staje się pozorny. Robert Michels sformułował nawet **żelazne prawo oligarchii**, według którego każda duża organizacja z czasem zaczyna być rządzona przez niewielką grupę działaczy.\n\n**Korupcja** to wykorzystywanie stanowiska publicznego dla prywatnej korzyści — łapówki, ustawianie przetargów, załatwianie posad znajomym (**nepotyzm** wobec krewnych, **kumoterstwo** wobec znajomych). Podkopuje zaufanie do państwa i sprawia, że decyzje zapadają nie w interesie ogółu, lecz tych, którzy zapłacili.\n\n**Populizm** to sposób uprawiania polityki polegający na przeciwstawianiu 'czystego ludu' 'zepsutym elitom' i obiecywaniu prostych rozwiązań skomplikowanych problemów. Sam w sobie nie jest ustrojem i nie zawsze jest groźny — bywa reakcją na realne zaniedbania. Staje się zagrożeniem wtedy, gdy prowadzi do podważania niezależnych sądów, wolnych mediów i praw mniejszości pod hasłem wykonywania woli narodu.\n\n**Biurokratyzacja** oznacza rozrost aparatu urzędniczego, który zaczyna działać dla siebie, a decyzje przechodzą do rąk osób niepochodzących z wyborów. Podobny zarzut stawia się **technokracji**, czyli oddawaniu rozstrzygnięć ekspertom, wobec których obywatel nie ma żadnego wpływu.\n\nDalsze zagrożenia to **bierność obywateli** i niska frekwencja wyborcza, **dezinformacja** i manipulacja w mediach, **polaryzacja**, czyli podział społeczeństwa na wrogie obozy niezdolne do rozmowy, oraz **ekstremizm** i przemoc polityczna."},{"id":"media","title":"Media i opinia publiczna","text":"**Media** to środki przekazu docierające do szerokiej publiczności — prasa, radio, telewizja, portale internetowe i media społecznościowe. Nazywa się je czasem **czwartą władzą**, bo choć nie rządzą, mają realny wpływ na to, o czym myślimy i jak oceniamy polityków.\n\nMedia pełnią kilka funkcji: informują, kontrolują władzę, tworzą przestrzeń debaty, edukują i dostarczają rozrywki. Kluczowa jest funkcja kontrolna — dziennikarstwo śledcze bywało powodem upadku rządów.\n\n**Opinia publiczna** to przeważające w społeczeństwie poglądy na sprawy istotne dla ogółu. Bada się ją sondażami, których wyniki trzeba czytać ostrożnie: znaczenie ma sposób zadania pytania, wielkość i dobór próby oraz margines błędu.\n\nMedia mogą też zniekształcać obraz świata. **Dezinformacja** to celowe rozpowszechnianie fałszywych treści, by kogoś wprowadzić w błąd — inaczej niż zwykła pomyłka. **Manipulacja** polega na takim dobieraniu i przedstawianiu faktów, by odbiorca wyciągnął z góry zaplanowany wniosek, nawet bez podawania nieprawdy. **Bańka informacyjna** powstaje wtedy, gdy algorytmy pokazują nam głównie treści zgodne z tym, co już myślimy, przez co przestajemy stykać się z odmiennymi poglądami.\n\nObroną przed tym jest **krytyczne podejście do informacji**: sprawdzanie źródła, odróżnianie faktu od opinii, porównywanie kilku niezależnych przekazów i uważność wobec treści, które wzbudzają silne emocje."}],"concepts":[{"term":"Władza polityczna","def":"Zdolność narzucenia swojej woli innym, także wbrew ich sprzeciwowi."},{"term":"Legitymizacja","def":"Uznanie przez ludzi, że władza sprawowana jest przez kogoś, kto ma do tego prawo."},{"term":"Legitymizacja legalna","def":"Uznanie władzy dlatego, że objęto ją zgodnie z prawem; podstawa demokracji."},{"term":"Legitymizacja tradycyjna","def":"Uznanie władzy dlatego, że opiera się na zwyczaju i dziedziczeniu — tak rządzili królowie."},{"term":"Legitymizacja charyzmatyczna","def":"Uznanie władzy ze względu na wyjątkowe cechy przywódcy, w którego ludzie wierzą."},{"term":"Umowa społeczna","def":"Teoria, według której państwo powstało z porozumienia ludzi żyjących wcześniej bez władzy."},{"term":"Teoria teistyczna","def":"Pogląd, że państwo i władza pochodzą od Boga."},{"term":"Teoria podboju","def":"Pogląd, że państwo powstało, gdy silniejsza grupa podbiła słabszą."},{"term":"Ideologia","def":"Spójny zbiór poglądów na to, jak powinno wyglądać społeczeństwo, wraz z drogą do tego celu."},{"term":"Liberalizm","def":"Ideologia stawiająca na pierwszym miejscu wolność jednostki i ograniczoną rolę państwa."},{"term":"Konserwatyzm","def":"Ideologia ceniąca tradycję, religię i rodzinę, nieufna wobec gwałtownych reform."},{"term":"Socjalizm","def":"Ideologia kładąca nacisk na równość i silną rolę państwa w wyrównywaniu nierówności."},{"term":"Chadecja","def":"Chrześcijańska demokracja — nurt łączący obronę tradycyjnych wartości z troską o najsłabszych; odrzuca i nieograniczony rynek, i komunizm."},{"term":"Partia polityczna","def":"Organizacja dążąca do zdobycia władzy, by realizować swój program."},{"term":"Grupa interesu","def":"Organizacja wpływająca na decyzje władzy, ale niedążąca do jej przejęcia."},{"term":"Lobbing","def":"Legalne, jawne działanie na rzecz określonych rozwiązań w polityce."},{"term":"Społeczeństwo obywatelskie","def":"Ogół organizacji obywateli działających niezależnie od państwa."},{"term":"Referendum","def":"Głosowanie powszechne, w którym obywatele odpowiadają na postawione pytanie."},{"term":"Plebiscyt","def":"Głosowanie w sprawie przynależności państwowej danego terytorium."},{"term":"Inicjatywa obywatelska","def":"Prawo grupy obywateli do zgłoszenia projektu ustawy; w Polsce wymaga 100 000 podpisów."},{"term":"Weto ludowe","def":"Prawo obywateli do poddania pod głosowanie i odrzucenia uchwalonej ustawy; w Polsce nie występuje."},{"term":"Przymiotniki wyborcze","def":"Zasady, na jakich odbywają się wybory: powszechność, równość, bezpośredniość, tajność głosowania oraz proporcjonalność albo większość."},{"term":"Czynne prawo wyborcze","def":"Prawo do głosowania."},{"term":"Bierne prawo wyborcze","def":"Prawo do kandydowania."},{"term":"Autorytaryzm","def":"Władza skupiona w rękach jednej osoby lub grupy, kontrolująca politykę, ale nie całe życie obywateli."},{"term":"Totalitaryzm","def":"Ustrój dążący do kontroli nad wszystkimi dziedzinami życia, oparty na terrorze i jednej ideologii."},{"term":"Oligarchizacja","def":"Przejmowanie realnej władzy przez wąską grupę kosztem wpływu zwykłych obywateli."},{"term":"Korupcja","def":"Wykorzystywanie stanowiska publicznego dla prywatnej korzyści."},{"term":"Populizm","def":"Styl polityki przeciwstawiający 'lud' 'elitom' i obiecujący proste rozwiązania złożonych problemów."},{"term":"Opinia publiczna","def":"Przeważające w społeczeństwie poglądy na sprawy istotne dla ogółu."},{"term":"Dezinformacja","def":"Celowe rozpowszechnianie fałszywych treści, by wprowadzić kogoś w błąd."}],"institutions":[{"name":"Państwowa Komisja Wyborcza","subtitle":"stały najwyższy organ wyborczy","rows":[{"k":"Charakter","v":"stały organ właściwy w sprawach wyborów i referendów"},{"k":"Skład","v":"9 członków"},{"k":"Powoływanie","v":"przez Prezydenta, w tym 7 osób wskazanych przez Sejm oraz sędziowie TK i NSA"},{"k":"Główne zadania","v":"nadzór nad przestrzeganiem prawa wyborczego, ustalanie wyników wyborów"},{"k":"Kontrola finansów","v":"przyjmowanie i ocena sprawozdań finansowych partii i komitetów"},{"k":"Sankcje","v":"odrzucenie sprawozdania może oznaczać utratę części subwencji"}]},{"name":"Krajowa Rada Radiofonii i Telewizji","subtitle":"organ ochrony ładu medialnego","rows":[{"k":"Zadanie konstytucyjne","v":"ochrona wolności słowa, prawa do informacji i interesu publicznego w mediach"},{"k":"Skład","v":"5 członków"},{"k":"Powoływanie","v":"2 przez Sejm, 1 przez Senat, 2 przez Prezydenta"},{"k":"Kadencja","v":"6 lat"},{"k":"Kompetencje","v":"koncesje na nadawanie, kontrola nadawców, podział wpływów z abonamentu"},{"k":"Ograniczenie","v":"członek nie może należeć do partii politycznej ani związku zawodowego"}]}],"numbers":[{"label":"Liczba obywateli potrzebna do rejestracji partii","value":"1000"},{"label":"Organ rejestrujący partie","value":"Sąd Okręgowy w Warszawie"},{"label":"Skład PKW","value":"9 członków"},{"label":"Skład KRRiT","value":"5 członków"},{"label":"Kadencja KRRiT","value":"6 lat"},{"label":"Próg subwencji budżetowej dla partii","value":"3% głosów (6% dla koalicji)"},{"label":"Metoda podziału mandatów do Sejmu","value":"D'Hondta"},{"label":"System wyborczy do Senatu","value":"większościowy, okręgi jednomandatowe"}],"acts":[{"act":"Konstytucja RP","article":"Art. 11","text":"1. Rzeczpospolita Polska zapewnia wolność tworzenia i działania partii politycznych. Partie polityczne zrzeszają na zasadach dobrowolności i równości obywateli polskich w celu wpływania metodami demokratycznymi na kształtowanie polityki państwa.\n2. Finansowanie partii politycznych jest jawne.","note":"Zasada pluralizmu politycznego wraz z konstytucyjnym wymogiem jawności finansowania."},{"act":"Konstytucja RP","article":"Art. 13","text":"Zakazane jest istnienie partii politycznych i innych organizacji odwołujących się w swoich programach do totalitarnych metod i praktyk działania nazizmu, faszyzmu i komunizmu, a także tych, których program lub działalność zakłada lub dopuszza nienawiść rasową i narodowościową, stosowanie przemocy w celu zdobycia władzy lub wpływu na politykę państwa albo przewiduje utajnienie struktur lub członkostwa.","note":"Granica pluralizmu — tzw. demokracja broniąca się przed własnymi przeciwnikami."},{"act":"Konstytucja RP","article":"Art. 14","text":"Rzeczpospolita Polska zapewnia wolność prasy i innych środków społecznego przekazu.","note":"Zasada wolności mediów umieszczona wśród zasad ustrojowych rozdziału I."},{"act":"Konstytucja RP","article":"Art. 54 ust. 1","text":"Każdemu zapewnia się wolność wyrażania swoich poglądów oraz pozyskiwania i rozpowszechniania informacji.","note":"Wolność słowa jako prawo człowieka — przysługuje każdemu, nie tylko obywatelom. Podlega ograniczeniom z art. 31 ust. 3."}],"disputes":[{"question":"Czy demokracja przedstawicielska powinna być uzupełniana o więcej instrumentów demokracji bezpośredniej?","sideA":{"label":"Za rozszerzeniem","points":["Referenda i inicjatywy obywatelskie przywracają obywatelom wpływ na decyzje, które ich bezpośrednio dotyczą.","Rosnąca nieufność wobec klasy politycznej wskazuje, że sam mechanizm wyborczy przestał wystarczać.","Decyzje podjęte bezpośrednio przez obywateli mają silniejszą legitymację i trudniej je później zakwestionować."]},"sideB":{"label":"Za prymatem przedstawicielstwa","points":["Złożone kwestie budżetowe czy prawne wymagają wiedzy specjalistycznej i długiej analizy, a pytanie referendalne wymusza uproszczenie do „tak” lub „nie”.","Rozstrzygnięcia większościowe mogą zagrażać prawom mniejszości, których nie chroni sama liczba głosów.","Kampanie referendalne bywają podatne na emocje i dezinformację bardziej niż praca parlamentarna."]}},{"question":"Czy państwo powinno finansować partie polityczne z budżetu?","sideA":{"label":"Za finansowaniem publicznym","points":["Ogranicza uzależnienie partii od prywatnych darczyńców i grup interesu.","Wyrównuje szanse ugrupowań, które nie mają zaplecza finansowego, ale mają społeczne poparcie.","Finansowanie z budżetu jest jawne i podlega kontroli, w przeciwieństwie do trudniejszych do wyśledzenia wpłat prywatnych."]},"sideB":{"label":"Przeciw finansowaniu publicznemu","points":["Utrwala pozycję partii już obecnych w parlamencie i podnosi barierę wejścia dla nowych ruchów.","Osłabia więź partii z członkami i wyborcami, skoro finansowanie nie zależy od składek i wpłat.","Podatnik współfinansuje ugrupowania, których poglądów nie podziela."]}},{"question":"Czy media publiczne są w demokracji potrzebne?","sideA":{"label":"Za istnieniem mediów publicznych","points":["Zapewniają treści nieopłacalne komercyjnie: kulturę, edukację, informację lokalną i programy dla mniejszości.","Nie są uzależnione od reklamodawców, co teoretycznie sprzyja niezależności redakcyjnej.","Stanowią przeciwwagę dla koncentracji własności w mediach komercyjnych."]},"sideB":{"label":"Przeciw lub za ograniczeniem","points":["Podległość finansowa wobec państwa rodzi stałą pokusę wpływu politycznego na przekaz, niezależnie od tego, kto rządzi.","Rynek medialny i internet zapewniają dziś różnorodność treści bez udziału państwa.","Finansowanie z danin publicznych obciąża także tych, którzy z tych mediów nie korzystają."]}}],"cases":[{"situation":"W państwie X prezydent jest wybierany w wyborach powszechnych, samodzielnie kieruje rządem i powołuje sekretarzy departamentów za zgodą izby wyższej. Parlament nie może odwołać prezydenta w drodze wotum nieufności, a jedynie w procedurze o charakterze quasi-sądowym za naruszenie prawa.","question":"Z jakim systemem rządów mamy do czynienia i czym różni się on od polskiego?","answer":"To system prezydencki, w klasycznej postaci znany ze Stanów Zjednoczonych. Kluczowe cechy to połączenie funkcji głowy państwa i szefa rządu w jednej osobie oraz brak politycznej odpowiedzialności egzekutywy przed parlamentem — usunięcie prezydenta możliwe jest wyłącznie w procedurze za naruszenie prawa, nie za prowadzoną politykę. W polskim systemie mieszanym (parlamentarno-prezydenckim) rząd wyłania Sejm i przed nim odpowiada politycznie, a prezydent — choć wybierany powszechnie — nie kieruje pracami rządu."},{"situation":"Partia wygrywa wybory, uzyskując 38% głosów. Zaraz po objęciu władzy zapowiada odwołanie sędziów sądu konstytucyjnego, zmianę zasad przyznawania koncesji telewizyjnych oraz likwidację urzędu rzecznika praw obywatelskich, uzasadniając to tym, że „naród dał nam mandat i to my wykonujemy jego wolę”.","question":"Czy takie działania mieszczą się w standardach demokratycznych?","answer":"Nie. Wygrana w wyborach daje prawo do rządzenia, ale nie do demontażu mechanizmów kontroli władzy. Demokracja to nie tylko wybory, lecz także podział władz, niezależne sądy, wolne media i ochrona praw mniejszości — bez nich mamy rządy większości, a nie pełną demokrację. Powoływanie się na wolę narodu przy jednoczesnym usuwaniu instytucji kontrolnych jest typowym mechanizmem opisywanym jako zagrożenie populistyczne. Dodatkowo 38% głosów nie jest nawet poparciem większości wyborców."},{"situation":"Stowarzyszenie producentów napojów organizuje jawne spotkania z posłami, publikuje ekspertyzy i przekonuje do złagodzenia planowanego podatku cukrowego. Równolegle jeden z przedsiębiorców z branży przekazuje urzędnikowi ministerstwa kopertę z gotówką, licząc na korzystne zapisy w projekcie.","question":"Jak ocenić oba działania?","answer":"Pierwsze to lobbing — działanie legalne, w Polsce uregulowane ustawą. Jego cechy to jawność, argumentacja merytoryczna i brak korzyści majątkowej dla decydenta. Grupy interesu, takie jak to stowarzyszenie, nie dążą do przejęcia władzy, lecz do wpływu na konkretne decyzje. Drugie działanie to korupcja: wykorzystanie stanowiska publicznego dla prywatnej korzyści, przestępstwo zarówno po stronie wręczającego, jak i przyjmującego. Granicę wyznacza więc nie sam cel, lecz jawność i sposób działania."},{"situation":"W wyborach na burmistrza kandydat A zdobył 40% głosów, kandydat B — 35%, a kandydat C — 25%.","question":"Kto zostanie burmistrzem, jeśli obowiązuje zasada większości względnej, a kto — jeśli zasada większości bezwzględnej?","answer":"Przy większości względnej wygrywa od razu kandydat A, bo zdobył najwięcej głosów. Przy większości bezwzględnej trzeba mieć ponad 50% ważnych głosów — nikt jej nie uzyskał, więc odbywa się druga tura między A i B. W Polsce wójtów, burmistrzów i prezydentów miast wybiera się większością bezwzględną."},{"situation":"W okręgu wyborczym do zdobycia jest 5 mandatów. Partia A zdobyła 10 000 głosów, partia B — 6 000, a partia C — 2 800. Wszystkie przekroczyły próg wyborczy.","question":"Ile mandatów otrzyma każda partia według metody d'Hondta?","answer":"Dzielimy wyniki przez 1, 2, 3…: A: 10 000; 5 000; 3 333; B: 6 000; 3 000; C: 2 800; 1 400. Pięć najwyższych ilorazów to: 10 000 (A), 6 000 (B), 5 000 (A), 3 333 (A), 3 000 (B). Wynik: A — 3 mandaty, B — 2, C — 0. Metoda d'Hondta sprzyja dużym ugrupowaniom."},{"situation":"W państwie X rządzi jedna partia, a wódz jest otoczony kultem. Ideologia przenika szkoły, media, sztukę i życie rodzinne, wszyscy muszą należeć do organizacji państwowych, a policja polityczna śledzi nawet prywatne rozmowy. W państwie Y władzę przejął generał: opozycja jest zakazana, media cenzurowane, ale ludzie mogą swobodnie praktykować religię, prowadzić firmy i żyć prywatnie po swojemu, jeśli nie zajmują się polityką.","question":"Jaki reżim panuje w każdym z tych państw?","answer":"Państwo X to reżim totalitarny — władza dąży do kontroli wszystkich dziedzin życia, opiera się na oficjalnej ideologii, masowej mobilizacji, kulcie wodza i terrorze. Państwo Y to reżim autorytarny — ogranicza wolności polityczne, ale nie próbuje kontrolować całego życia prywatnego i gospodarczego obywateli."},{"situation":"W Polsce odbyło się referendum ogólnokrajowe. Wzięło w nim udział 40% uprawnionych, a 70% z nich opowiedziało się „za”.","question":"Czy wynik tego referendum jest wiążący?","answer":"Nie. Wynik referendum ogólnokrajowego jest wiążący tylko wtedy, gdy weźmie w nim udział ponad połowa uprawnionych do głosowania. Przy frekwencji 40% wynik ma znaczenie polityczne i opiniodawcze, ale nie zobowiązuje władz."},{"situation":"Program partii zakłada: niższe podatki, mniej przepisów dla przedsiębiorców, prywatyzację spółek państwowych, ochronę tradycyjnej rodziny, większe nakłady na armię i ograniczenie imigracji.","question":"Gdzie umieścić tę partię na scenie politycznej?","answer":"To partia prawicowa — łączy liberalizm gospodarczy (wolny rynek, niskie podatki, prywatyzacja) z konserwatyzmem światopoglądowym (tradycyjna rodzina, porządek, bezpieczeństwo, ograniczenie imigracji). Taki zestaw nazywa się często liberalnym konserwatyzmem."},{"situation":"W pewnym państwie posłów wybiera się w okręgach jednomandatowych — w każdym wygrywa ten, kto ma najwięcej głosów. Partia A zdobyła w skali kraju 45% głosów, ale ma aż 60% miejsc w parlamencie. Trzecia partia z 15% głosów dostała tylko kilka mandatów.","question":"Dlaczego wynik w mandatach tak bardzo różni się od wyniku w głosach?","answer":"To skutek ordynacji większościowej: w każdym okręgu cały mandat zdobywa zwycięzca, a głosy na pozostałych kandydatów przepadają. System ten nadreprezentuje najsilniejsze partie i osłabia mniejsze — sprzyja powstaniu systemu dwupartyjnego (prawo Duvergera) i stabilnych rządów, ale kosztem proporcjonalności."},{"situation":"W dniu wielkiej demonstracji na portalu społecznościowym pojawia się zdjęcie tłumu z podpisem: „Dzisiaj w Warszawie — milion ludzi!”. Zdjęcie udostępniają tysiące osób. Okazuje się, że fotografia pochodzi sprzed pięciu lat i z innego wydarzenia.","question":"Jak nazwać takie zjawisko i jak uczeń mógł to sprawdzić?","answer":"To dezinformacja (fake news) — wprowadzenie w błąd przez prawdziwe zdjęcie w fałszywym kontekście. Można to sprawdzić przez wyszukiwanie obrazem (np. Google Lens), ustalenie pierwotnego źródła i daty publikacji, porównanie z relacjami wiarygodnych mediów i serwisów fact-checkingowych."}],"quiz":[{"q":"Która legitymizacja władzy opiera się na prawie i jest podstawą demokracji?","options":["tradycyjna","charyzmatyczna","legalna","religijna"],"correct":2,"explain":"Rządzi ten, kto objął władzę zgodnie z obowiązującymi przepisami."},{"q":"Co zakłada teoria umowy społecznej?","options":["władza pochodzi od Boga","państwo powstało z porozumienia ludzi żyjących wcześniej bez władzy","państwo powstało przez podbój","państwo wyrosło z rodziny"],"correct":1,"explain":"To najważniejsza nowożytna koncepcja powstania państwa; różne jej wersje inaczej opisują stan sprzed umowy."},{"q":"Które prawa uznawano w teorii umowy społecznej za naturalne, czyli przysługujące człowiekowi przed powstaniem państwa?","options":["prawo do pracy i nauki","prawo do życia, wolności i własności","prawo do głosowania","prawo do opieki zdrowotnej"],"correct":1,"explain":"Jeśli państwo je łamie, w tym ujęciu traci uzasadnienie swojej władzy."},{"q":"Która teoria wywodzi państwo z podziału na klasy i własności prywatnej?","options":["teistyczna","patriarchalna","marksistowska","ewolucyjna"],"correct":2,"explain":"Według Marksa klasa posiadająca stworzyła państwo jako narzędzie utrzymania przewagi."},{"q":"Która ideologia stawia na pierwszym miejscu wolność jednostki i ograniczoną rolę państwa?","options":["socjalizm","liberalizm","konserwatyzm","nacjonalizm"],"correct":1,"explain":"Liberalizm broni własności prywatnej, swobody gospodarczej i praw obywatelskich."},{"q":"Czym charakteryzuje się chadecja?","options":["Dąży do zniesienia własności prywatnej","Łączy obronę tradycyjnych wartości z troską państwa o najsłabszych","Odrzuca państwo jako instytucję","Opiera się na kulcie wodza"],"correct":1,"explain":"Chrześcijańska demokracja odrzuca zarówno nieograniczony rynek, jak i komunizm."},{"q":"Na czym polega zasada pomocniczości (subsydiarności)?","options":["Państwo przejmuje jak najwięcej zadań","Sprawy załatwia się na najniższym możliwym szczeblu","Decyzje podejmują wyłącznie eksperci","Wszystkie decyzje zapadają w referendum"],"correct":1,"explain":"Państwo wkracza dopiero wtedy, gdy rodzina lub wspólnota lokalna sobie nie radzi."},{"q":"Czym jest plebiscyt?","options":["Głosowaniem nad ustawą","Głosowaniem w sprawie przynależności państwowej terytorium","Wyborem prezydenta","Konsultacją społeczną"],"correct":1,"explain":"Tak rozstrzygano m.in. losy Górnego Śląska po I wojnie światowej."},{"q":"Która forma demokracji bezpośredniej nie występuje w Polsce?","options":["referendum lokalne","inicjatywa obywatelska","weto ludowe","budżet obywatelski"],"correct":2,"explain":"Weto ludowe pozwalałoby obywatelom odrzucić uchwaloną już ustawę."},{"q":"Ile podpisów wymaga w Polsce obywatelska inicjatywa ustawodawcza?","options":["15 000","50 000","100 000","500 000"],"correct":2,"explain":"Sejm musi taki projekt rozpatrzyć, ale nie musi go uchwalić."},{"q":"Który przymiotnik wyborczy oznacza, że każdy głos waży tyle samo?","options":["powszechność","równość","bezpośredniość","tajność"],"correct":1,"explain":"Równość materialna wymaga, by okręgi były wyważone pod względem liczby mieszkańców."},{"q":"Które wybory w Polsce są większościowe, a nie proporcjonalne?","options":["do Sejmu","do Senatu","do sejmiku województwa","do rady powiatu"],"correct":1,"explain":"Większościowo wybiera się Senat, Prezydenta oraz wójtów, burmistrzów i prezydentów miast."},{"q":"Co dokładnie jest tajne w wyborach?","options":["nazwiska kandydatów","wyniki wyborów","samo głosowanie","liczba głosujących"],"correct":2,"explain":"Tajne jest głosowanie — nikt nie może sprawdzić, jak dana osoba zagłosowała."},{"q":"Czym różni się autorytaryzm od totalitaryzmu?","options":["Autorytaryzm kontroluje całe życie obywateli","Totalitaryzm dąży do kontroli wszystkich dziedzin życia, autorytaryzm głównie polityki","Totalitaryzm dopuszcza wolne wybory","Nie różnią się niczym"],"correct":1,"explain":"Autorytaryzm zostawia zwykle swobodę w sprawach prywatnych, o ile nie zagrażają władzy."},{"q":"Na czym polega oligarchizacja?","options":["Na wzroście frekwencji wyborczej","Na przejmowaniu realnej władzy przez wąską grupę","Na rozbudowie samorządu","Na zwiększeniu liczby partii"],"correct":1,"explain":"Wpływ zwykłych obywateli staje się wtedy pozorny mimo formalnych wyborów."},{"q":"Kiedy populizm staje się realnym zagrożeniem dla demokracji?","options":["Zawsze, w każdej postaci","Gdy prowadzi do podważania sądów, wolnych mediów i praw mniejszości","Gdy krytykuje rząd","Gdy zdobywa poparcie w wyborach"],"correct":1,"explain":"Sam populizm bywa reakcją na realne zaniedbania; groźny staje się, gdy uderza w instytucje."},{"q":"Faworyzowanie krewnych przy obsadzaniu stanowisk to:","options":["lobbing","nepotyzm","kumoterstwo","korupcja bierna"],"correct":1,"explain":"Wobec znajomych analogiczne zjawisko nazywa się kumoterstwem."},{"q":"Czym lobbing różni się od korupcji?","options":["Niczym — to synonimy","Lobbing jest jawny i nie wiąże się z korzyścią majątkową dla decydenta","Lobbing jest zakazany","Korupcja jest uregulowana ustawą"],"correct":1,"explain":"Lobbing jest w Polsce legalny i uregulowany ustawą."},{"q":"Czym jest bańka informacyjna?","options":["Celowym kłamstwem w mediach","Sytuacją, w której algorytmy pokazują głównie treści zgodne z naszymi poglądami","Błędem sondażowym","Cenzurą państwową"],"correct":1,"explain":"Przestajemy wtedy stykać się z odmiennymi opiniami."},{"q":"Który system rządów działa w Polsce?","options":["prezydencki","parlamentarno-gabinetowy","półprezydencki","komitetowy"],"correct":1,"explain":"Rząd wyłania Sejm i przed nim odpowiada; prezydent pełni funkcje głównie reprezentacyjne."}]},{"id":"prawo","number":"VI","icon":"Scale","name":"Prawo","blurb":"Źródła i gałęzie prawa, postępowania, prawa człowieka i ich ochrona.","status":"ready","topics":[{"id":"prawo-pojecie","title":"Czym jest prawo i skąd się bierze","text":"**Prawo** to zbiór zasad ustanowionych przez państwo, których trzeba przestrzegać, bo za ich złamanie grozi kara wymierzana przez państwo. Tym różni się od norm moralnych, obyczajowych czy religijnych — te też mówią, jak postępować, ale za ich złamanie nikt nas nie ukarze urzędowo.\n\n**Norma prawna** składa się z trzech części. **Hipoteza** opisuje sytuację, w której zasada ma zastosowanie ('kto prowadzi pojazd...'). **Dyspozycja** mówi, co wtedy należy zrobić albo czego nie wolno ('...powinien zachować ostrożność'). **Sankcja** określa, co grozi za złamanie zasady ('...podlega karze grzywny').\n\nKonstytucja wymienia zamkniętą listę **źródeł prawa powszechnie obowiązującego**, czyli takiego, które wiąże wszystkich: **Konstytucja**, **ustawy**, **ratyfikowane umowy międzynarodowe** oraz **rozporządzenia**. Do tego dochodzą **akty prawa miejscowego**, obowiązujące tylko na terenie działania organu, który je wydał — na przykład uchwały rady gminy."},{"id":"hierarchia","title":"Hierarchia aktów prawnych","text":"Przepisy w Polsce tworzą **hierarchię**, czyli drabinę: akt niższy musi być zgodny z wyższym, a jeśli jest z nim sprzeczny, przestaje obowiązywać albo nie może być stosowany.\n\nNa samym szczycie stoi **Konstytucja** jako najwyższe prawo Rzeczypospolitej. Żadna ustawa ani rozporządzenie nie mogą być z nią sprzeczne, a bada to Trybunał Konstytucyjny.\n\nNiżej znajdują się **umowy międzynarodowe**, ale ich miejsce zależy od sposobu, w jaki zostały przyjęte. Umowa **ratyfikowana za zgodą wyrażoną w ustawie**, czyli za zgodą parlamentu, stoi wyżej niż ustawa — jeśli ustawy nie da się z nią pogodzić, pierwszeństwo ma umowa. Natomiast umowa ratyfikowana przez samego Prezydenta, bez zgody parlamentu, takiego pierwszeństwa nie ma i stoi poniżej ustaw. To rozróżnienie jest często sprawdzane.\n\nDalej idą **ustawy**, uchwalane przez Sejm i Senat. Poniżej **rozporządzenia** — wydają je wskazane w ustawie organy (najczęściej ministrowie) po to, żeby wykonać ustawę w szczegółach. Rozporządzenie nie może wykraczać poza to, na co pozwala mu ustawa. Na końcu drabiny stoją **akty prawa miejscowego**.\n\nOsobne miejsce zajmuje **prawo Unii Europejskiej**. Polska przekazała Unii część swoich kompetencji, dlatego prawo unijne stosuje się bezpośrednio i w razie sprzeczności ma pierwszeństwo przed ustawami."},{"id":"galezie","title":"Gałęzie prawa","text":"Prawo dzieli się na wielkie działy zwane **gałęziami**. Najważniejszy podział to prawo publiczne i prywatne.\n\n**Prawo publiczne** reguluje sytuacje, w których państwo występuje z pozycji silniejszego — może coś nakazać, zakazać lub ukarać. Należą tu: **prawo konstytucyjne** (ustrój państwa), **prawo administracyjne** (urzędy i ich kontakty z obywatelem), **prawo karne** (przestępstwa i kary) oraz **prawo finansowe i podatkowe**.\n\n**Prawo prywatne** reguluje sprawy między równymi sobie stronami — nikt nikomu nic nie narzuca, a spór rozstrzyga sąd. Podstawą jest **prawo cywilne**, obejmujące własność, umowy, odszkodowania, spadki i sprawy rodzinne. Osobno wyróżnia się **prawo handlowe**, dotyczące spółek i działalności gospodarczej.\n\n**Prawo pracy** stoi na pograniczu obu grup: opiera się na umowie między pracownikiem a pracodawcą, ale zawiera też przepisy chroniące pracownika, których nie wolno zmienić na jego niekorzyść nawet za jego zgodą.\n\nInny ważny podział to **prawo materialne**, które mówi, jakie mamy prawa i obowiązki, oraz **prawo formalne (procesowe)**, które mówi, w jaki sposób ich dochodzić przed sądem lub urzędem."},{"id":"prawo-karne","title":"Prawo karne i proces karny","text":"**Prawo karne** określa, jakie czyny są przestępstwami i jakie kary za nie grożą. Rządzi nim zasada **nullum crimen sine lege** — nie ma przestępstwa bez ustawy. Znaczy to, że karać można tylko za czyn, który był zakazany przez ustawę już w chwili popełnienia. Nie wolno wprowadzić przepisu i karać za coś, co wcześniej było legalne.\n\nPrzestępstwa dzielą się na **zbrodnie** — zagrożone karą pozbawienia wolności co najmniej 3 lat lub surowszą — oraz **występki**, czyli wszystkie pozostałe. Kodeks karny przewiduje kary: **grzywnę**, **ograniczenie wolności** i **pozbawienie wolności**.\n\nOdpowiedzialność karną ponosi się w Polsce co do zasady od **17. roku życia**. Przy najcięższych przestępstwach ustawa dopuszcza jednak odpowiedzialność już od **15 lat**. Wobec młodszych stosuje się środki wychowawcze i poprawcze, nie kary.\n\nProces karny opiera się na kilku zasadach. Najważniejsza to **domniemanie niewinności**: oskarżonego uważa się za niewinnego, dopóki sąd prawomocnie nie skaże go wyrokiem. To **oskarżyciel musi udowodnić winę**, a nie oskarżony swoją niewinność — jeśli wątpliwości pozostaną, sąd nie może skazać. Dochodzą do tego **prawo do obrony** (w tym prawo do adwokata i do milczenia), **prawo do sądu** oraz **dwuinstancyjność**, czyli możliwość odwołania się do wyższego sądu.\n\nStronami procesu są **oskarżyciel** — najczęściej prokurator — oraz **oskarżony** wraz z obrońcą. Pokrzywdzony może wystąpić jako **oskarżyciel posiłkowy**."},{"id":"prawo-cywilne","title":"Prawo cywilne i proces cywilny","text":"**Prawo cywilne** reguluje sprawy między równymi sobie stronami — między ludźmi, firmami, a czasem także z udziałem państwa występującego jak zwykły uczestnik obrotu.\n\nDwa kluczowe pojęcia dotyczą tego, co człowiek może zrobić w świetle prawa. **Zdolność prawna** to możliwość posiadania praw i obowiązków — ma ją każdy człowiek od chwili urodzenia aż do śmierci, także noworodek, który może na przykład odziedziczyć majątek. **Zdolność do czynności prawnych** to możliwość samodzielnego zawierania umów. Jest **pełna od 18. roku życia**, **ograniczona między 13. a 18. rokiem życia** oraz przy ubezwłasnowolnieniu częściowym, a osoby poniżej 13 lat i ubezwłasnowolnione całkowicie **nie mają jej wcale**. Osoba z ograniczoną zdolnością może samodzielnie zawierać tylko drobne umowy życia codziennego, jak zakupy w sklepie.\n\nNajważniejszym źródłem zobowiązań jest **umowa**. Odpowiedzialność za szkodę może wynikać z niewykonania umowy albo z **czynu niedozwolonego** — czyli wyrządzenia komuś szkody niezależnie od jakiejkolwiek umowy, na przykład stłuczki na drodze.\n\nProces cywilny zaczyna się od **pozwu**, który **powód** wnosi przeciwko **pozwanemu**. To strony przedstawiają dowody, a sąd rozstrzyga spór — udowodnić coś musi ten, kto się na to powołuje. Postępowanie jest dwuinstancyjne, a w niektórych sprawach od prawomocnego wyroku można wnieść **skargę kasacyjną** do Sądu Najwyższego."},{"id":"prawo-administracyjne","title":"Prawo administracyjne i załatwianie spraw w urzędzie","text":"**Prawo administracyjne** reguluje działanie urzędów i ich kontakty z obywatelem. Obowiązuje tu ważna różnica: **obywatelowi wolno wszystko, czego prawo nie zakazuje, a urzędowi tylko to, na co prawo wyraźnie mu zezwala**. Urząd nie może więc działać z własnej inicjatywy tam, gdzie nie ma podstawy w przepisach.\n\nPodstawową formą działania urzędu jest **decyzja administracyjna** — rozstrzygnięcie o prawach lub obowiązkach konkretnej osoby w konkretnej sprawie, na przykład pozwolenie na budowę albo odmowa przyznania świadczenia.\n\nJeśli nie zgadzamy się z decyzją, przysługuje **odwołanie do organu wyższego stopnia**. Składa się je **w terminie 14 dni**, za pośrednictwem tego urzędu, który wydał decyzję. Dopiero po wyczerpaniu tej drogi można wnieść **skargę do wojewódzkiego sądu administracyjnego**, a następnie **skargę kasacyjną do Naczelnego Sądu Administracyjnego**.\n\nWarto zapamiętać jedno ograniczenie: sąd administracyjny bada wyłącznie **legalność**, czyli zgodność decyzji z prawem. Nie rozstrzyga za urząd, czy decyzja była słuszna lub rozsądna — może ją uchylić, ale sprawę załatwia ponownie urząd."},{"id":"prawa-czlowieka","title":"Prawa człowieka — cechy i generacje","text":"**Prawa człowieka** przysługują każdemu z samego faktu bycia człowiekiem. Mają kilka cech: są **przyrodzone** (państwo ich nie nadaje, tylko uznaje), **niezbywalne** (nie można się ich zrzec ani ich komuś sprzedać), **powszechne** (przysługują wszystkim) i **nienaruszalne**. Ich źródłem jest **godność człowieka**.\n\nDzieli się je na trzy **generacje**, czyli grupy, które pojawiały się kolejno w historii.\n\n**Pierwsza generacja** to prawa osobiste i polityczne: prawo do życia, wolność osobista, sprawiedliwy proces, wolność słowa i wyznania, prawo do głosowania. Od państwa wymagają głównie tego, żeby się nie wtrącało.\n\n**Druga generacja** to prawa gospodarcze, socjalne i kulturalne: prawo do pracy, nauki, ochrony zdrowia, zabezpieczenia społecznego. Tu jest odwrotnie — państwo musi coś zapewnić i wydać na to pieniądze, dlatego zakres ich realizacji zależy od zamożności kraju.\n\n**Trzecia generacja** to prawa solidarnościowe, przysługujące całym zbiorowościom: prawo do pokoju, do rozwoju, do czystego środowiska.\n\nPrawa nie są nieograniczone. Konstytucja pozwala je ograniczać, ale tylko przy spełnieniu warunków: ograniczenie musi być zapisane **w ustawie**, musi być **konieczne** ze względu na bezpieczeństwo, porządek publiczny, środowisko, zdrowie, moralność publiczną albo prawa innych osób, i **nie może naruszać istoty prawa**. Nieliczne prawa, jak zakaz tortur, obowiązują bezwzględnie i nie wolno ich ograniczyć nigdy."},{"id":"ochrona-praw","title":"Gdzie szukać ochrony swoich praw","text":"W Polsce praw broni przede wszystkim **niezawisły sąd**. Poza zwykłą drogą sądową istnieją jednak środki szczególne.\n\n**Skarga konstytucyjna** trafia do Trybunału Konstytucyjnego. Można ją wnieść dopiero po wyczerpaniu drogi prawnej i — co kluczowe — nie służy podważeniu samego wyroku, lecz zakwestionowaniu **przepisu**, na podstawie którego naruszono nasze konstytucyjne prawa.\n\n**Wniosek do Rzecznika Praw Obywatelskich** może złożyć każdy i jest bezpłatny. Rzecznik nie rozstrzyga spraw jak sąd, ale może żądać wyjaśnień, przystępować do postępowań i kierować wnioski do Trybunału Konstytucyjnego. Działają też rzecznicy wyspecjalizowani: **Rzecznik Praw Dziecka** i **Rzecznik Praw Pacjenta**.\n\nNa poziomie europejskim najważniejszy jest **Europejski Trybunał Praw Człowieka w Strasburgu**, działający w ramach **Rady Europy** na podstawie **Europejskiej Konwencji Praw Człowieka**. Skargę indywidualną może złożyć każdy człowiek po wyczerpaniu krajowych środków odwoławczych. Uwaga: to instytucja Rady Europy, a **nie** Unii Europejskiej — mylenie jej z Trybunałem Sprawiedliwości UE w Luksemburgu to częsty błąd.\n\nNa poziomie światowym prawa człowieka chroni system **ONZ**: Powszechna Deklaracja Praw Człowieka z 1948 r. oraz oparte na niej pakty praw człowieka z 1966 r., a także wyspecjalizowane komitety przyjmujące skargi."}],"concepts":[{"term":"Norma prawna","def":"Reguła zachowania złożona z hipotezy, dyspozycji i sankcji, zabezpieczona przymusem państwowym."},{"term":"Prawo powszechnie obowiązujące","def":"Prawo wiążące wszystkich: Konstytucja, ustawy, ratyfikowane umowy, rozporządzenia, akty prawa miejscowego."},{"term":"Prawo materialne","def":"Przepisy określające prawa i obowiązki podmiotów."},{"term":"Prawo formalne","def":"Przepisy określające tryb dochodzenia i egzekwowania praw."},{"term":"Nullum crimen sine lege","def":"Zasada: nie ma przestępstwa bez ustawy obowiązującej w chwili czynu."},{"term":"Domniemanie niewinności","def":"Oskarżonego uważa się za niewinnego, dopóki wina nie zostanie stwierdzona prawomocnym wyrokiem."},{"term":"Zbrodnia","def":"Przestępstwo zagrożone k
