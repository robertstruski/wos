arą pozbawienia wolności co najmniej 3 lat lub surowszą."},{"term":"Występek","def":"Przestępstwo lżejsze niż zbrodnia, zagrożone niższą karą."},{"term":"Zdolność prawna","def":"Możność bycia podmiotem praw i obowiązków — przysługuje każdemu człowiekowi od urodzenia."},{"term":"Zdolność do czynności prawnych","def":"Możność samodzielnego kształtowania swojej sytuacji prawnej — pełna od 18 lat."},{"term":"Decyzja administracyjna","def":"Jednostronne rozstrzygnięcie organu o prawach lub obowiązkach konkretnego adresata."},{"term":"Skarga konstytucyjna","def":"Środek kwestionujący przed TK przepis, na podstawie którego naruszono konstytucyjne prawa skarżącego."},{"term":"Generacje praw człowieka","def":"Podział na prawa osobiste i polityczne, socjalne oraz solidarnościowe."}],"institutions":[{"name":"Sąd Najwyższy","subtitle":"najwyższy organ władzy sądowniczej w sprawach sądów powszechnych i wojskowych","rows":[{"k":"Zadania","v":"nadzór judykacyjny, rozpoznawanie kasacji, uchwały wyjaśniające przepisy"},{"k":"Kompetencja szczególna","v":"stwierdzanie ważności wyborów i referendów"},{"k":"Pierwszy Prezes","v":"powoływany przez Prezydenta spośród kandydatów przedstawionych przez Zgromadzenie Ogólne SN"},{"k":"Kadencja I Prezesa","v":"6 lat"},{"k":"Funkcja dodatkowa","v":"przewodniczy Trybunałowi Stanu z urzędu"}]},{"name":"Naczelny Sąd Administracyjny","subtitle":"sądownictwo administracyjne — instancja druga","rows":[{"k":"Zadanie","v":"kontrola legalności działania administracji publicznej"},{"k":"Struktura","v":"wojewódzkie sądy administracyjne oraz NSA"},{"k":"Środek","v":"skarga kasacyjna od wyroku WSA"},{"k":"Zakres badania","v":"wyłącznie zgodność z prawem, nie celowość rozstrzygnięcia"},{"k":"Skutek","v":"uchylenie decyzji i przekazanie sprawy organowi, a nie rozstrzygnięcie jej za organ"}]},{"name":"Europejski Trybunał Praw Człowieka","subtitle":"Strasburg — organ Rady Europy, nie Unii Europejskiej","rows":[{"k":"Podstawa działania","v":"Europejska Konwencja Praw Człowieka"},{"k":"Kto może skarżyć","v":"każda osoba, organizacja lub grupa, także nieobywatele"},{"k":"Warunek dopuszczalności","v":"wyczerpanie krajowych środków odwoławczych"},{"k":"Termin skargi","v":"co do zasady 4 miesiące od ostatecznego rozstrzygnięcia"},{"k":"Skutek wyroku","v":"stwierdzenie naruszenia i zadośćuczynienie; nie uchyla wyroku krajowego"}]},{"name":"Międzynarodowy Trybunał Karny","subtitle":"Haga — odpowiedzialność indywidualna","rows":[{"k":"Podstawa","v":"Statut rzymski z 1998 r."},{"k":"Zakres","v":"ludobójstwo, zbrodnie przeciw ludzkości, zbrodnie wojenne, zbrodnia agresji"},{"k":"Kogo sądzi","v":"osoby fizyczne, nie państwa"},{"k":"Zasada","v":"komplementarność — działa, gdy państwo nie chce lub nie może osądzić sprawcy"},{"k":"Nie mylić z","v":"Międzynarodowym Trybunałem Sprawiedliwości, który rozstrzyga spory między państwami"}]}],"numbers":[{"label":"Wiek odpowiedzialności karnej (zasada)","value":"17 lat"},{"label":"Wiek odpowiedzialności karnej (najcięższe czyny)","value":"od 15 lat"},{"label":"Pełna zdolność do czynności prawnych","value":"18 lat"},{"label":"Ograniczona zdolność do czynności prawnych","value":"13–18 lat"},{"label":"Brak zdolności do czynności prawnych","value":"poniżej 13 lat"},{"label":"Zbrodnia — dolna granica zagrożenia","value":"3 lata pozbawienia wolności"},{"label":"Termin odwołania od decyzji administracyjnej","value":"14 dni"},{"label":"Termin skargi do ETPC","value":"4 miesiące"},{"label":"Powszechna Deklaracja Praw Człowieka","value":"1948 r."},{"label":"Międzynarodowe Pakty Praw","value":"1966 r."},{"label":"Konwencja o prawach dziecka","value":"1989 r."},{"label":"Statut rzymski (MTK)","value":"1998 r."},{"label":"Liczba instancji w postępowaniu sądowym","value":"co najmniej dwie"}],"acts":[{"act":"Konstytucja RP","article":"Art. 31 ust. 3","text":"Ograniczenia w zakresie korzystania z konstytucyjnych wolności i praw mogą być ustanawiane tylko w ustawie i tylko wtedy, gdy są konieczne w demokratycznym państwie dla jego bezpieczeństwa lub porządku publicznego, bądź dla ochrony środowiska, zdrowia i moralności publicznej, albo wolności i praw innych osób. Ograniczenia te nie mogą naruszać istoty wolności i praw.","note":"Klauzula limitacyjna — najważniejszy przepis o granicach ograniczania praw. Trzy warunki: forma ustawy, konieczność, zakaz naruszenia istoty prawa."},{"act":"Konstytucja RP","article":"Art. 42 ust. 1 i 3","text":"1. Odpowiedzialności karnej podlega ten tylko, kto dopuścił się czynu zabronionego pod groźbą kary przez ustawę obowiązującą w czasie jego popełnienia.\n3. Każdego uważa się za niewinnego, dopóki jego wina nie zostanie stwierdzona prawomocnym wyrokiem sądu.","note":"Zasada nullum crimen sine lege oraz domniemanie niewinności — dwa filary prawa karnego."},{"act":"Konstytucja RP","article":"Art. 45 ust. 1","text":"Każdy ma prawo do sprawiedliwego i jawnego rozpatrzenia sprawy bez nieuzasadnionej zwłoki przez właściwy, niezależny, bezstronny i niezawisły sąd.","note":"Prawo do sądu przysługuje każdemu — nie tylko obywatelom polskim."},{"act":"Konstytucja RP","article":"Art. 78","text":"Każda ze stron ma prawo do zaskarżenia orzeczeń i decyzji wydanych w pierwszej instancji. Wyjątki od tej zasady oraz tryb zaskarżania określa ustawa.","note":"Zasada dwuinstancyjności, rozwinięta w art. 176 ust. 1 dla postępowania sądowego."},{"act":"Konstytucja RP","article":"Art. 79 ust. 1","text":"Każdy, czyje konstytucyjne wolności lub prawa zostały naruszone, ma prawo, na zasadach określonych w ustawie, wnieść skargę do Trybunału Konstytucyjnego w sprawie zgodności z Konstytucją ustawy lub innego aktu normatywnego, na podstawie którego sąd lub organ administracji publicznej orzekł ostatecznie o jego wolnościach lub prawach albo o jego obowiązkach określonych w Konstytucji.","note":"Skarga dotyczy przepisu, na podstawie którego orzeczono — nie samego wyroku. Wymaga ostatecznego rozstrzygnięcia."},{"act":"Konstytucja RP","article":"Art. 178 ust. 1","text":"Sędziowie w sprawowaniu swojego urzędu są niezawiśli i podlegają tylko Konstytucji oraz ustawom.","note":"Niezawisłość sędziowska — dotyczy sędziego; niezależność (art. 173) dotyczy sądów jako władzy."},{"act":"Konstytucja RP","article":"Art. 7","text":"Organy władzy publicznej działają na podstawie i w granicach prawa.","note":"Zasada legalizmu: organ może tylko to, na co prawo mu zezwala — odwrotnie niż obywatel."}],"disputes":[{"question":"Czy prawa socjalne (druga generacja) powinny być egzekwowalne przed sądem tak jak prawa osobiste?","sideA":{"label":"Za pełną egzekwowalnością","points":["Bez dostępu do ochrony zdrowia czy edukacji wolności osobiste pozostają dla wielu ludzi teoretyczne.","Skoro Konstytucja je gwarantuje, brak drogi sądowej czyni z nich puste deklaracje.","Sądy potrafią orzekać o minimalnym standardzie świadczeń, nie zastępując przy tym ustawodawcy w całości."]},"sideB":{"label":"Za ograniczoną egzekwowalnością","points":["Realizacja praw socjalnych wymaga wydatków, a o podziale środków publicznych powinien decydować parlament pochodzący z wyborów.","Sąd orzekający o poziomie świadczeń przejmowałby faktycznie kompetencje budżetowe władzy ustawodawczej.","Zakres tych praw zależy od możliwości gospodarki, więc z natury podlega stopniowej realizacji, a nie natychmiastowemu wyegzekwowaniu."]}},{"question":"Czy kara pozbawienia wolności powinna pełnić głównie funkcję odstraszającą, czy resocjalizacyjną?","sideA":{"label":"Za funkcją odstraszającą i sprawiedliwościową","points":["Kara ma odpowiadać wadze czynu — jest należnością wobec ofiary i społeczeństwa, nie tylko narzędziem naprawy sprawcy.","Surowość i nieuchronność kary zniechęcają potencjalnych sprawców.","Izolacja najgroźniejszych przestępców chroni obywateli niezależnie od szans na ich poprawę."]},"sideB":{"label":"Za funkcją resocjalizacyjną","points":["Badania nad recydywą wskazują, że sama długość kary słabo przekłada się na ograniczenie powrotu do przestępstwa.","Więzienie bez pracy, nauki i wsparcia po wyjściu utrwala wykluczenie i zwiększa ryzyko kolejnych czynów.","Kary wolnościowe bywają skuteczniejsze i tańsze przy czynach o mniejszej wadze."]}}],"cases":[{"situation":"Piętnastolatek kupuje w sklepie internetowym konsolę za 2500 zł ze środków, które dostał w prezencie. Rodzice dowiadują się o transakcji po fakcie i nie zgadzają się na nią.","question":"Czy umowa jest ważna?","answer":"Umowa jest dotknięta bezskutecznością zawieszoną. Piętnastolatek ma ograniczoną zdolność do czynności prawnych (13–18 lat), więc do ważności umowy przekraczającej drobne bieżące sprawy życia codziennego potrzebna jest zgoda przedstawiciela ustawowego. Zgoda może być udzielona także po zawarciu umowy — wtedy staje się ona ważna od początku. Skoro rodzice odmawiają potwierdzenia, umowa jest nieważna, a strony zwracają sobie to, co świadczyły. Gdyby zakup dotyczył drobnej rzeczy codziennego użytku, byłby ważny bez zgody."},{"situation":"Kierowca zostaje zatrzymany. Prokurator dysponuje jednym niepewnym zeznaniem świadka i nagraniem złej jakości, z którego nie da się jednoznacznie odczytać tablic rejestracyjnych. Sąd po przeprowadzeniu dowodów nie jest w stanie usunąć wątpliwości.","question":"Jak sąd powinien rozstrzygnąć i na jakiej podstawie?","answer":"Sąd powinien uniewinnić oskarżonego. Obowiązuje domniemanie niewinności — to oskarżyciel musi udowodnić winę, a nie oskarżony swoją niewinność. Jeśli po przeprowadzeniu wszystkich dowodów wątpliwości pozostają, sąd nie może skazać, bo skazanie wymaga pewności co do winy. Ważne zastrzeżenie: dotyczy to wątpliwości, które zostały po wyczerpaniu możliwości dowodowych — sąd nie może się na nie powołać, jeśli po prostu nie przeprowadził rzetelnie postępowania."},{"situation":"12-letni Kuba kupuje w sklepiku szkolnym drożdżówkę i sok za swoje kieszonkowe.","question":"Czy ta umowa sprzedaży jest ważna, skoro Kuba nie ma zdolności do czynności prawnych?","answer":"Tak. Osoba poniżej 13 lat nie ma zdolności do czynności prawnych, ale kodeks cywilny pozwala jej zawierać umowy powszechnie zawierane w drobnych, bieżących sprawach życia codziennego. Są one ważne z chwilą wykonania, chyba że prowadzą do rażącego pokrzywdzenia dziecka."},{"situation":"17-letni Patryk ukradł koledze telefon. Jego 14-letni wspólnik pilnował, czy nikt nie idzie.","question":"Czy obaj odpowiedzą przed sądem karnym jak dorośli?","answer":"Nie. Odpowiedzialność karną według kodeksu karnego ponosi co do zasady osoba, która ukończyła 17 lat — Patryk odpowie więc jak dorosły. 14-latek jest nieletni: jego sprawą zajmie się sąd rodzinny, który może zastosować środki wychowawcze lub poprawcze."},{"situation":"Pani Anna kupiła przez internet buty. Pasują, ale po tygodniu stwierdza, że jednak jej się nie podobają, i chce je zwrócić. Sklep odmawia: „Towar jest pełnowartościowy, nie przyjmujemy zwrotów”.","question":"Czy sklep ma rację?","answer":"Nie. Konsument może odstąpić od umowy zawartej przez internet (na odległość) w ciągu 14 dni bez podawania przyczyny. Sklep musi zwrócić pieniądze, a pani Anna — odesłać buty. Prawo to nie przysługuje przy zakupach w sklepie stacjonarnym, chyba że sklep sam je przyznaje."},{"situation":"Pan Piotr kupił w sklepie stacjonarnym telefon. Po trzech miesiącach telefon przestaje się ładować, choć pan Piotr używał go normalnie. Sprzedawca odsyła go do producenta: „Proszę iść na gwarancję”.","question":"Jakie prawa ma pan Piotr?","answer":"Może złożyć reklamację bezpośrednio u sprzedawcy z tytułu niezgodności towaru z umową — sprzedawca odpowiada za wady przez 2 lata od wydania towaru i nie może odsyłać klienta do producenta. Pan Piotr może żądać naprawy lub wymiany, a jeśli to niemożliwe — obniżenia ceny lub zwrotu pieniędzy. Gwarancja producenta jest dodatkową, dobrowolną możliwością."},{"situation":"Sąsiad z góry zostawił odkręcony kran i zalał mieszkanie pana Jana. Remont kosztuje 15 000 zł, a sąsiad odmawia zapłaty.","question":"Jaka to sprawa i jak pan Jan może dochodzić pieniędzy?","answer":"To sprawa cywilna — spór między dwiema osobami o odszkodowanie. Pan Jan (powód) może złożyć pozew przeciwko sąsiadowi (pozwanemu) do sądu rejonowego. Wcześniej warto spróbować wezwania do zapłaty, mediacji albo sprawdzić, czy sąsiad ma ubezpieczenie OC w życiu prywatnym."},{"situation":"1 stycznia weszła w życie ustawa podwyższająca karę za pewne przestępstwo. Sąd w lutym sądzi sprawcę, który popełnił je w grudniu, i chce zastosować nową, surowszą karę.","question":"Czy sąd może to zrobić?","answer":"Nie. Obowiązuje zasada, że prawo nie działa wstecz (lex retro non agit). Jeśli przepisy zmieniły się między popełnieniem czynu a wyrokiem, stosuje się ustawę względniejszą dla sprawcy — tutaj starą, łagodniejszą."},{"situation":"Minister wydał rozporządzenie, którego jeden przepis jest sprzeczny z ustawą. Urzędnik nie wie, który akt stosować.","question":"Który akt ma pierwszeństwo i dlaczego?","answer":"Pierwszeństwo ma ustawa. W hierarchii źródeł prawa rozporządzenie stoi niżej od ustawy: jest wydawane na podstawie szczegółowego upoważnienia ustawowego i w celu jej wykonania. Niezgodność rozporządzenia z ustawą może stwierdzić Trybunał Konstytucyjny."},{"situation":"Firma zatrudnia pana Adama na umowę zlecenie. Pan Adam musi przychodzić codziennie od 8 do 16, wykonywać polecenia kierownika i nie może wysłać nikogo w zastępstwie. Nie ma płatnego urlopu.","question":"Jaka umowa powinna łączyć pana Adama z firmą?","answer":"Umowa o pracę. Jeśli praca jest wykonywana pod kierownictwem pracodawcy, w miejscu i czasie przez niego wyznaczonych, to w świetle Kodeksu pracy jest to stosunek pracy, niezależnie od nazwy umowy. Pan Adam może zwrócić się do Państwowej Inspekcji Pracy lub wnieść pozew do sądu pracy o ustalenie istnienia stosunku pracy — wtedy przysługuje mu m.in. płatny urlop."}],"quiz":[{"q":"Z jakich elementów składa się norma prawna?","options":["wstępu, treści, zakończenia","hipotezy, dyspozycji, sankcji","artykułu, paragrafu, ustępu","nakazu i zakazu"],"correct":1,"explain":"Hipoteza opisuje sytuację, dyspozycja — nakazane zachowanie, sankcja — skutek naruszenia."},{"q":"Która umowa międzynarodowa ma pierwszeństwo przed ustawą?","options":["każda podpisana","ratyfikowana za uprzednią zgodą wyrażoną w ustawie","ratyfikowana samodzielnie przez Prezydenta","zawarta przez ministra"],"correct":1,"explain":"Umowa ratyfikowana bez zgody parlamentu plasuje się poniżej ustaw."},{"q":"Co oznacza zasada nullum crimen sine lege?","options":["Nie ma kary bez wyroku","Nie ma przestępstwa bez ustawy obowiązującej w chwili czynu","Nie ma procesu bez oskarżyciela","Nie ma winy bez zamiaru"],"correct":1,"explain":"Zakazuje karania na podstawie prawa wprowadzonego po popełnieniu czynu."},{"q":"Od którego roku życia przysługuje pełna zdolność do czynności prawnych?","options":["13 lat","16 lat","17 lat","18 lat"],"correct":3,"explain":"Między 13. a 18. rokiem życia zdolność jest ograniczona; poniżej 13 lat — wyłączona."},{"q":"Zbrodnia to przestępstwo zagrożone karą pozbawienia wolności:","options":["co najmniej roku","co najmniej 3 lat","co najmniej 5 lat","dożywocia"],"correct":1,"explain":"Zbrodnia — od 3 lat wzwyż; poniżej tego progu mamy występek."},{"q":"Kto ponosi ciężar dowodu w procesie karnym?","options":["oskarżony","oskarżyciel","sąd","świadek"],"correct":1,"explain":"Domniemanie niewinności przenosi ciężar dowodu na oskarżyciela."},{"q":"Ile dni wynosi zwykły termin odwołania od decyzji administracyjnej?","options":["7","14","21","30"],"correct":1,"explain":"Odwołanie wnosi się w terminie 14 dni za pośrednictwem organu, który wydał decyzję."},{"q":"Co bada sąd administracyjny?","options":["celowość decyzji","wyłącznie legalność decyzji","sytuację majątkową strony","zgodność z interesem publicznym"],"correct":1,"explain":"Sąd administracyjny kontroluje zgodność z prawem, nie ocenia trafności rozstrzygnięcia."},{"q":"Do której generacji należy prawo do nauki i ochrony zdrowia?","options":["pierwszej","drugiej","trzeciej","czwartej"],"correct":1,"explain":"To prawa socjalne i gospodarcze — druga generacja, wymagająca aktywnych świadczeń państwa."},{"q":"Kiedy można ograniczyć konstytucyjne wolności i prawa?","options":["Rozporządzeniem, gdy wymaga tego interes państwa","Tylko w ustawie, gdy jest to konieczne i bez naruszenia istoty prawa","Decyzją administracyjną","Nigdy"],"correct":1,"explain":"Art. 31 ust. 3 wymaga formy ustawy, konieczności oraz zachowania istoty prawa."},{"q":"Europejski Trybunał Praw Człowieka działa w ramach:","options":["Unii Europejskiej","Rady Europy","ONZ","OBWE"],"correct":1,"explain":"ETPC to organ Rady Europy — organizacji odrębnej od Unii Europejskiej."},{"q":"Kogo sądzi Międzynarodowy Trybunał Karny?","options":["państwa","osoby fizyczne","organizacje międzynarodowe","korporacje"],"correct":1,"explain":"MTK orzeka o odpowiedzialności indywidualnej; spory między państwami rozstrzyga MTS."},{"q":"Powszechna Deklaracja Praw Człowieka została przyjęta w roku:","options":["1945","1948","1950","1966"],"correct":1,"explain":"Deklarację przyjęto w 1948 r.; nie jest umową międzynarodową, lecz deklaracją."},{"q":"Zasada legalizmu z art. 7 Konstytucji oznacza, że organ władzy:","options":["może wszystko, czego prawo nie zakazuje","działa na podstawie i w granicach prawa","podlega tylko Konstytucji","decyduje według uznania"],"correct":1,"explain":"Odwrotnie niż obywatel: organ może tylko to, na co prawo wyraźnie zezwala."}]},{"id":"ue","number":"VII","icon":"Star","name":"Unia Europejska","blurb":"Integracja europejska, instytucje UE, prawo unijne, Polska w Unii.","status":"ready","topics":[{"id":"integracja-historia","title":"Jak powstała Unia Europejska","text":"Integracja europejska zaczęła się po **II wojnie światowej** z prostego powodu: chciano uniemożliwić kolejną wojnę między Francją a Niemcami. Pomysł polegał na tym, by powiązać gospodarki tych krajów tak ściśle, aby wojna stała się nieopłacalna i technicznie trudna.\n\nPierwszym krokiem była **Europejska Wspólnota Węgla i Stali** (1951 r.), obejmująca sześć państw: Francję, RFN, Włochy i kraje Beneluksu. Objęto wspólnym zarządem węgiel i stal — surowce, z których produkowano broń.\n\n**Traktaty rzymskie** (1957 r.) powołały **Europejską Wspólnotę Gospodarczą** i wspólnotę energii atomowej. Celem był **wspólny rynek** — swobodny przepływ towarów, usług, ludzi i kapitału.\n\n**Traktat z Maastricht** (1992 r., wszedł w życie w 1993 r.) powołał **Unię Europejską** i zapoczątkował wspólną walutę. **Traktat z Lizbony** (2007 r., obowiązuje od 2009 r.) uporządkował instytucje, nadał moc prawną Karcie praw podstawowych i wprowadził **art. 50** — procedurę wystąpienia z Unii, z której jako pierwsza skorzystała **Wielka Brytania** (brexit).\n\nUnia rozszerzała się stopniowo. Największe rozszerzenie nastąpiło **1 maja 2004 r.**, gdy przystąpiło dziesięć państw, w tym **Polska**."},{"id":"instytucje-ue","title":"Instytucje Unii Europejskiej","text":"Instytucje unijne łatwo pomylić, bo mają podobne nazwy. Warto je rozróżniać dokładnie.\n\n**Parlament Europejski** to jedyna instytucja wybierana **bezpośrednio przez obywateli**, co pięć lat. Liczy **720 posłów**, z czego Polska ma **53**. Wspólnie z Radą uchwala prawo i budżet, zatwierdza skład Komisji i może ją odwołać. Posłowie zasiadają według **grup politycznych**, a nie według państw.\n\n**Komisja Europejska** to organ wykonawczy, po jednym komisarzu z każdego państwa. Ma **wyłączne prawo inicjatywy ustawodawczej** — to ona proponuje przepisy. Pilnuje też przestrzegania prawa unijnego, przez co nazywa się ją **strażniczką traktatów**. Komisarze mają działać **niezależnie**, a nie reprezentować swoje kraje.\n\nTeraz dwie instytucje, które myli się najczęściej. **Rada Europejska** to szczyty **przywódców państw** — prezydentów i premierów. Wyznacza ogólne kierunki polityki, ale **nie uchwala prawa**. **Rada Unii Europejskiej** (nazywana Radą lub Radą Ministrów) to spotkania **ministrów** poszczególnych resortów; razem z Parlamentem **uchwala prawo**.\n\nUwaga na trzecią pułapkę: **Rada Europy** to zupełnie inna organizacja, spoza Unii — to przy niej działa Europejski Trybunał Praw Człowieka w Strasburgu.\n\n**Trybunał Sprawiedliwości UE** w **Luksemburgu** czuwa nad jednolitym stosowaniem prawa unijnego. Działa też **Europejski Bank Centralny** we Frankfurcie, odpowiedzialny za euro, oraz **Trybunał Obrachunkowy**, kontrolujący wydatki."},{"id":"prawo-ue","title":"Prawo Unii Europejskiej","text":"Prawo unijne dzieli się na dwie grupy. **Prawo pierwotne** to traktaty zawarte przez państwa — podstawa całej konstrukcji. **Prawo wtórne** to akty wydawane przez instytucje unijne na podstawie traktatów.\n\nWśród aktów prawa wtórnego trzeba dobrze rozróżnić trzy rodzaje.\n\n**Rozporządzenie** obowiązuje **bezpośrednio** we wszystkich państwach, w całości i od razu — nikt nie musi go przepisywać do prawa krajowego.\n\n**Dyrektywa** wyznacza **cel**, ale zostawia państwom swobodę, jak go osiągnąć. Państwo musi ją **wdrożyć** własnymi przepisami w wyznaczonym terminie. To najczęściej mylony punkt: dyrektywa sama z siebie zwykle nie tworzy praw i obowiązków dla obywatela, dopóki nie zostanie wdrożona.\n\n**Decyzja** wiąże tylko tych, do kogo jest skierowana — konkretne państwo albo firmę. Poza tym istnieją **zalecenia i opinie**, które nie są wiążące wcale.\n\nDwie zasady rządzą stosunkiem prawa unijnego do krajowego. **Pierwszeństwo** oznacza, że w razie sprzeczności stosuje się prawo unijne. **Skutek bezpośredni** oznacza, że obywatel może powołać się na przepis unijny wprost przed krajowym sądem.\n\nGdy sąd krajowy ma wątpliwość, jak rozumieć prawo unijne, kieruje do Trybunału **pytanie prejudycjalne**. Trybunał wyjaśnia wtedy, jak przepis należy rozumieć, ale **sprawę rozstrzyga nadal sąd krajowy**."},{"id":"kompetencje","title":"Kto o czym decyduje w Unii","text":"Unia nie może zajmować się wszystkim — może działać tylko tam, gdzie państwa jej na to pozwoliły. Nazywa się to **zasadą przyznania**.\n\nKompetencje dzielą się na trzy rodzaje. **Wyłączne** to obszary, w których decyduje tylko Unia: unia celna, wspólna polityka handlowa, polityka pieniężna dla państw strefy euro, ochrona zasobów morskich. **Dzielone** to obszary wspólne dla Unii i państw: rynek wewnętrzny, rolnictwo, środowisko, transport, energia — państwa działają tam, gdzie Unia nie skorzystała ze swoich uprawnień. **Wspierające** to obszary, w których Unia jedynie uzupełnia i koordynuje działania państw, nie mogąc narzucać rozwiązań: edukacja, kultura, zdrowie, turystyka, sport.\n\nDwie zasady chronią samodzielność państw. **Pomocniczość (subsydiarność)** mówi, że Unia działa tylko wtedy, gdy cel da się lepiej osiągnąć na jej poziomie niż na krajowym. **Proporcjonalność** wymaga, by działania nie wykraczały poza to, co konieczne.\n\nDecyzje w Radze zapadają zwykle **większością kwalifikowaną** — potrzeba poparcia co najmniej 55% państw reprezentujących co najmniej 65% ludności Unii. W najbardziej wrażliwych sprawach, takich jak polityka zagraniczna, podatki czy przyjmowanie nowych członków, obowiązuje **jednomyślność**, czyli każde państwo ma prawo weta."},{"id":"polska-w-ue","title":"Polska w Unii Europejskiej","text":"Polska przystąpiła do Unii **1 maja 2004 r.**, po **referendum** przeprowadzonym w czerwcu 2003 r., w którym za członkostwem opowiedziała się zdecydowana większość głosujących.\n\nZgodę na przekazanie Unii części kompetencji Konstytucja obwarowała szczególnym trybem: **art. 90** wymaga zgody wyrażonej większością **2/3 w Sejmie i 2/3 w Senacie** albo przeprowadzenia referendum. To wyższy próg niż przy zmianie Konstytucji, gdzie Senat wystarczy bezwzględną większością.\n\nPolska ma w instytucjach: **53 posłów** w Parlamencie Europejskim, **jednego komisarza** w Komisji, przedstawicieli w Radzie oraz sędziego w Trybunale Sprawiedliwości.\n\nOd **21 grudnia 2007 r.** Polska należy do **strefy Schengen**, co oznacza zniesienie kontroli na granicach wewnętrznych. Nie należy natomiast do **strefy euro** — zobowiązała się w traktacie akcesyjnym do przyjęcia wspólnej waluty, ale nie określono terminu, a decyzja pozostaje przedmiotem sporu politycznego.\n\nCzłonkostwo przyniosło dostęp do **jednolitego rynku**, swobodę podróżowania i pracy, duże środki z **funduszy strukturalnych** na drogi, koleje i inwestycje oraz dopłaty dla rolników. Wiąże się też z obowiązkami: wpłatami do budżetu unijnego, wdrażaniem prawa unijnego i przestrzeganiem wspólnych reguł."},{"id":"wyzwania-ue","title":"Spory i wyzwania Unii","text":"Unia mierzy się dziś z kilkoma trudnymi problemami, a spory wokół nich są realne i toczą się między państwami członkowskimi.\n\n**Pogłębianie czy poszerzanie** — czy Unia ma się bardziej integrować wewnętrznie, czy przyjmować kolejne państwa. Zwolennicy federalizmu chcą wspólnej polityki zagranicznej i obronnej oraz większej roli Parlamentu; zwolennicy Europy narodów uważają, że decyzje powinny zostać w stolicach państw.\n\n**Deficyt demokratyczny** to zarzut, że obywatele mają zbyt mały wpływ na decyzje unijne, bo jedyną wybieraną przez nich instytucją jest Parlament, a najwięcej znaczą Komisja i Rada. Obrońcy Unii odpowiadają, że w Radzie zasiadają ministrowie rządów odpowiedzialnych przed krajowymi parlamentami.\n\n**Praworządność** to spór o to, na ile Unia może kontrolować ustrój sądownictwa państw członkowskich i wiązać z tym wypłatę pieniędzy. Jedni widzą w tym obronę wspólnych wartości, inni — wykraczanie poza przyznane Unii kompetencje.\n\n**Migracja** dzieli państwa w kwestii tego, kto ma przyjmować przybyszów i czy podział powinien być obowiązkowy. **Bezpieczeństwo** zyskało na znaczeniu po rosyjskiej agresji na Ukrainę — dyskutuje się o wspólnej obronie i uniezależnieniu od rosyjskich surowców. **Polityka klimatyczna** budzi spór o tempo transformacji i rozłożenie jej kosztów, zwłaszcza w krajach opartych na węglu.\n\n**Brexit** pokazał, że integracja jest odwracalna — Wielka Brytania w referendum z 2016 r. zdecydowała o wyjściu i opuściła Unię w 2020 r."}],"concepts":[{"term":"Rozporządzenie UE","def":"Akt obowiązujący w całości i stosowany bezpośrednio we wszystkich państwach członkowskich."},{"term":"Dyrektywa","def":"Akt wiążący co do celu, wymagający implementacji do prawa krajowego w wyznaczonym terminie."},{"term":"Zasada pomocniczości","def":"Unia działa tylko wtedy, gdy cel lepiej osiągnąć na jej poziomie niż krajowym lub lokalnym."},{"term":"Zasada proporcjonalności","def":"Środki Unii nie mogą wykraczać poza to, co konieczne do osiągnięcia celu."},{"term":"Kompetencje wyłączne","def":"Obszary, w których stanowić prawo może wyłącznie Unia, np. unia celna, polityka handlowa."},{"term":"Kompetencje dzielone","def":"Obszary, w których działają zarówno Unia, jak i państwa, np. rynek wewnętrzny, rolnictwo."},{"term":"Strefa Schengen","def":"Obszar zniesionych kontroli na granicach wewnętrznych; Polska od 21 grudnia 2007 r."},{"term":"Kryteria kopenhaskie","def":"Warunki członkostwa w UE: demokracja i praworządność, gospodarka rynkowa, zdolność przyjęcia dorobku prawnego."},{"term":"Traktat z Maastricht","def":"Traktat z 1992 r. (obowiązuje od 1993 r.), który powołał Unię Europejską i zapoczątkował wspólną walutę."},{"term":"Traktat lizboński","def":"Traktat z 2007 r. (obowiązuje od 2009 r.) — uporządkował instytucje, nadał moc prawną Karcie praw podstawowych i wprowadził procedurę wystąpienia z Unii."},{"term":"Strefa euro","def":"Grupa państw UE, które przyjęły wspólną walutę euro; Polska do niej nie należy."}],"institutions":[{"name":"Parlament Europejski","subtitle":"reprezentacja obywateli Unii","rows":[{"k":"Skład","v":"720 posłów (kadencja 2024–2029)"},{"k":"Mandaty Polski","v":"53"},{"k":"Wybór","v":"bezpośrednie wybory powszechne w państwach członkowskich"},{"k":"Kadencja","v":"5 lat"},{"k":"Funkcje","v":"ustawodawcza wspólnie z Radą UE, budżetowa, kontrolna"},{"k":"Uprawnienie szczególne","v":"zatwierdzanie składu Komisji i możliwość jej odwołania wotum nieufności"},{"k":"Czego nie ma","v":"prawa inicjatywy ustawodawczej — należy ono do Komisji"}]},{"name":"Rada Europejska","subtitle":"kierunki polityczne Unii","rows":[{"k":"Skład","v":"szefowie państw lub rządów, Przewodniczący RE, Przewodniczący Komisji"},{"k":"Zadanie","v":"wyznaczanie ogólnych kierunków i priorytetów politycznych"},{"k":"Funkcja ustawodawcza","v":"nie pełni jej"},{"k":"Przewodniczący","v":"wybierany na 2,5 roku, z możliwością jednokrotnego odnowienia"},{"k":"Tryb decyzji","v":"co do zasady konsensus"},{"k":"Nie mylić z","v":"Radą UE (ministrowie) i Radą Europy (spoza struktur UE)"}]},{"name":"Rada Unii Europejskiej","subtitle":"reprezentacja rządów państw członkowskich","rows":[{"k":"Skład","v":"po jednym ministrze z każdego państwa, zależnie od tematu obrad"},{"k":"Funkcja","v":"ustawodawcza wspólnie z Parlamentem Europejskim, budżetowa"},{"k":"Tryb głosowania","v":"najczęściej większość kwalifikowana"},{"k":"Większość kwalifikowana","v":"co najmniej 55% państw reprezentujących co najmniej 65% ludności UE"},{"k":"Prezydencja","v":"rotacyjna, sprawowana przez państwa po 6 miesięcy"}]},{"name":"Komisja Europejska","subtitle":"organ wykonawczy, strażniczka traktatów","rows":[{"k":"Skład","v":"po jednym komisarzu z każdego państwa członkowskiego"},{"k":"Kadencja","v":"5 lat"},{"k":"Kluczowe uprawnienie","v":"wyłączne prawo inicjatywy ustawodawczej"},{"k":"Rola strażnicza","v":"kontrola przestrzegania prawa UE, skargi do TSUE przeciw państwom"},{"k":"Zasada działania","v":"reprezentuje interes całej Unii, nie państw pochodzenia komisarzy"},{"k":"Odpowiedzialność","v":"kolegialnie przed Parlamentem Europejskim"}]},{"name":"Trybunał Sprawiedliwości UE","subtitle":"Luksemburg — wykładnia i stosowanie prawa unijnego","rows":[{"k":"Skład","v":"po jednym sędzim z każdego państwa członkowskiego"},{"k":"Zadanie główne","v":"zapewnienie jednolitej wykładni i stosowania prawa UE"},{"k":"Pytania prejudycjalne","v":"odpowiedzi na pytania sądów krajowych o wykładnię prawa unijnego"},{"k":"Skargi","v":"przeciwko państwom naruszającym prawo UE oraz na akty instytucji"},{"k":"Nie mylić z","v":"Europejskim Trybunałem Praw Człowieka w Strasburgu (Rada Europy)"}]}],"numbers":[{"label":"Traktat paryski (EWWiS)","value":"1951 r."},{"label":"Traktaty rzymskie (EWG, Euratom)","value":"1957 r."},{"label":"Traktat z Maastricht — podpisanie","value":"1992 r."},{"label":"Traktat z Maastricht — wejście w życie","value":"1993 r."},{"label":"Traktat lizboński — wejście w życie","value":"2009 r."},{"label":"Przystąpienie Polski do UE","value":"1 maja 2004 r."},{"label":"Polska w strefie Schengen od","value":"21 grudnia 2007 r."},{"label":"Referendum akcesyjne","value":"czerwiec 2003 r."},{"label":"Mandaty w Parlamencie Europejskim","value":"720"},{"label":"Mandaty Polski w PE","value":"53"},{"label":"Maksymalna liczba posłów PE wg traktatów","value":"750 plus przewodniczący"},{"label":"Kadencja PE i Komisji","value":"5 lat"},{"label":"Kadencja Przewodniczącego Rady Europejskiej","value":"2,5 roku"},{"label":"Prezydencja w Radzie UE","value":"rotacyjna co 6 miesięcy"},{"label":"Większość kwalifikowana w Radzie UE","value":"55% państw i 65% ludności"},{"label":"Państwo, które wystąpiło z UE","value":"Wielka Brytania"}],"acts":[{"act":"Konstytucja RP","article":"Art. 90 ust. 1 i 2","text":"1. Rzeczpospolita Polska może na podstawie umowy międzynarodowej przekazać organizacji międzynarodowej lub organowi międzynarodowemu kompetencje organów władzy państwowej w niektórych sprawach.\n2. Ustawa wyrażająca zgodę na ratyfikację umowy międzynarodowej, o której mowa w ust. 1, jest uchwalana przez Sejm większością 2/3 głosów w obecności co najmniej połowy ustawowej liczby posłów oraz przez Senat większością 2/3 głosów w obecności co najmniej połowy ustawowej liczby senatorów.","note":"Podstawa konstytucyjna członkostwa Polski w UE. Uwaga: tu wymagane jest 2/3 w OBU izbach — inaczej niż przy zmianie Konstytucji, gdzie Senat decyduje bezwzględną większością."},{"act":"Konstytucja RP","article":"Art. 91 ust. 3","text":"Jeżeli wynika to z ratyfikowanej przez Rzeczpospolitą Polską umowy konstytuującej organizację międzynarodową, prawo przez nią stanowione jest stosowane bezpośrednio, mając pierwszeństwo w przypadku kolizji z ustawami.","note":"Konstytucyjna podstawa bezpośredniego stosowania i pierwszeństwa prawa UE przed ustawami. Przepis mówi o kolizji z ustawami, nie z Konstytucją — to źródło sporu o relację obu porządków."},{"act":"Traktat o Unii Europejskiej","article":"Art. 5 ust. 3 (zasada pomocniczości)","text":"Zgodnie z zasadą pomocniczości, w dziedzinach, które nie należą do jej wyłącznej kompetencji, Unia podejmuje działania tylko wówczas i tylko w takim zakresie, w jakim cele zamierzonego działania nie mogą zostać osiągnięte w sposób wystarczający przez Państwa Członkowskie, zarówno na poziomie centralnym, jak i regionalnym oraz lokalnym, i jeśli ze względu na rozmiary lub skutki proponowanego działania możliwe jest lepsze ich osiągnięcie na poziomie Unii.","note":"Zasada pomocniczości dotyczy wyłącznie kompetencji niewyłącznych — w obszarach wyłącznych Unia działa bez tego testu."},{"act":"Traktat o Unii Europejskiej","article":"Art. 50 ust. 1","text":"Każde Państwo Członkowskie może, zgodnie ze swoimi wymogami konstytucyjnymi, podjąć decyzję o wystąpieniu z Unii.","note":"Klauzula wprowadzona traktatem lizbońskim; jako pierwsza skorzystała z niej Wielka Brytania."}],"disputes":[{"question":"Czy Polska powinna przyjąć euro?","sideA":{"label":"Za przyjęciem","points":["Zniknęłoby ryzyko kursowe i koszty wymiany walut w handlu z największymi partnerami gospodarczymi.","Członkostwo w strefie euro oznacza udział w decyzjach EBC, na które dziś Polska nie ma wpływu, choć odczuwa ich skutki.","Wspólna waluta zwiększa wiarygodność kredytową i obniża koszt obsługi długu publicznego."]},"sideB":{"label":"Przeciw przyjęciu","points":["Utrata własnej polityki pieniężnej pozbawia kraj narzędzia amortyzowania kryzysów przez kurs walutowy — mechanizmu, który pomógł Polsce po 2008 r.","Wspólna stopa procentowa dla gospodarek o różnym poziomie rozwoju bywa dla części z nich nieodpowiednia, czego dowiodły kryzysy w Europie Południowej.","Doświadczenia niektórych państw wskazują na ryzyko wzrostu cen towarzyszącego wymianie waluty."]}},{"question":"Czy prawo Unii Europejskiej powinno mieć pierwszeństwo przed konstytucją państwa członkowskiego?","sideA":{"label":"Za pierwszeństwem prawa UE","points":["Bez jednolitego stosowania prawa unijnego wspólny rynek i wzajemne zaufanie między państwami przestają działać.","Państwa dobrowolnie przekazały część kompetencji, więc powinny respektować skutki tej decyzji.","Możliwość powoływania się na własną konstytucję pozwalałaby wybiórczo omijać niewygodne zobowiązania."]},"sideB":{"label":"Za nadrzędnością konstytucji krajowej","points":["Konstytucja jest źródłem legitymacji samego członkostwa — Unia działa dzięki niej, nie ponad nią.","Przekazanie kompetencji nastąpiło „w niektórych sprawach”, więc pierwszeństwo nie może obejmować obszarów nieprzekazanych.","Sądy konstytucyjne kilku państw, w tym Niemiec, również zastrzegły sobie prawo kontroli granic tego przekazania."]}},{"question":"Czy Unia powinna pogłębiać integrację, czy wzmacniać rolę państw członkowskich?","sideA":{"label":"Za pogłębianiem integracji","points":["Problemy takie jak klimat, migracja czy bezpieczeństwo przekraczają możliwości pojedynczych państw.","Wspólne działanie daje Europie wagę negocjacyjną wobec Chin i Stanów Zjednoczonych, której nie mają państwa osobno.","Sprawniejsze podejmowanie decyzji wymaga ograniczenia weta pojedynczych państw blokującego wspólne stanowisko."]},"sideB":{"label":"Za modelem międzyrządowym","points":["Demokratyczna kontrola działa najlepiej na poziomie państwa, gdzie istnieje wspólna debata publiczna i wspólny język.","Odejście od jednomyślności pozbawiłoby mniejsze państwa realnej ochrony ich interesów żywotnych.","Zróżnicowanie gospodarcze i kulturowe państw sprawia, że jednolite rozwiązania bywają nietrafione lokalnie."]}}],"cases":[{"situation":"Pani Kasia z Lublina dostała pracę w Holandii. Pracodawca prosi ją o przedstawienie zezwolenia na pracę i wizy.","question":"Czy pani Kasia musi je mieć?","answer":"Nie. Jako obywatelka UE korzysta ze swobody przepływu osób — może bez zezwolenia na pracę i bez wizy pracować i mieszkać w innym państwie członkowskim, na takich samych warunkach jak jego obywatele. Musi jedynie zarejestrować pobyt, jeśli zostaje dłużej niż 3 miesiące."},{"situation":"Polski licealista na wycieczce w Grecji łamie nogę. Rodzice boją się, że za leczenie w greckim szpitalu zapłacą tysiące euro.","question":"Jaki dokument pomoże uniknąć kosztów?","answer":"Europejska Karta Ubezpieczenia Zdrowotnego (EKUZ). Uprawnia ona do korzystania z publicznej opieki zdrowotnej w innym państwie UE na takich samych zasadach jak jego obywatele. Kartę wydaje bezpłatnie NFZ. Nie obejmuje ona prywatnych placówek ani transportu do Polski — na to przydaje się dodatkowe ubezpieczenie turystyczne."},{"situation":"Uczeń jedzie na wakacje do Chorwacji i boi się, że za telefony do mamy i korzystanie z internetu zapłaci ogromny rachunek.","question":"Czy powinien się tego obawiać?","answer":"Nie. Od 2017 r. w UE obowiązuje zasada „roam like at home” — za połączenia, SMS-y i internet w innym państwie UE płaci się tak jak w kraju (w ramach tzw. polityki uczciwego korzystania). To przykład regulacji jednolitego rynku chroniącej konsumentów."},{"situation":"UE przyjmuje akt o ochronie danych osobowych (RODO). Od wskazanego dnia obowiązuje on bezpośrednio we wszystkich państwach członkowskich, a Polska nie musiała uchwalać żadnej ustawy, by zaczął działać.","question":"Jaki to rodzaj aktu prawa UE?","answer":"To rozporządzenie. Ma zasięg ogólny, wiąże w całości i jest stosowane bezpośrednio we wszystkich państwach członkowskich — nie wymaga przeniesienia do prawa krajowego. Tym różni się od dyrektywy, która wyznacza cel, a sposób jego osiągnięcia pozostawia państwom."},{"situation":"Polska nie przeniosła na czas do swojego prawa unijnej dyrektywy o ochronie środowiska.","question":"Kto i jak może zareagować?","answer":"Komisja Europejska, jako strażniczka traktatów, może wszcząć procedurę w sprawie naruszenia prawa UE: wezwać Polskę do wyjaśnień, a potem skierować sprawę do Trybunału Sprawiedliwości UE. Jeśli Polska nie wykona wyroku, Trybunał może nałożyć kary finansowe."},{"situation":"Polityk mówi w wywiadzie: „Jeśli tylko zechcemy, od przyszłego miesiąca możemy płacić w Polsce euro”.","question":"Czy ma rację?","answer":"Nie. Aby przyjąć euro, państwo musi spełnić kryteria konwergencji: niską inflację, deficyt do 3% PKB, dług publiczny do 60% PKB, niskie długoterminowe stopy procentowe i co najmniej 2 lata stabilnego kursu w mechanizmie ERM II. Ocenia to UE. W Polsce potrzebna byłaby też zmiana Konstytucji, która powierza NBP emisję pieniądza."},{"situation":"Pan Hans, obywatel Niemiec, od dwóch lat mieszka w Lublinie. Chce zagłosować w wyborach do rady miasta i w wyborach do Sejmu.","question":"W których wyborach może głosować?","answer":"Może głosować w wyborach do rady miasta (samorządowych) i do Parlamentu Europejskiego w Polsce — to prawo wynikające z obywatelstwa Unii Europejskiej. Nie może głosować w wyborach do Sejmu, Senatu ani na prezydenta, bo te są zastrzeżone dla obywateli polskich."},{"situation":"Grupa eurodeputowanych chce zakazać sprzedaży plastikowych słomek w całej UE. Przygotowują gotowy projekt aktu i chcą od razu poddać go pod głosowanie w Parlamencie Europejskim.","question":"Czy mogą to zrobić?","answer":"Nie. Prawo inicjatywy ustawodawczej w UE ma co do zasady Komisja Europejska. Parlament może jedynie wezwać Komisję do przedstawienia projektu. Gdy Komisja go przedstawi, akt uchwalają wspólnie Parlament Europejski i Rada UE w zwykłej procedurze ustawodawczej — tak w 2019 r. przyjęto dyrektywę ograniczającą jednorazowe plastiki."},{"situation":"Obywatele z kilkunastu państw UE zebrali ponad milion podpisów pod apelem o zakaz hodowli zwierząt w klatkach.","question":"Jak nazywa się ta forma działania i do czego zobowiązuje?","answer":"To europejska inicjatywa obywatelska — co najmniej milion podpisów obywateli z co najmniej 7 państw UE. Zobowiązuje Komisję Europejską do zajęcia się sprawą i udzielenia odpowiedzi, ale nie zmusza jej do przedstawienia projektu aktu prawnego (tak było w 2021 r. przy inicjatywie „End the Cage Age”)."},{"situation":"Francuscy sadownicy protestują przeciwko tanim polskim jabłkom. Rząd Francji rozważa wprowadzenie cła na jabłka z Polski.","question":"Czy Francja może to zrobić?","answer":"Nie. Państwa UE tworzą unię celną i jednolity rynek — między nimi nie wolno stosować ceł ani ograniczeń ilościowych. Obowiązuje swoboda przepływu towarów. Cła wobec państw spoza UE ustala wspólnie Unia w ramach wspólnej polityki handlowej."}],"quiz":[{"q":"Który traktat utworzył Unię Europejską?","options":["traktaty rzymskie","traktat z Maastricht","traktat lizboński","traktat paryski"],"correct":1,"explain":"Traktat z Maastricht (podpisany 1992, w życie 1993) powołał UE i obywatelstwo europejskie."},{"q":"Kiedy Polska przystąpiła do Unii Europejskiej?","options":["1 stycznia 2004","1 maja 2004","21 grudnia 2007","1 maja 2003"],"correct":1,"explain":"Polska weszła do UE 1 maja 2004 r. wraz z dziewięcioma innymi państwami."},{"q":"Która instytucja ma wyłączne prawo inicjatywy ustawodawczej w UE?","options":["Parlament Europejski","Rada UE","Komisja Europejska","Rada Europejska"],"correct":2,"explain":"Parlament i Rada UE stanowią prawo, ale projekty przedkłada Komisja."},{"q":"Czym różni się rozporządzenie od dyrektywy?","options":["Rozporządzenie wymaga wdrożenia, dyrektywa nie","Rozporządzenie stosuje się bezpośrednio, dyrektywa wymaga implementacji","Oba są niewiążące","Dyrektywa dotyczy tylko jednego państwa"],"correct":1,"explain":"Dyrektywa wiąże co do celu i wymaga wdrożenia do prawa krajowego."},{"q":"Ilu posłów liczy Parlament Europejski w kadencji 2024–2029?","options":["705","720","750","751"],"correct":1,"explain":"720 mandatów; traktatowe maksimum to 750 plus przewodniczący."},{"q":"Ile mandatów w Parlamencie Europejskim ma Polska?","options":["51","52","53","56"],"correct":2,"explain":"Polska ma 53 mandaty w kadencji 2024–2029."},{"q":"Rada Europejska:","options":["stanowi prawo wspólnie z Parlamentem","wyznacza kierunki polityczne, nie pełni funkcji ustawodawczej","jest organem Rady Europy","składa się z ministrów branżowych"],"correct":1,"explain":"Funkcję ustawodawczą pełni Rada UE (ministrowie), nie Rada Europejska (szefowie państw i rządów)."},{"q":"Na czym polega zasada pomocniczości?","options":["Unia działa zawsze przed państwami","Unia działa tylko, gdy cel lepiej osiągnąć na jej poziomie","Państwa muszą pomagać sobie finansowo","Komisja pomaga Parlamentowi"],"correct":1,"explain":"Zasada dotyczy wyłącznie kompetencji niewyłącznych."},{"q":"Czym jest pytanie prejudycjalne?","options":["Skargą obywatela do TSUE","Pytaniem sądu krajowego do TSUE o wykładnię prawa UE","Wnioskiem Komisji o ukaranie państwa","Opinią Rady Europejskiej"],"correct":1,"explain":"TSUE dokonuje wykładni, ale sprawę rozstrzyga sąd krajowy."},{"q":"Od kiedy Polska należy do strefy Schengen?","options":["1 maja 2004","21 grudnia 2007","1 stycznia 2009","2011"],"correct":1,"explain":"Kontrole na granicach wewnętrznych zniesiono 21 grudnia 2007 r."},{"q":"Jakiej większości wymaga w Polsce ratyfikacja umowy przekazującej kompetencje organizacji międzynarodowej?","options":["bezwzględnej w obu izbach","2/3 w Sejmie i bezwzględnej w Senacie","2/3 w Sejmie i 2/3 w Senacie","zwykłej większości"],"correct":2,"explain":"Art. 90 wymaga 2/3 w obu izbach — inaczej niż art. 235 przy zmianie Konstytucji."},{"q":"Do jakiej kategorii kompetencji UE należy edukacja?","options":["wyłącznych","dzielonych","wspierających","zastrzeżonych"],"correct":2,"explain":"W obszarze wspierającym Unia jedynie uzupełnia działania państw."},{"q":"Które państwo skorzystało z możliwości wystąpienia z Unii?","options":["Grecja","Wielka Brytania","Dania","Szwajcaria"],"correct":1,"explain":"Wielka Brytania jako pierwsza zastosowała art. 50 TUE; Szwajcaria nigdy nie była członkiem UE."},{"q":"Trybunał Sprawiedliwości UE ma siedzibę w:","options":["Strasburgu","Hadze","Luksemburgu","Brukseli"],"correct":2,"explain":"TSUE mieści się w Luksemburgu; w Strasburgu działa ETPC — organ Rady Europy."}]},{"id":"stosunki","number":"VIII","icon":"Network","name":"Stosunki międzynarodowe","blurb":"Ład międzynarodowy, ONZ, NATO, konflikty, bezpieczeństwo, prawa człowieka w świecie.","status":"ready","topics":[{"id":"istota-sm","title":"Istota i uczestnicy stosunków międzynarodowych","text":"**Stosunki międzynarodowe** to całość relacji między uczestnikami sceny światowej. Najważniejszym z nich pozostaje **państwo**, które musi mieć trzy rzeczy: **terytorium**, **ludność** i **władzę suwerenną**. **Suwerenność** oznacza, że władza jest najwyższa w kraju i niezależna na zewnątrz — nikt z zewnątrz nie może jej rozkazywać.\\n\\nObok państw działają inni uczestnicy. **Organizacje międzynarodowe rządowe** zrzeszają państwa — to ONZ, NATO, Unia Europejska. **Organizacje pozarządowe** tworzą sami ludzie, jak Amnesty International czy Czerwony Krzyż. Do tego dochodzą wielkie **korporacje** działające w wielu krajach, Kościoły, ruchy społeczne, a po stronie zagrożeń — **organizacje terrorystyczne**.\\n\\nBadacze różnie tłumaczą, czym kierują się państwa. **Realizm** zakłada, że skoro nad państwami nie ma żadnej wyższej władzy, każde musi samo dbać o swoje bezpieczeństwo i siłę — dlatego rywalizacja jest nieunikniona. **Liberalizm** odpowiada, że wojny hamują handel, więc państwa powiązane gospodarczo i związane wspólnymi instytucjami rzadziej ze sobą walczą. **Konstruktywizm** zwraca uwagę, że interesy państw nie są dane raz na zawsze — zmieniają się wraz z ideami, normami i tym, za kogo dane państwo się uważa."},{"id":"lad-po-1945","title":"Ład międzynarodowy po 1945 r. i jego przemiany","text":"Po II wojnie światowej świat podzielił się na dwa obozy. Taki układ nazywamy **ładem dwubiegunowym**: przez blisko pół wieku o wszystkim decydowała rywalizacja **Stanów Zjednoczonych** i **Związku Radzieckiego**.\\n\\nOkres ten nazwano **zimną wojną**, bo supermocarstwa nigdy nie starły się ze sobą bezpośrednio. Powstrzymywała je **broń jądrowa** — obie strony wiedziały, że atak oznaczałby zniszczenie także własnego kraju. Zamiast tego walczyły cudzymi rękami w **konfliktach zastępczych**: w Korei, Wietnamie, Afganistanie oraz w wielu krajach Afryki i Ameryki Łacińskiej, wspierając przeciwne strony.\\n\\n**Rozpad ZSRR w 1991 r.** zakończył ten podział. Lata 90. bywają nazywane **momentem jednobiegunowym** — czasem wyraźnej przewagi Stanów Zjednoczonych, gdy zachodnie instytucje i gospodarka rynkowa rozszerzały się na kolejne kraje.\\n\\nDziś mówi się raczej o **ładzie wielobiegunowym**, w którym liczy się kilka ośrodków: obok USA także **Chiny**, **Unia Europejska**, **Rosja** i **Indie**. Cechy obecnego okresu to rywalizacja gospodarcza i technologiczna, słabnięcie części instytucji międzynarodowych oraz — po agresji Rosji na Ukrainę — powrót wojny na dużą skalę do Europy."},{"id":"onz","title":"Organizacja Narodów Zjednoczonych","text":"**Organizacja Narodów Zjednoczonych** powstała w **1945 r.** na mocy **Karty Narodów Zjednoczonych** podpisanej w San Francisco. Zastąpiła Ligę Narodów, która nie zdołała zapobiec II wojnie światowej. **Polska należy do państw założycielskich**, choć jej przedstawiciele podpisali Kartę nieco później niż pozostali.\\n\\nCele ONZ to przede wszystkim utrzymanie **pokoju i bezpieczeństwa**, rozwijanie przyjaznych stosunków między narodami, współpraca w sprawach gospodarczych i społecznych oraz popieranie **praw człowieka**. Organizacja działa według kilku zasad: **suwerennej równości państw**, **zakazu użycia siły**, **pokojowego rozstrzygania sporów** i **nieingerencji** w sprawy wewnętrzne.\\n\\nGłównych organów jest sześć. **Zgromadzenie Ogólne** skupia wszystkie państwa, każde ma jeden głos, ale jego uchwały to zwykle tylko **zalecenia**. **Rada Bezpieczeństwa** odpowiada za pokój i jako jedyna wydaje uchwały **wiążące** — ma jednak 5 stałych członków z **prawem weta**. Dalej: **Sekretariat** z Sekretarzem Generalnym, **Rada Gospodarcza i Społeczna**, **Międzynarodowy Trybunał Sprawiedliwości** oraz zawieszona **Rada Powiernicza**.\\n\\nW systemie ONZ działają też wyspecjalizowane organizacje: **WHO** (zdrowie), **UNESCO** (oświata i kultura), **MOP** (praca), **FAO** (żywność), a także programy **UNICEF** (dzieci) i **UNHCR** (uchodźcy)."},{"id":"nato-bezpieczenstwo","title":"NATO i bezpieczeństwo Polski","text":"**NATO**, czyli Organizacja Traktatu Północnoatlantyckiego, powstało w **1949 r.** na mocy **traktatu waszyngtońskiego** jako sojusz obronny państw Zachodu.\\n\\nJego fundamentem jest **artykuł 5**, który mówi, że **zbrojna napaść na jednego członka jest napaścią na wszystkich**. Warto jednak przeczytać go dokładnie: każdy sojusznik udziela pomocy, podejmując działania, jakie **sam uzna za konieczne** — automatyczne wypowiedzenie wojny nie wynika wprost z traktatu. Artykuł 5 uruchomiono w historii **tylko raz**: po zamachach z **11 września 2001 r.**\\n\\nDecyzje w NATO zapadają przez **konsensus**, czyli za zgodą wszystkich — każde państwo może zablokować rozstrzygnięcie.\\n\\n**Polska przystąpiła do NATO 12 marca 1999 r.**, razem z Czechami i Węgrami. Był to zwrot po dekadach przynależności do Układu Warszawskiego. Członkostwo daje gwarancje bezpieczeństwa, ale nakłada też obowiązki: wydatki na obronność i udział w misjach sojuszniczych.\\n\\nWspółcześnie bezpieczeństwo rozumie się szerzej niż tylko wojskowo. Mówi się o bezpieczeństwie **energetycznym**, **gospodarczym**, **informacyjnym**, **cybernetycznym** i **klimatycznym**. W polskiej debacie najważniejsze są dziś: obecność wojsk sojuszniczych na **wschodniej flance**, rozbudowa własnej armii oraz ochrona infrastruktury krytycznej."},{"id":"prawo-miedzynarodowe","title":"Prawo międzynarodowe i rozwiązywanie sporów","text":"**Prawo międzynarodowe publiczne** reguluje stosunki między państwami. Jego źródła to przede wszystkim **umowy międzynarodowe**, **zwyczaj międzynarodowy** (utrwalona praktyka państw uznawana przez nie za obowiązującą) oraz **ogólne zasady prawa**.\\n\\nMa ono jedną zasadniczą różnicę wobec prawa krajowego: **nie istnieje policja ani sąd, który mógłby zmusić państwo do posłuszeństwa**. Przestrzeganie norm opiera się na wzajemności, reputacji i naciskach ze strony innych państw i instytucji.\\n\\nSpory rozwiązuje się **pokojowo**: przez **rokowania** (bezpośrednie rozmowy), **dobre usługi** i **mediację** (pomoc państwa trzeciego), **koncyliację**, **arbitraż** oraz **postępowanie sądowe**. Gdy to nie skutkuje, państwa sięgają po środki nacisku bez użycia siły: **retorsje** (np. wydalenie dyplomatów) i **sankcje** gospodarcze.\\n\\nTrzy trybunały łatwo pomylić, więc warto je rozróżnić. **Międzynarodowy Trybunał Sprawiedliwości** w **Hadze** rozstrzyga spory **między państwami** — i tylko wtedy, gdy się na to zgodzą; jednostki nie mogą przed nim występować. **Międzynarodowy Trybunał Karny**, również w Hadze, sądzi **konkretnych ludzi** za ludobójstwo, zbrodnie przeciw ludzkości, zbrodnie wojenne i agresję. **Europejski Trybunał Praw Człowieka** w **Strasburgu** to zupełnie inna instytucja — działa przy Radzie Europy i przyjmuje skargi **od obywateli**."},{"id":"wojna-ukraina","title":"Wojna na Ukrainie","text":"**Wojna na Ukrainie** to największy konflikt zbrojny w Europie od czasów II wojny światowej i najważniejsze wydarzenie dla bezpieczeństwa Polski w ostatnich dekadach.\n\nZaczęło się wcześniej, niż często się sądzi. W 2014 r., po ucieczce prorosyjskiego prezydenta Ukrainy w wyniku protestów na Majdanie, Rosja **zajęła i anektowała Krym**, a następnie wsparła zbrojne wystąpienia separatystów w Donbasie na wschodzie kraju. Aneksja Krymu została uznana przez społeczność międzynarodową za nielegalną, bo naruszała zakaz zdobywania terytorium siłą.\n\n**24 lutego 2022 r.** Rosja rozpoczęła **pełnoskalową inwazję** na Ukrainę, atakując z kilku kierunków, w tym z terytorium Białorusi. Szybkie zajęcie Kijowa się nie powiodło i wojna przekształciła się w długotrwały konflikt o charakterze pozycyjnym, z ciężkimi walkami na wschodzie i południu kraju.\n\nZ punktu widzenia prawa międzynarodowego inwazja stanowi **złamanie zakazu użycia siły** z Karty Narodów Zjednoczonych. Rada Bezpieczeństwa nie mogła podjąć działań, ponieważ Rosja jako stały członek dysponuje **prawem weta** — to najczęściej przywoływany przykład paraliżu tego organu.\n\nReakcją Zachodu były **sankcje gospodarcze** nakładane na Rosję oraz dostawy broni i wsparcie finansowe dla Ukrainy. Wojna wywołała też największą **falę uchodźczą** w Europie od 1945 r.; Polska przyjęła miliony osób uciekających przed walkami.\n\nDla Polski konsekwencje są bezpośrednie: wzmocnienie **wschodniej flanki NATO** i obecność wojsk sojuszniczych, gwałtowny wzrost wydatków na obronność, uniezależnianie się od rosyjskich surowców energetycznych oraz nowe wyzwania związane z przyjęciem dużej liczby uchodźców."},{"id":"bliski-wschod","title":"Konflikt izraelsko-palestyński i wojny Bliskiego Wschodu","text":"**Konflikt izraelsko-palestyński** to jeden z najdłużej trwających sporów współczesnego świata. Jego istotą jest rywalizacja dwóch narodów o to samo terytorium.\n\nKorzenie sięgają pierwszej połowy XX w. W 1947 r. ONZ zaproponowała **podział Palestyny** na państwo żydowskie i arabskie. Strona żydowska plan przyjęła, arabska odrzuciła. Po ogłoszeniu **powstania Izraela w 1948 r.** wybuchła wojna z państwami arabskimi — pierwsza z kilku. W jej wyniku setki tysięcy Palestyńczyków opuściło swoje domy, co do dziś pozostaje jedną z osi sporu.\n\nPrzełomowa była **wojna sześciodniowa w 1967 r.**, po której Izrael zajął Zachodni Brzeg Jordanu, Strefę Gazy, Wzgórza Golan i półwysep Synaj. Status tych terytoriów pozostaje głównym przedmiotem konfliktu, podobnie jak **budowa osiedli żydowskich** na terenach okupowanych, uznawana przez większość społeczności międzynarodowej za niezgodną z prawem międzynarodowym.\n\nPróby pokoju przynosiły częściowe rezultaty: porozumienie z Egiptem (1979 r.) i **porozumienia z Oslo** (1993 r.), które powołały Autonomię Palestyńską. Kluczowe kwestie — granice, status Jerozolimy, los uchodźców i bezpieczeństwo — nigdy nie zostały rozstrzygnięte. Najczęściej dyskutowanym rozwiązaniem pozostaje **koncepcja dwóch państw**, izraelskiego i palestyńskiego, żyjących obok siebie.\n\nRegion trawią też inne konflikty. **Wojna domowa w Syrii**, trwająca od 2011 r., pochłonęła setki tysięcy ofiar i wypędziła miliony ludzi z domów, wywołując kryzys migracyjny w Europie w 2015 r. Wojna w **Jemenie** doprowadziła do jednej z najcięższych katastrof humanitarnych świata. W latach 2014–2019 znaczną część Iraku i Syrii kontrolowało tzw. **Państwo Islamskie**, organizacja terrorystyczna pokonana przez międzynarodową koalicję.\n\nWspólne cechy tych konfliktów to: udział mocarstw zewnętrznych wspierających przeciwne strony, przenikanie się podziałów religijnych, etnicznych i politycznych, ogromne straty wśród ludności cywilnej oraz trudność w wypracowaniu trwałego rozwiązania."},{"id":"globalne-problemy","title":"Globalne problemy współczesnego świata","text":"**Problemy globalne** to takie, których żadne państwo nie rozwiąże samo. Należą do nich: **ubóstwo** i przepaść rozwojowa między bogatą Północą a biedniejszym Południem, **głód** i brak dostępu do czystej wody, **zmiany klimatu**, niszczenie środowiska, **choroby zakaźne** oraz **terroryzm międzynarodowy**.\\n\\nSpołeczność międzynarodowa próbuje na nie odpowiadać wspólnie. W **2015 r.** ONZ przyjęła **Agendę 2030** wraz z **17 Celami Zrównoważonego Rozwoju** — od likwidacji ubóstwa po ochronę klimatu. W tym samym roku zawarto **porozumienie paryskie**, w którym państwa zobowiązały się ograniczyć wzrost średniej temperatury na Ziemi.\\n\\nSkuteczność tych porozumień bywa oceniana krytycznie. Zobowiązania są w dużej mierze **dobrowolne**, a nad ich wykonaniem nie ma realnej kontroli.\\n\\nNajostrzejszy spór dotyczy tego, **kto ma zapłacić za transformację**. Kraje rozwijające się wskazują, że za większość dotychczasowych emisji odpowiadają państwa uprzemysłowione, które bogaciły się bez żadnych ograniczeń — teraz więc one powinny ponieść główny ciężar. Państwa rozwinięte odpowiadają, że bez udziału największych obecnych emitentów, w tym Chin i Indii, żadne działania nie przyniosą efektu."},{"id":"polityka-zagraniczna-rp","title":"Polityka zagraniczna Rzeczypospolitej Polskiej","text":"Politykę zagraniczną prowadzi **Rada Ministrów**, a wykonuje ją **minister spraw zagranicznych**. **Prezydent** jako najwyższy przedstawiciel państwa **ratyfikuje umowy międzynarodowe** oraz **mianuje ambasadorów**.\\n\\nKonstytucja formułuje przy tym ważną zasadę: w sprawach polityki zagranicznej Prezydent **współdziała** z premierem i ministrem spraw zagranicznych. Słowo 'współdziała' nie oznacza ani podporządkowania, ani samodzielności — i właśnie ta nieostrość bywała w praktyce źródłem sporów o to, kto reprezentuje Polskę za granicą.\\n\\nFilary polskiej polityki zagranicznej po 1989 r. to: członkostwo w **NATO** (od 1999 r.) i **Unii Europejskiej** (od 2004 r.), bliskie relacje ze **Stanami Zjednoczonymi**, współpraca regionalna oraz stosunki z sąsiadami. Formaty współpracy regionalnej to **Grupa Wyszehradzka** (z Czechami, Słowacją i Węgrami), **Trójkąt Weimarski** (z Niemcami i Francją), **Inicjatywa Trójmorza** i **Bukaresztańska Dziewiątka**.\\n\\nZa granicą Polskę reprezentuje **służba zagraniczna**. Warto rozróżnić dwie placówki: **ambasada** reprezentuje państwo w relacjach z władzami innego kraju, natomiast **konsulat** zajmuje się sprawami zwykłych ludzi — paszportami, wizami, pomocą Polakom, którzy mają kłopoty za granicą."}],"concepts":[{"term":"Suwerenność","def":"Niezależność państwa na zewnątrz i najwyższa władza wewnątrz kraju."},{"term":"Umowa międzynarodowa","def":"Porozumienie między państwami tworzące dla nich prawa i obowiązki; główne źródło prawa międzynarodowego."},{"term":"Samoobrona","def":"Prawo państwa do odparcia zbrojnej napaści bez czekania na zgodę organów międzynarodowych."},{"term":"Agresja","def":"Zbrojna napaść na inne państwo; najcięższe naruszenie prawa międzynarodowego."},{"term":"Prawo weta","def":"Uprawnienie każdego z pięciu stałych członków Rady Bezpieczeństwa do zablokowania jej uchwały."},{"term":"Sankcje","def":"Środki nacisku, najczęściej gospodarcze, stosowane wobec państwa łamiącego prawo międzynarodowe."},{"term":"Aneksja","def":"Przyłączenie cudzego terytorium siłą; zakazane przez prawo międzynarodowe."},{"term":"Okupacja","def":"Faktyczne władanie obcym terytorium przez wojsko, bez nabycia do niego tytułu prawnego."},{"term":"Misja pokojowa","def":"Operacja prowadzona za zgodą stron w celu utrzymania lub przywrócenia pokoju."},{"term":"Interwencja humanitarna","def":"Użycie siły uzasadniane ochroną ludności przed masowymi zbrodniami; jej legalność bywa sporna."},{"term":"Ludobójstwo","def":"Działania zmierzające do zniszczenia w całości lub części grupy narodowej, etnicznej, rasowej lub religijnej."},{"term":"Terroryzm międzynarodowy","def":"Przemoc wobec ludności cywilnej stosowana dla wywarcia presji politycznej, o zasięgu ponadpaństwowym."},{"term":"Zimna wojna","def":"Rywalizacja USA i ZSRR po 1945 r., prowadzona bez bezpośredniej wojny między nimi."},{"term":"Ład dwubiegunowy","def":"Układ świata zdominowany przez dwa supermocarstwa."},{"term":"Ład wielobiegunowy","def":"Układ, w którym liczy się kilka ośrodków siły o porównywalnym znaczeniu."},{"term":"Separatyzm","def":"Dążenie części ludności do oderwania terytorium od państwa."}],"institutions":[{"name":"Zgromadzenie Ogólne ONZ","subtitle":"organ plenarny Narodów Zjednoczonych","rows":[{"k":"Skład","v":"wszystkie państwa członkowskie"},{"k":"Siła głosu","v":"jedno państwo — jeden głos"},{"k":"Sesje","v":"coroczne sesje zwyczajne oraz sesje nadzwyczajne"},{"k":"Kompetencje","v":"debata nad wszystkimi sprawami z Karty NZ, uchwalanie budżetu, wybór członków organów"},{"k":"Moc uchwał","v":"co do zasady niewiążące — mają charakter zaleceń"}]},{"name":"Rada Bezpieczeństwa ONZ","subtitle":"odpowiedzialność za pokój i bezpieczeństwo","rows":[{"k":"Skład","v":"15 członków"},{"k":"Stali członkowie","v":"USA, Rosja, Chiny, Wielka Brytania, Francja"},{"k":"Niestali członkowie","v":"10, wybierani na 2 lata przez Zgromadzenie Ogólne"},{"k":"Prawo weta","v":"przysługuje wyłącznie pięciu stałym członkom"},{"k":"Kompetencje","v":"sankcje, upoważnienie do użycia siły, misje pokojowe"},{"k":"Moc uchwał","v":"wiążące dla państw członkowskich ONZ"}]},{"name":"Międzynarodowy Trybunał Sprawiedliwości","subtitle":"główny organ sądowy ONZ (Haga)","rows":[{"k":"Skład","v":"15 sędziów"},{"k":"Kadencja","v":"9 lat, z możliwością reelekcji"},{"k":"Wybór","v":"przez Zgromadzenie Ogólne i Radę Bezpieczeństwa"},{"k":"Strony postępowania","v":"wyłącznie państwa — nie jednostki"},{"k":"Warunek jurysdykcji","v":"zgoda państw na poddanie się orzecznictwu"},{"k":"Dodatkowa funkcja","v":"opinie doradcze dla organów ONZ"}]},{"name":"Międzynarodowy Trybunał Karny","subtitle":"sąd karny wobec jednostek (Haga)","rows":[{"k":"Podstawa","v":"statut rzymski z 1998 r., działa od 2002 r."},{"k":"Charakter","v":"organizacja niezależna od ONZ"},{"k":"Zakres podmiotowy","v":"osoby fizyczne, nie państwa"},{"k":"Zbrodnie","v":"ludobójstwo, zbrodnie przeciw ludzkości, zbrodnie wojenne, zbrodnia agresji"},{"k":"Zasada komplementarności","v":"działa tylko, gdy państwo nie chce lub nie może osądzić sprawcy"}]},{"name":"NATO","subtitle":"sojusz polityczno-wojskowy","rows":[{"k":"Powstanie","v":"1949 r., traktat waszyngtoński"},{"k":"Kluczowy przepis","v":"art. 5 — obrona kolektywna"},{"k":"Organ decyzyjny","v":"Rada Północnoatlantycka"},{"k":"Zasada podejmowania decyzji","v":"konsensus — każde państwo ma prawo sprzeciwu"},{"k":"Przystąpienie Polski","v":"12 marca 1999 r."},{"k":"Siedziba","v":"Bruksela"}]}],"numbers":[{"label":"Powstanie ONZ","value":"1945 r."},{"label":"Członkowie Rady Bezpieczeństwa","value":"15 (5 stałych, 10 niestałych)"},{"label":"Kadencja niestałego członka RB","value":"2 lata"},{"label":"Sędziowie Międzynarodowego Trybunału Sprawiedliwości","value":"15"},{"label":"Kadencja sędziego MTS","value":"9 lat"},{"label":"Powstanie NATO","value":"1949 r."},{"label":"Przystąpienie Polski do NATO","value":"12 marca 1999 r."},{"label":"Przystąpienie Polski do UE","value":"1 maja 2004 r."},{"label":"Jedyne powołanie się na art. 5 NATO","value":"po 11 września 2001 r."},{"label":"Statut rzymski MTK","value":"1998 r. (obowiązuje od 2002 r.)"},{"label":"Powszechna Deklaracja Praw Człowieka","value":"10 grudnia 1948 r."},{"label":"Cele Zrównoważonego Rozwoju (Agenda 2030)","value":"17 celów, przyjęte w 2015 r."},{"label":"Porozumienie paryskie w sprawie klimatu","value":"2015 r."},{"label":"Aneksja Krymu przez Rosję","value":"2014 r."},{"label":"Pełnoskalowa inwazja Rosji na Ukrainę","value":"24 lutego 2022 r."},{"label":"Powstanie państwa Izrael","value":"1948 r."},{"label":"Wojna sześciodniowa","value":"1967 r."},{"label":"Porozumienia z Oslo","value":"1993 r."},{"label":"Początek wojny domowej w Syrii","value":"2011 r."},{"label":"Rozpad ZSRR — koniec ładu dwubiegunowego","value":"1991 r."}],"acts":[{"act":"Karta Narodów Zjednoczonych","article":"Art. 2 ust. 4","text":"Wszyscy członkowie powstrzymają się w swych stosunkach międzynarodowych od groźby użycia siły lub użycia jej przeciwko całości terytorialnej lub niepodległości któregokolwiek państwa.","note":"Zakaz użycia siły — fundament powojennego porządku prawnego. Wyjątki: samoobrona (art. 51) i działania upoważnione przez Radę Bezpieczeństwa."},{"act":"Karta Narodów Zjednoczonych","article":"Art. 2 ust. 7","text":"Żadne postanowienie niniejszej Karty nie upoważnia Narodów Zjednoczonych do ingerencji w sprawy, które z istoty swej należą do kompetencji wewnętrznej któregokolwiek państwa.","note":"Zasada nieingerencji — często przywoływana w sporach o interwencje humanitarne i ochronę praw człowieka."},{"act":"Traktat waszyngtoński (NATO)","article":"Art. 5","text":"Strony zgadzają się, że zbrojna napaść na jedną lub kilka z nich w Europie lub Ameryce Północnej będzie uznana za napaść przeciwko nim wszystkim.","note":"Klauzula obrony kolektywnej. Każde państwo podejmuje działania, jakie uzna za konieczne — automatyzm zbrojny nie wynika wprost z traktatu."},{"act":"Powszechna Deklaracja Praw Człowieka","article":"Art. 1","text":"Wszyscy ludzie rodzą się wolni i równi w swej godności i w swych prawach. Są oni obdarzeni rozumem i sumieniem oraz powinni postępować w stosunku do siebie wzajemnie w duchu braterstwa.","note":"Deklaracja z 1948 r. nie jest formalnie wiążąca, ale jej normy weszły do prawa zwyczajowego i licznych traktatów."},{"act":"Konstytucja RP","article":"Art. 9","text":"Rzeczpospolita Polska przestrzega wiążącego ją prawa międzynarodowego.","note":"Zwięzły przepis o zasadniczym znaczeniu — otwiera polski porządek prawny na normy międzynarodowe."},{"act":"Konstytucja RP","article":"Art. 133 ust. 3","text":"Prezydent Rzeczypospolitej w zakresie polityki zagranicznej współdziała z Prezesem Rady Ministrów i właściwym ministrem.","note":"Podstawa sporów kompetencyjnych między Prezydentem a rządem — Konstytucja nakazuje współdziałanie, nie podporządkowanie."}],"disputes":[{"question":"Czy prawo weta stałych członków Rady Bezpieczeństwa powinno zostać zniesione?","sideA":{"label":"Za zniesieniem lub ograniczeniem","points":["Weto paraliżuje Radę wtedy, gdy jest najbardziej potrzebna — zwłaszcza gdy w konflikt zaangażowane jest samo mocarstwo dysponujące wetem.","Utrwala układ sił z 1945 r., nieodpowiadający dzisiejszej mapie potęg i pomijający całe regiony świata.","Podważa zasadę suwerennej równości państw, na której formalnie opiera się cała Organizacja."]},"sideB":{"label":"Za utrzymaniem","points":["Weto zapewnia udział mocarstw w Organizacji — bez tej gwarancji mogłyby ją opuścić lub ignorować, jak stało się z Ligą Narodów.","Chroni przed podejmowaniem decyzji o użyciu siły wbrew woli państw dysponujących największym potencjałem militarnym.","Wymusza poszukiwanie porozumienia zamiast przegłosowywania mocarstw, co w sprawach wojny i pokoju bywa bezpieczniejsze."]}},{"question":"Czy interwencja humanitarna bez zgody Rady Bezpieczeństwa jest dopuszczalna?","sideA":{"label":"Za dopuszczalnością","points":["Bierność wobec ludobójstwa czy masowych zbrodni jest moralnie nie do obrony, a paraliż Rady nie może być usprawiedliwieniem.","Suwerenność wiąże się z odpowiedzialnością państwa za ochronę własnej ludności; jej rażące złamanie osłabia tę ochronę.","Prawo międzynarodowe ewoluuje, a koncepcja odpowiedzialności za ochronę zyskała szerokie poparcie polityczne."]},"sideB":{"label":"Przeciw","points":["Karta NZ dopuszcza użycie siły wyłącznie w samoobronie lub za zgodą Rady Bezpieczeństwa — inne przypadki naruszają zakaz agresji.","Względy humanitarne bywały wykorzystywane jako pretekst do realizacji interesów mocarstw.","Osłabienie zakazu użycia siły grozi erozją całego powojennego porządku i zwiększa ryzyko wojen."]}},{"question":"Czy polityka zagraniczna Polski powinna opierać się przede wszystkim na relacjach ze Stanami Zjednoczonymi, czy na integracji europejskiej?","sideA":{"label":"Za priorytetem transatlantyckim","points":["Realne gwarancje bezpieczeństwa w regionie zapewnia potencjał militarny NATO, którego trzonem pozostają Stany Zjednoczone.","Unia Europejska nie dysponuje samodzielnymi zdolnościami obronnymi porównywalnymi z amerykańskimi.","Bliski sojusz z Waszyngtonem równoważy wpływy największych państw kontynentu w samej Unii."]},"sideB":{"label":"Za priorytetem europejskim","points":["To w Unii zapadają decyzje bezpośrednio kształtujące polską gospodarkę, prawo i budżet — tam warto budować wpływ.","Zaangażowanie USA w Europie zależy od zmiennych kalkulacji politycznych, więc opieranie bezpieczeństwa na jednym partnerze jest ryzykowne.","Silniejsza pozycja w Unii zwiększa zdolność Polski do współkształtowania reguł, a nie tylko ich przyjmowania."]}}],"cases":[{"situation":"Państwo A zajmuje zbrojnie prowincję sąsiedniego państwa B, po czym organizuje tam głosowanie i ogłasza włączenie tego terytorium do swojego państwa. Większość państw świata oraz Zgromadzenie Ogólne ONZ odmawiają uznania tej zmiany.","question":"Jak zakwalifikować działanie państwa A w świetle prawa międzynarodowego?","answer":"To aneksja, czyli przyłączenie cudzego terytorium siłą — działanie zakazane, bo narusza zasadę zakazu użycia siły z Karty Narodów Zjednoczonych oraz integralność terytorialną państwa B. Zorganizowanie głosowania pod okupacją nie sanuje tej wady: prawo międzynarodowe nie uznaje nabycia terytorium w wyniku agresji. Dlatego państwa odmawiają uznania nowego stanu, choć faktyczna kontrola nad obszarem trwa. Kazus pokazuje różnicę między stanem faktycznym a tytułem prawnym do terytorium."},{"situation":"Na terytorium Polski spada pocisk, zabijając dwie osoby. Przez pierwsze godziny nie wiadomo, czy był to celowy atak, czy przypadek związany z wojną toczącą się za granicą.","question":"Z którego artykułu Traktatu Północnoatlantyckiego Polska skorzysta najpierw i dlaczego?","answer":"Najpierw z art. 4 — wniosku o konsultacje sojuszników, gdy państwo uzna, że zagrożone jest jego bezpieczeństwo. Art. 5 (kolektywna obrona) stosuje się w razie zbrojnej napaści; tu jeszcze nie wiadomo, czy do niej doszło. Podobna sytuacja miała miejsce w listopadzie 2022 r. w Przewodowie."},{"situation":"Rada Bezpieczeństwa ONZ głosuje nad rezolucją. Wynik: 13 państw „za”, 1 wstrzymuje się, 1 „przeciw”. Przeciw głosuje jeden ze stałych członków.","question":"Czy rezolucja została przyjęta?","answer":"Nie. Rezolucja w sprawach merytorycznych wymaga co najmniej 9 głosów „za” i braku sprzeciwu któregokolwiek z pięciu stałych członków (USA, Rosja, Chiny, Wielka Brytania, Francja). Głos „przeciw” stałego członka jest wetem. Wstrzymanie się stałego członka nie blokowałoby rezolucji."},{"situation":"Zgromadzenie Ogólne ONZ przyjmuje rezolucję potępiającą agresję jednego państwa na drugie — głosuje za nią 141 państw. Agresor ignoruje rezolucję i kontynuuje wojnę.","question":"Czy rezolucja Zgromadzenia Ogólnego była wiążąca?","answer":"Nie. Rezolucje Zgromadzenia Ogólnego mają charakter zaleceń — mają duże znaczenie polityczne i moralne, ale nie są prawnie wiążące. Wiążące mogą być rezolucje Rady Bezpieczeństwa. Tak było w marcu 2022 r. przy rezolucji wzywającej Rosję do wycofania wojsk z Ukrainy."},{"situation":"Międzynarodowy Trybunał Karny wydał nakaz aresztowania przywódcy pewnego państwa podejrzanego o zbrodnie wojenne. Przywódca przyjeżdża z oficjalną wizytą do państwa, które jest stroną Statutu MTK.","question":"Co powinno zrobić to państwo?","answer":"Jako strona Statutu Rzymskiego ma obowiązek zatrzymać poszukiwanego i przekazać go do Hagi. MTK sądzi osoby (a nie państwa) za ludobójstwo, zbrodnie przeciwko ludzkości, zbrodnie wojenne i zbrodnię agresji. Jeśli państwo tego nie zrobi, narusza swoje zobowiązania wobec Trybunału."},{"situation":"Polskie służby ustaliły, że jeden z dyplomatów obcego państwa prowadził działalność szpiegowską. Prokurator chce postawić mu zarzuty i doprowadzić do procesu.","question":"Co może zrobić Polska?","answer":"Dyplomata ma immunitet dyplomatyczny, więc nie można go sądzić w Polsce. Polska może jednak uznać go za osobę niepożądaną (persona non grata) i zażądać, by opuścił kraj — nie musi przy tym podawać przyczyn. Państwo wysyłające może też samo uchylić immunitet, ale zdarza się to rzadko."},{"situation":"Dwa sąsiednie państwa od lat spierają się o przebieg granicy morskiej, a więc o to, do kogo należą złoża gazu pod dnem morza. Oba chcą, by spór rozstrzygnął niezależny sąd.","question":"Do jakiego sądu mogą się zwrócić?","answer":"Do Międzynarodowego Trybunału Sprawiedliwości w Hadze — organu sądowego ONZ, który rozstrzyga spory między państwami, jeśli zgodzą się one na jego jurysdykcję. Spory morskie może też rozpatrywać Międzynarodowy Trybunał Prawa Morza w Hamburgu."},{"situation":"Przez dziesięciolecia państwo X prowadziło politykę neutralności i nie należało do żadnego sojuszu wojskowego. Po agresji sąsiedniego mocarstwa na inny kraj jego parlament większością głosów decyduje o złożeniu wniosku o członkostwo w NATO.","question":"Jakie państwa przeszły taką drogę i co było potrzebne do ich przyjęcia?","answer":"Tak zrobiły Finlandia (członek od 2023 r.) i Szwecja (od 2024 r.) po rosyjskiej inwazji na Ukrainę. Przyjęcie nowego członka wymaga zgody wszystkich państw NATO i ratyfikacji protokołu akcesyjnego przez każde z nich — dlatego proces Szwecji opóźniały Turcja i Węgry."},{"situation":"W czasie wojny żołnierze rozstrzeliwują jeńców, którzy się poddali, a lotnictwo celowo bombarduje szpital pełen rannych cywilów.","question":"Jakie prawo zostało naruszone i kto może za to odpowiadać?","answer":"Naruszono międzynarodowe prawo humanitarne (prawo konfliktów zbrojnych), przede wszystkim konwencje genewskie, które chronią jeńców, rannych i ludność cywilną. To zbrodnie wojenne. Odpowiedzialność indywidualną ponoszą zarówno sprawcy, jak i dowódcy, którzy wydali rozkazy — mogą być sądzeni przez sądy krajowe lub Międzynarodowy Trybunał Karny."},{"situation":"Polska i Niemcy podpisują umowę o budowie nowego mostu na Odrze. Minister ogłasza, że „od jutra umowa obowiązuje”.","question":"Co musi się stać, by umowa międzynarodowa zaczęła obowiązywać?","answer":"Podpisanie zwykle nie wystarcza. Umowa musi zostać ratyfikowana (w Polsce przez Prezydenta, w ważniejszych sprawach po wyrażeniu zgody przez Sejm i Senat w ustawie) albo zatwierdzona, zależnie od jej rodzaju. Wchodzi w życie w dniu określonym w umowie, np. po wymianie dokumentów ratyfikacyjnych, i jest ogłaszana w Dzienniku Ustaw."}],"quiz":[{"q":"W którym roku powstała Organizacja Narodów Zjednoczonych?","options":["1919","1945","1949","1957"],"correct":1,"explain":"ONZ powstała w 1945 r. na mocy Karty Narodów Zjednoczonych, jako następczyni Ligi Narodów."},{"q":"Ilu członków liczy Rada Bezpieczeństwa ONZ?","options":["5","10","15","20"],"correct":2,"explain":"Pięciu stałych członków z prawem weta oraz dziesięciu niestałych wybieranych na dwa lata."},{"q":"Które państwo nie jest stałym członkiem Rady Bezpieczeństwa?","options":["Francja","Chiny","Niemcy","Rosja"],"correct":2,"explain":"Stali członkowie to USA, Rosja, Chiny, Wielka Brytania i Francja."},{"q":"Jaki charakter mają uchwały Zgromadzenia Ogólnego ONZ?","options":["zawsze wiążący","co do zasady niewiążący — są zaleceniami","wiążący tylko dla mocarstw","wiążący po ratyfikacji"],"correct":1,"explain":"Wiążące dla państw są uchwały Rady Bezpieczeństwa, nie Zgromadzenia Ogólnego."},{"q":"Kiedy Polska przystąpiła do NATO?","options":["1991","1999","2004","2007"],"correct":1,"explain":"12 marca 1999 r., wraz z Czechami i Węgrami."},{"q":"Czego dotyczy art. 5 traktatu waszyngtońskiego?","options":["procedury wystąpienia z NATO","obrony kolektywnej","budżetu sojuszu","misji pokojowych"],"correct":1,"explain":"Napaść na jednego członka uznaje się za napaść na wszystkich."},{"q":"Kiedy jedyny raz formalnie powołano się na art. 5 NATO?","options":["po inwazji na Kuwejt","po zamachach z 11 września 2001 r.","po aneksji Krymu","po wojnie w Kosowie"],"correct":1,"explain":"Stany Zjednoczone uruchomiły art. 5 po zamachach z 11 września 2001 r."},{"q":"Kto może być stroną postępowania przed Międzynarodowym Trybunałem Sprawiedliwości?","options":["osoby fizyczne","wyłącznie państwa","organizacje pozarządowe","korporacje"],"correct":1,"explain":"MTS rozstrzyga spory między państwami; jednostki nie mają przed nim zdolności procesowej."},{"q":"Kogo sądzi Międzynarodowy Trybunał Karny?","options":["państwa","osoby fizyczne","organizacje międzynarodowe","partie polityczne"],"correct":1,"explain":"MTK sądzi jednostki za ludobójstwo, zbrodnie przeciw ludzkości, zbrodnie wojenne i agresję."},{"q":"Gdzie mieści się Europejski Trybunał Praw Człowieka?","options":["w Hadze","w Strasburgu","w Luksemburgu","w Brukseli"],"correct":1,"explain":"ETPC działa w Strasburgu w ramach Rady Europy — w Hadze mieszczą się MTS i MTK."},{"q":"Który nurt teoretyczny zakłada, że państwa dążą przede wszystkim do bezpieczeństwa i potęgi?","options":["liberalizm","realizm","konstruktywizm","funkcjonalizm"],"correct":1,"explain":"Realizm wskazuje na brak nadrzędnej władzy w środowisku międzynarodowym."},{"q":"Jak Karta NZ reguluje użycie siły?","options":["zakazuje bezwzględnie","zakazuje, dopuszczając samoobronę i działania upoważnione przez Radę Bezpieczeństwa","pozostawia swobodę państwom","dopuszcza w razie interesu narodowego"],"correct":1,"explain":"Zakaz z art. 2 ust. 4 ma dwa wyjątki: samoobrona (art. 51) i upoważnienie Rady Bezpieczeństwa."},{"q":"Ile Celów Zrównoważonego Rozwoju przyjęto w Agendzie 2030?","options":["8","12","17","25"],"correct":2,"explain":"ONZ przyjęła 17 Celów Zrównoważonego Rozwoju w 2015 r."},{"q":"Czym jest uznanie dyplomaty za persona non grata?","options":["postawieniem go przed sądem","żądaniem jego odwołania przez państwo przyjmujące","zrzeczeniem się immunitetu","aresztowaniem"],"correct":1,"explain":"To środek dostępny państwu przyjmującemu, które nie może osądzić dyplomaty objętego immunitetem."},{"q":"Które terytorium Rosja zaanektowała w 2014 r.?","options":["Donbas","Krym","Naddniestrze","Abchazję"],"correct":1,"explain":"Aneksję Krymu uznano za nielegalną, bo naruszała zakaz zdobywania terytorium siłą."},{"q":"Kiedy Rosja rozpoczęła pełnoskalową inwazję na Ukrainę?","options":["24 lutego 2014","24 lutego 2022","1 września 2022","11 marca 2021"],"correct":1,"explain":"To największy konflikt zbrojny w Europie od czasów II wojny światowej."},{"q":"Dlaczego Rada Bezpieczeństwa ONZ nie podjęła działań wobec inwazji na Ukrainę?","options":["Bo Ukraina nie należy do ONZ","Bo Rosja jako stały członek ma prawo weta","Bo zabrakło kworum","Bo sprawę przejął MTK"],"correct":1,"explain":"To najczęściej przywoływany przykład paraliżu Rady Bezpieczeństwa."},{"q":"W którym roku powstało państwo Izrael?","options":["1917","1947","1948","1967"],"correct":2,"explain":"W 1947 r. ONZ zaproponowała podział Palestyny, a państwo Izrael ogłoszono w 1948 r."},{"q":"Po której wojnie Izrael zajął Zachodni Brzeg, Strefę Gazy i Wzgórza Golan?","options":["wojnie 1948 r.","wojnie sześciodniowej 1967 r.","wojnie Jom Kippur 1973 r.","wojnie w Libanie"],"correct":1,"explain":"Status tych terytoriów pozostaje głównym przedmiotem konfliktu."},{"q":"Co powołały porozumienia z Oslo (1993)?","options":["państwo palestyńskie","Autonomię Palestyńską","protektorat ONZ","unię celną"],"correct":1,"explain":"Kluczowe kwestie — granice, Jerozolima, uchodźcy — pozostały nierozstrzygnięte."},{"q":"Który konflikt wywołał kryzys migracyjny w Europie w 2015 r.?","options":["wojna w Jemenie","wojna domowa w Syrii","wojna w Iraku","konflikt w Libii"],"correct":1,"explain":"Wojna w Syrii trwa od 2011 r. i wypędziła miliony ludzi z domów."},{"q":"Na czym polega zasada komplementarności MTK?","options":["Trybunał działa równolegle do sądów krajowych","Trybunał działa tylko, gdy państwo nie chce lub nie może osądzić sprawcy","Trybunał zastępuje sądy krajowe","Trybunał orzeka wyłącznie na wniosek ONZ"],"correct":1,"explain":"Pierwszeństwo mają sądy krajowe — MTK wkracza dopiero w razie ich bezczynności lub niezdolności."}]},{"id":"systemy-panstw","number":"IV","icon":"Globe","name":"Systemy polityczne państw","blurb":"Ustroje wybranych państw: USA, Wielka Brytania, Francja, Niemcy, Rosja, Szwajcaria, Włochy, Chiny.","status":"ready","topics":[{"id":"usa","title":"Sta
